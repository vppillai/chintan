openapi: 3.1.0

info:
  title: Chintan API
  version: 2.0.0
  summary: Voice brain-dump capture, routing, and notes.
  description: |
    The Chintan API.

    Three rules hold across every endpoint and are not repeated per-operation:

    1. **Authentication.** Every route except the two health probes
       (`/v1/health`, `/v1/health/ready`) and the three inbox routes
       (`/v1/inbox/*`) requires a verified Cognito bearer token. The health
       probes declare `security: []`; the inbox routes declare the
       `deviceKey` scheme — a key issued by `POST /v1/devices`, presented
       as `Authorization: Bearer ck_…` and checked by the service itself.
       Those five, and only those five, are what the API Gateway route
       table admits without its JWT authorizer (plus the CORS preflight
       route, `OPTIONS /{proxy+}`, which the Lambda answers 204). Sign-in
       happens against
       Cognito's managed login, never against this API. The service
       verifies signature, issuer, audience, expiry, and `token_use`
       itself; it does not rely on the API Gateway authorizer alone. There
       is no header-based identity path.
    2. **Errors.** Every non-2xx response is `application/problem+json`
       (RFC 9457). Infrastructure error text is logged, never serialised.
    3. **Pagination.** Every collection is cursor-paginated. There is no
       unbounded list.

    Breaking changes from v1: the `X-User-ID` header is rejected and ignored;
    capture completion is asynchronous; list endpoints return an envelope rather
    than a bare array.

    `info.version` is the version of this contract and moves only when the
    contract does; it is independent of the application release tag
    (`vX.Y.Z`, cut by the deploy pipeline on every production deploy).
  license:
    name: MIT
    url: https://github.com/vppillai/chintan/blob/main/LICENSE

servers:
  - url: https://{apiId}.execute-api.{region}.amazonaws.com
    description: Per-instance API Gateway stage
    variables:
      apiId:
        default: example
      region:
        default: us-west-2

tags:
  - name: health
  - name: settings
  - name: notes
  - name: captures
  - name: search
  - name: usage
  - name: ask
  - name: devices
  - name: inbox
  - name: export

security:
  - cognitoBearer: []

paths:
  /v1/health:
    get:
      tags: [health]
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: The process is running.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }

  /v1/health/ready:
    get:
      tags: [health]
      summary: Readiness probe
      description: |
        Probes DynamoDB and S3. Distinct from liveness: a static answer would
        report healthy while every write failed.
      security: []
      responses:
        '200':
          description: Dependencies reachable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
        '503':
          description: A dependency is unreachable.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /v1/settings:
    get:
      tags: [settings]
      summary: Read settings
      responses:
        '200':
          description: Current settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [settings]
      summary: Replace settings
      description: |
        Returns what was stored, not what was sent: echoing the request body
        back would hide validation coercion from the client.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Settings' }
      responses:
        '200':
          description: Stored settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/notes:
    get:
      tags: [notes]
      summary: List notes
      description: |
        Most recently touched first, with one tier above: the pinned notes
        lead, in `pin_rank` order (a tie broken by the more recently pinned
        first), then the rest by `updated_at`. The cursor pages across the
        two tiers unchanged. The archive is never pinned.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: state
          in: query
          description: Which shelf to list.
          schema:
            type: string
            enum: [active, archived]
            default: active
        - name: tag
          in: query
          description: |
            Restrict to notes carrying this tag. Applied before the page is
            cut, so a page holds up to `limit` matches and `cursor` is set
            only when more matches exist.
          schema: { type: string, maxLength: 40 }
        - name: kind
          in: query
          description: |
            Restrict to notes of this kind. Applied before the page is cut,
            like `tag`: a page holds up to `limit` matches and `cursor` is
            set only when more matches exist. Cursor semantics are unchanged.
          schema:
            type: string
            enum: [note, checklist]
        - name: include
          in: query
          description: |
            `search_text` adds each note's `search_text` to the items — the
            lowercased, marker-stripped body the server searches, capped at
            32 KB per note. Opt-in because the list is fetched constantly and
            renders none of it; a client building an offline full-text corpus
            asks once. Omitted from every other Note response.
          schema:
            type: string
            enum: [search_text]
      responses:
        '200':
          description: A page of notes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotePage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [notes]
      summary: Create a note
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NoteCreate' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Note' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }

  /v1/notes/{noteId}:
    parameters:
      - $ref: '#/components/parameters/NoteId'
    get:
      tags: [notes]
      summary: Read a note
      description: |
        A note belonging to another tenant returns 404, never 403 — a 403 would
        confirm the identifier exists.
      responses:
        '200':
          description: The note, with body and captures.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NoteDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [notes]
      summary: Update a note
      description: |
        Optimistic concurrency. `version` is required and must match the stored
        version; a mismatch returns 409 with the current state so the client can
        reconcile. Without a version, a voice append landing while the editor is
        open would be overwritten by the next save.

        One 409 is not a conflict to reconcile. While the worker is writing a
        recording's paragraph into this note's body, a save that carries `body`
        is refused with the same problem shape plus `reason:
        append_in_progress` and a `Retry-After` header. The version has moved
        (the append bumps it before it writes) but the body it witnesses has not
        landed yet, so re-reading and rebasing would send the save into exactly
        the window it was kept out of. Send the SAME save again, unchanged,
        after `Retry-After`; once the paragraph is in the body the normal 409
        follows and the normal conflict handling is right.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NoteUpdate' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Note' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/NoteConflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
    delete:
      tags: [notes]
      summary: Archive a note
      description: Soft delete. Retained 30 days, then purged by TTL.
      responses:
        '204': { description: Archived. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/notes/{noteId}/restore:
    parameters:
      - $ref: '#/components/parameters/NoteId'
    post:
      tags: [notes]
      summary: Restore an archived note
      responses:
        '200':
          description: Restored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Note' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/notes/{noteId}/permanent:
    parameters:
      - $ref: '#/components/parameters/NoteId'
    delete:
      tags: [notes]
      summary: Delete a note and all its artifacts, irreversibly
      description: |
        Cascades to every capture, audio file, and transcript. A partial cascade
        failure returns 500 and leaves the note marked for retry — it does not
        report success while orphaning audio.
      responses:
        '204': { description: Purged. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/notes/{noteId}/recordings/urls:
    parameters:
      - $ref: '#/components/parameters/NoteId'
    get:
      tags: [notes]
      summary: Presigned download URLs for every recording of a note
      description: |
        The bulk download manifest. One entry per capture of the note whose
        audio still exists (retention expiry removes audio from finished
        captures, and those are left out rather than handed over as URLs that
        404), oldest first, each with a presigned GET valid for fifteen
        minutes and the filename to save it under:
        `<note-title-slug>-<yyyymmdd-hhmm>.<ext>`, with `-2`, `-3` for two
        recordings in the same minute. The client zips them itself; nothing
        here needs a round trip per recording. At most 200 entries.
      responses:
        '200':
          description: The manifest. `items` is empty, never null, for a note with no audio.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordingURLs' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/notes/{noteId}/clean:
    parameters:
      - $ref: '#/components/parameters/NoteId'
    post:
      tags: [notes]
      summary: Regenerate the whole-note cleaned view
      description: |
        Queues one pass of the cleanup model over the ENTIRE note body and
        answers 202 at once; the worker runs it asynchronously and the result
        appears as `cleaned` on `GET /v1/notes/{noteId}` (poll for a
        `generated_at` later than the one you saw, or for `error`). Nothing
        runs on the request path: the request checks the note, reserves
        nothing, and hands the note to the worker.

        The body is optional. `mode` is `polished` (coherent prose, light
        touch on wording) or `structured` (Markdown with short headings and
        lists) for a plain note, and `tasks` — the only mode for a checklist:
        the items rewritten as granular, actionable tasks, one item holding
        several actions split into one per action, done items kept verbatim
        and in place, nothing invented or merged; the result is task-list
        lines and nothing else (a model answering in prose is recorded as
        `cleaned.error` "the cleanup model returned nothing usable"; at most
        500 items). Absent, the note's own `cleaned_mode` is used, else
        `structured` (`tasks` for a checklist). A mode that does not fit the
        kind is 400 (see `NoteCleanRequest`). A second request while one is queued is accepted: in the
        same mode it joins the run in flight rather than starting another; in the
        other mode it supersedes it, and the superseded run stores nothing.

        The cleaned view is read-only. It is derived from the body, so an edit
        belongs in `body` (PATCH) and the view is regenerated from it; there
        is no request that writes `cleaned.body`.

        Limits: a body over 150 KB (markers stripped) is refused by the worker
        with `cleaned.error`; a result over 200 KB is refused whole rather than
        truncated. In both cases, and after any provider failure, the previous
        view is kept and `cleaned.error` says what happened.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NoteCleanRequest' }
      responses:
        '202':
          description: Queued. `mode` is the mode the worker will write.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NoteCleanQueued' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The note is archived; restore it first.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/SpendCapped' }

  /v1/notes/purge:
    post:
      tags: [notes]
      summary: Permanently delete several archived notes
      description: |
        Batch purge. This is the only batch endpoint, and the reason is cost of
        failure rather than convenience: archive and restore are reversible and
        cheap, so a client does those as N ordinary calls, while a purge
        cascades to every capture's audio, raw transcript, routed transcript,
        cleaned text, segments and peaks. Driving a hundred of those from a
        phone is a hundred round trips that must all survive the connection, and
        a partial failure leaves objects orphaned with nothing tracking which.

        Explicit identifiers only. There is deliberately no "all" flag and no
        filter — "clear all" is the client listing its archive and sending the
        ids in batches — because a server-side delete-everything switch is one
        malformed request away from emptying an account.

        **Only archived notes are purged.** An id naming an active note comes
        back `failed` and is left alone, so a client working from a stale
        listing cannot turn "clear my archive" into "delete my notes".

        The response is 200 even when some notes failed. No transaction spans
        DynamoDB and S3, so a single verdict for the batch would be a claim the
        server cannot make; each note reports its own outcome and the client
        shows what survived.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotePurgeRequest' }
      responses:
        '200':
          description: One result per requested note, in the order requested.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotePurgeResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }

  /v1/notes/pins:
    post:
      tags: [notes]
      summary: Reorder the pinned notes
      description: |
        Writes the Pinned group's order in one request: each listed note's
        `pin_rank` becomes its position in `ids` × 1000, and the notes come
        back in that order. Every id must be one of the caller's pinned,
        active notes, named once; anything else refuses the whole request
        (400 `every id must be one of your pinned notes`). One request per
        drag. Pinning and unpinning is `NoteUpdate.pinned`. A note whose
        version moves while its rank is being written is re-read and
        written once more, a few times; a note that keeps moving is 409
        with nothing else of the order changed after it.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotePinsRequest' }
      responses:
        '200':
          description: The listed notes, in the order sent, with their new ranks.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotePage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }

  /v1/notes/match:
    post:
      tags: [notes]
      summary: Rank notes against a vague description
      responses:
        '200':
          description: Ranked candidates with a confidence score.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatchResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string, minLength: 1, maxLength: 2000 }

  /v1/tags:
    get:
      tags: [notes]
      summary: List tags in use, with counts
      responses:
        '200':
          description: Tags.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [name, count]
                      properties:
                        name: { type: string }
                        count: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/search:
    get:
      tags: [search]
      summary: Full-text search across titles, aliases, tags and bodies
      description: |
        Matches every term against the note index: title, aliases, tags, the
        snippet and the stored `search_text` (the lowercased body, capped at
        32 KB). `matched_in` reports `body` for a snippet or search-text hit.
        Bodies are never fetched from object storage per query. Transcripts
        are not indexed separately: the cleaned text of every capture is in
        the note body, so it is covered by `body`.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 500 }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of results with match context.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/usage:
    get:
      tags: [usage]
      summary: The caller's own provider usage for one month
      description: |
        What this account cost and did in one month, from the per-tenant rows
        the worker writes on every priced provider call and the API writes on
        every authenticated request: the month's provider totals, the same
        split by operation (`transcribe`, `route`, `cleanup`, `clean_note`,
        `ask`) and by provider (`providers`), the authenticated API requests
        made (`api`), one line per day with any usage, request or storage
        snapshot, and what the recordings and notes occupy (`storage`: the
        footprint now, computed from the index rows at read time, and the
        month's byte-days and note-days from the worker's daily snapshot).
        Microdollars throughout — the unit the spend cap uses. A month with
        no usage answers zeros, not 404.

        Beside it, `aws`: what the instance itself cost in AWS that month, as
        last read from the stack's AWS Budget by the worker's daily task
        (`budgets:DescribeBudget`; nothing calls Cost Explorer). The figure is
        instance-level — the account's bill — and null when nothing has been
        recorded for the month: the stack has no budget, or the task has not
        run since the month began. `aws.share_micros` is this caller's slice
        of it, apportioned by their share of the instance's provider spend for
        the month (`share_basis: provider_cost`); null when the instance spent
        nothing at the providers.

        This is the caller's own usage only. There is no cross-tenant view on
        this API; `chintanctl usage` is the operator's listing.
      parameters:
        - name: month
          in: query
          description: Calendar month, UTC, as `yyyy-mm`. Defaults to the current month.
          schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
      responses:
        '200':
          description: The month's usage.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/ask:
    post:
      tags: [ask]
      summary: Ask a question over your notes
      description: |
        Writes the question, hands it to the worker and answers 202 at once
        with the row in status `pending`; poll `GET /v1/ask/{askId}` for the
        answer. Nothing runs on the request path: retrieval over the notes and
        the one model call happen in the worker, the same way the whole-note
        clean does, because the API's integration is bounded by the gateway's
        30-second ceiling and that work is not.

        The worker ranks the caller's active notes lexically against the
        question (title, aliases and tags, then the searchable body text),
        reads the bodies of the top few, packs excerpts into one prompt within
        a fixed budget, and asks the model to answer ONLY from those notes and
        to cite the ones it used. A question the notes do not answer comes
        back `grounded: false` with an answer that says so. Note content is
        fenced as data in the prompt; instructions found inside a note are not
        followed.

        `history` is at most six earlier turns of THIS conversation, oldest
        first, so a follow-up ("and when was that?") resolves. It is context
        for the model only; retrieval is over the notes, never over history.

        The request body is capped at 16 KB. A history carried whole with long
        answers can exceed that; the client is expected to cut earlier answers.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AskRequest' }
      responses:
        '202':
          description: Accepted. The row is `pending`; poll for the answer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ask' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/SpendCapped' }
        '503':
          description: The worker is not configured on this instance, so a question has nowhere to go.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /v1/ask/{askId}:
    parameters:
      - $ref: '#/components/parameters/AskId'
    get:
      tags: [ask]
      summary: Read a question and its answer
      description: |
        The caller's own rows only; another tenant's id is 404. Rows live 24
        hours, after which the id is 404 as well. `status` moves from
        `pending` to `answered` or `failed`; `answer`, `sources` and
        `grounded` are meaningful once `answered`, `error` once `failed`.
      responses:
        '200':
          description: The question, and its answer once the worker has run.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ask' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/devices:
    get:
      tags: [devices]
      summary: List devices
      description: |
        The caller's live device keys — name, when issued, when last used.
        Never the key or its hash; a key that is lost is revoked and a new
        one issued. Revoked devices are not listed.
      responses:
        '200':
          description: The live devices, oldest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DevicePage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [devices]
      summary: Issue a device key
      description: |
        Issues a key an external recorder, watch or app presents to the
        inbox routes as `Authorization: Bearer ck_…`. The key is in this
        response and nowhere else: only its SHA-256 is stored, and this
        operation takes no `Idempotency-Key`, so no replay record holds it.
        Clients must not retry this request: an attempt whose 201 was lost
        has still issued a key, and a retry issues a second one nobody
        will see. At most ten live devices (409 `you already have ten devices; remove
        one first`). See `docs/design/inbox.md` and the README's "Connect a
        device".
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceCreate' }
      responses:
        '201':
          description: The device and, once, its key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: Ten devices already.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }

  /v1/devices/{deviceId}:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    delete:
      tags: [devices]
      summary: Revoke a device key
      description: |
        The key stops working at once: the inbox answers it 401 `unknown
        device key` from then on. Revoking a revoked device is 204 again; a
        device that is not the caller's is 404.
      responses:
        '204':
          description: Revoked.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/captures:
    get:
      tags: [captures]
      summary: List captures
      description: |
        `status=pending` backs the progress card, which must survive navigation
        and reload. An in-flight capture id held only in a JavaScript variable
        would be lost on refresh, stranding the audio with no UI anywhere to
        recover it.
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, failed, needs_target, all]
            default: all
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of captures.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CapturePage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [captures]
      summary: Begin a capture
      description: |
        Synchronous and fast: it writes the capture row and returns a presigned
        upload URL. The upload event drives the pipeline asynchronously. Nothing
        slow happens on this request — API Gateway caps integrations at 30s and
        an STT plus LLM pipeline does not fit inside that.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CaptureCreate' }
      responses:
        '201':
          description: Capture created; upload the audio to `upload.url`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaptureCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/SpendCapped' }

  /v1/captures/{captureId}:
    parameters:
      - $ref: '#/components/parameters/CaptureId'
    get:
      tags: [captures]
      summary: Read capture state
      responses:
        '200':
          description: The capture.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Capture' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [captures]
      summary: Delete one recording and the text it dictated
      description: |
        Removes the capture's paragraph from its note — the text from the
        capture's append marker up to the next marker or the end of the body,
        whatever the user has since made of it — refreshes the note's snippet
        and search text, then deletes the audio, transcripts, segments and
        peaks and finally the capture itself. A capture that never appended
        (failed, `needs_target`, `no_content`) loses its row and objects only.

        Irreversible, and the API asks for no confirmation: the typed
        confirmation is the client's. Idempotent in effect — a second call for
        the same id is 404.
      responses:
        '204':
          description: The recording and its paragraph are gone.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            The capture is still moving through the pipeline. Deleting it
            while the worker may be writing its paragraph would leave the
            text behind with nothing pointing at it; wait for a terminal
            status.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /v1/captures/{captureId}/target:
    parameters:
      - $ref: '#/components/parameters/CaptureId'
    post:
      tags: [captures]
      summary: Resolve a needs_target capture
      description: |
        Supply either an existing `note_id` or a `new_note_title`. A low-confidence
        match never silently creates or overwrites a note.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CaptureTarget' }
      responses:
        '200':
          description: Target accepted; the pipeline resumes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Capture' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/captures/{captureId}/move:
    parameters:
      - $ref: '#/components/parameters/CaptureId'
    post:
      tags: [captures]
      summary: Move a recording and its text to another note
      description: |
        Cuts the capture's paragraph out of its note along the same boundary
        DELETE uses, inserts it into the target **in chronological position**
        among the target's own recordings (by `created_at`; a target with no
        recordings gets it at the end), keeps the marker so later edits and
        the worker's guard still know the paragraph, re-points the capture,
        and refreshes both notes' snippet and search text. The transcript is
        not re-run.

        The target is an existing `note_id` or a `new_note_title`, as on
        `/target`, never both (400 `supply either note_id or new_note_title,
        not both`; neither is 400 `supply either note_id or new_note_title`).
        With a title the note is created first, empty, and the recording
        moves into it exactly as above, so its text is the new note's first
        paragraph; the answer is the 200 below and the capture's `note_id`
        is the new note's id — `GET /v1/notes/{note_id}` opens it. The
        capture is checked before the note is made, so a refusal (404, 409)
        leaves no empty note behind, and neither does the 503 below: the note
        is made before the move, and a move that fails with nothing written
        into it — every rolled-back failure — removes it again, so a repeat of
        the request makes one fresh note, not one per attempt. A move that
        fails after the text is in the new note (a 500) keeps that note, since
        it holds the only copy of the text, and the capture still names its
        old note; a repeat moves the capture into a second new note, and the
        first is an ordinary note to delete or merge by hand. Its id is in the
        server log.

        The two note bodies are written one after the other, each under an
        ETag condition. If the second write fails the first is undone and the
        answer is a 503 whose `type` is
        `https://github.com/vppillai/chintan/blob/main/docs/api/openapi.yaml#retryable`:
        nothing changed, repeat the request.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CaptureMove' }
      responses:
        '200':
          description: Moved; the capture now names the target note.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Capture' }
        '204':
          description: The capture was already in that note. Nothing changed.
        '400':
          description: |
            Neither or both of `note_id` and `new_note_title`, a title that
            is blank or over 200 characters (`title is required`, `title is
            N characters; the limit is 200`), or a body that is not the JSON
            object above (`the request body is not valid JSON for this
            endpoint`, unknown fields included).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: No such capture, or no such target note, for this tenant.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: |
            The target note is archived (restore it first), the capture has no
            note yet (use `/target`), or the capture is still moving through
            the pipeline.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503': { $ref: '#/components/responses/Retryable' }

  /v1/captures/{captureId}/retry:
    parameters:
      - $ref: '#/components/parameters/CaptureId'
    post:
      tags: [captures]
      summary: Retry a failed capture from its last good stage
      description: |
        Genuinely idempotent. The append is guarded by a token written in the
        same conditional update that marks the capture appended, so a retry that
        finds a matching token skips the append rather than duplicating the text.

        A capture that is `failed` or `spend_capped` is retried at once. A
        capture still in flight (`uploaded`, `transcribing`, `transcribed`,
        `routing`, `cleaned`, `cleaning`, `appending`) is refused with 409
        while a worker may still be working on it: until the worker has not
        written the row for 15 minutes (its own maximum lifetime), and for
        `appending` until the append claim's 20-minute lease has run out — a
        retry inside it cannot take the claim and would only dead-letter. A
        client that offers Retry for a stalled capture should offer it no
        earlier than that, and show the 409's `detail` when it is early.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Retry accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Capture' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            The capture has finished (`appended`, `no_content`) or is waiting
            on a person (`needs_target`), or it is still in flight and a worker
            may still be working on it — see the description for when a
            stalled capture becomes retryable. `detail` says which.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/SpendCapped' }

  /v1/captures/{captureId}/retranscribe:
    parameters:
      - $ref: '#/components/parameters/CaptureId'
    post:
      tags: [captures]
      summary: Transcribe a finished recording again, in another language
      description: |
        For a recording that came back in the wrong script or with sentences
        missing. The audio is kept, so it can be transcribed once more: the
        capture goes back to `transcribing` and the worker runs the pipeline
        again — transcribe in `language` (omitted: the note's effective
        language, its own `language` else the tenant's `default_language`),
        strip spoken instructions with the destination pinned, clean — and
        then **replaces** the paragraph the recording dictated where it
        stands in the note, by its marker. A checklist item is replaced as
        one line, and a ticked one stays ticked. The earlier text stays
        visible until the new one lands. The destination note is kept; a
        `needs_target` capture is routed again from the new transcript. The
        language asked for is remembered on the capture — it is what
        `language` reads once the new transcript lands — so a later change
        of the note's language does not transcribe this recording again on
        its own.

        Priced as one more transcription and cleanup under the daily spend
        cap. Poll the capture as the filing row does; it reaches `appended`
        when the paragraph has been replaced.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CaptureRetranscribe' }
      responses:
        '202':
          description: Accepted; the capture is `transcribing` again.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Capture' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            The capture is still in flight and a worker may still be working
            on it (the same rule as `/retry`), the recording's audio has
            already been deleted by the retention rule, so there is nothing
            to transcribe, or its note is archived (restore it first, as for
            a move). `detail` says which.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/SpendCapped' }

  /v1/captures/{captureId}/download:
    parameters:
      - $ref: '#/components/parameters/CaptureId'
      - name: kind
        in: query
        required: true
        schema:
          type: string
          enum: [audio, raw, clean, segments, peaks]
    get:
      tags: [captures]
      summary: Get a short-lived presigned URL for a capture artifact
      description: |
        `segments` is the timestamped raw transcript that drives tap-to-seek.
        `peaks` is a precomputed amplitude envelope so drawing a waveform does
        not require downloading the whole audio file.

        Captures created before segments and peaks were stored have neither and
        return 404 for those kinds.
      responses:
        '200':
          description: A presigned URL.
          content:
            application/json:
              schema:
                type: object
                required: [url, expires_at]
                properties:
                  url: { type: string, format: uri }
                  expires_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/inbox/captures:
    post:
      tags: [inbox]
      summary: Begin a capture from a device (two-step)
      description: |
        `POST /v1/captures` for a device: the capture row and the presigned
        PUTs, for a client that can make two requests (an iOS Shortcut
        can). The capture carries `source: device:<id>` and flows through
        the pipeline exactly as a recording made in the app. `language`
        chooses the transcription language for this recording alone.
      security:
        - deviceKey: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InboxCaptureCreate' }
      responses:
        '201':
          description: Capture created; PUT the audio to `upload.url` with `upload.headers`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaptureCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/SpendCapped' }

  /v1/inbox/audio:
    post:
      tags: [inbox]
      summary: Drop a recording into the inbox (one-shot)
      description: |
        The body is the recording — raw, with `Content-Type` naming its audio
        type, or a `multipart/form-data` form whose `audio` part is the
        recording (the shape a webhook posts; the Pebble Index ring's is
        one). The API writes the object to the capture's audio key itself,
        with the same retention tags a client's PUT carries, and the bucket's
        notification runs the pipeline as for any upload. For a client that
        can only POST a file. At most 4 MiB, form envelope included (413
        above it): the gateway hands the body to the function base64-encoded
        under a 6 MB cap, so a longer recording goes through
        `/v1/inbox/captures` and its PUT. Optional headers: `X-Chintan-Note-Id` (file into this note),
        `X-Chintan-Language` (`auto` or a code, for this recording),
        `X-Chintan-Duration-Ms`, `X-Chintan-Recorded-At` (when the device
        recorded; telemetry only); on a form that carries only a
        `transcription` the language and duration are ignored, since there is no audio.
        Retries: a webhook that cannot set `Idempotency-Key` (the ring's
        cannot) files a second capture when it retries. A sender that sets
        one must resend the identical bytes — the key is bound to a
        fingerprint of the raw body, and a re-encoded multipart form has a
        new boundary, so the retry is 409 `this Idempotency-Key was used for
        a different request`.
      security:
        - deviceKey: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/InboxNoteId'
        - $ref: '#/components/parameters/InboxRecordedAt'
        - name: X-Chintan-Language
          in: header
          schema: { type: string, pattern: '^(auto|[a-z]{2})$' }
        - name: X-Chintan-Duration-Ms
          in: header
          schema: { type: integer, minimum: 0 }
      requestBody:
        required: true
        description: |
          The recording, in one of two shapes. Raw: the body is the audio and
          `Content-Type` is its type, one of `audio/webm`, `audio/ogg`,
          `audio/mp4`, `audio/m4a`, `audio/mpeg`, `audio/wav`, `audio/x-wav`
          (400 for anything else). A form: `multipart/form-data` with an
          `audio` part whose own `Content-Type` is the audio type, from the
          same list (a part with none is 400 `Content-Type is required: the
          recording's audio type`: RFC 7578 makes an untyped part
          `text/plain`), filed exactly as a raw body is; and, optionally, a
          `transcription` part, the sender's own text (invalid UTF-8 in it
          becomes U+FFFD, as on `/v1/inbox/text`). With no `audio` part, the `transcription` is filed as
          `/v1/inbox/text` files text (the capture starts at `transcribed`
          with `has_audio: false`); with both, the audio is filed and the
          transcription dropped, because the pipeline transcribes with the
          note's language. A form with neither is 400 `the form has no audio
          or transcription part`. `recordedAt`, which the ring also sends,
          is kept on the row as telemetry (see `X-Chintan-Recorded-At`);
          `client` is ignored.
        content:
          audio/*:
            schema: { type: string, format: binary }
          multipart/form-data:
            schema:
              type: object
              properties:
                audio:
                  type: string
                  format: binary
                  description: The recording; the part's own `Content-Type` is its audio type, and is required.
                transcription:
                  type: string
                  description: The sender's own transcription; filed only when there is no `audio` part.
                recordedAt:
                  type: integer
                  format: int64
                  description: |
                    Milliseconds since the Unix epoch, the moment the ring
                    recorded. Telemetry only, as `X-Chintan-Recorded-At`
                    is: kept on the row, never on the wire, ignored when
                    unparseable or implausible.
                client:
                  type: string
                  description: Ignored.
      responses:
        '202':
          description: The recording is stored and the pipeline is running; the capture is `uploaded` (or `transcribed`, for a form that carried only a transcription).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/SpendCapped' }

  /v1/inbox/text:
    post:
      tags: [inbox]
      summary: Drop text into the inbox
      description: |
        A capture that needs no transcription: the text is written where the
        transcript would be, the capture starts at `transcribed` with
        `has_audio: false` and no duration, and the worker routes, cleans
        and appends it as it would a transcript. 1 to 20,000 characters.
        The target note is the body's `note_id` or, for a client that can
        set headers but cannot build the JSON, the `X-Chintan-Note-Id`
        header; the body wins when both are sent. A form on
        `/v1/inbox/audio` that carries only a `transcription` is filed by
        this rule too. `X-Chintan-Recorded-At` is read as on the audio
        route.
      security:
        - deviceKey: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/InboxNoteId'
        - $ref: '#/components/parameters/InboxRecordedAt'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InboxText' }
      responses:
        '202':
          description: The text is stored and the pipeline is running.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/SpendCapped' }

  /v1/export:
    post:
      tags: [export]
      summary: Start a full export
      description: |
        Enumerates by S3 prefix and DynamoDB partition rather than by entity
        type, so a future schema addition cannot silently fall out of the export.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Export started.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportJob' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/export/{exportId}:
    parameters:
      - name: exportId
        in: path
        required: true
        schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
    get:
      tags: [export]
      summary: Poll an export
      responses:
        '200':
          description: Export state, with a download URL once ready.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportJob' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    cognitoBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A Cognito ID or access token. Verified in-process: signature against the
        pool's JWKS, plus issuer, audience, expiry, and `token_use`.
    deviceKey:
      type: http
      scheme: bearer
      bearerFormat: ck_<id>_<secret>
      description: |
        A device key from `POST /v1/devices`, for the `/v1/inbox/*` routes
        only. Stored as a SHA-256 hash and compared in constant time; a
        revoked or unknown key is 401 `unknown device key`, and a key past
        two hundred requests in a UTC day is 429 `this device has reached
        today's limit` — fixed sentences, whichever the reason. Three
        spellings of the one credential are accepted: `Authorization: Bearer
        ck_…`; the same value bare, `Authorization: ck_…`, for a webhook form
        that takes header key/value pairs and knows no scheme; and
        `X-Device-Key: ck_…`, for a non-browser client whose Authorization
        header is spoken for (read first when both are sent); it is not in
        the CORS allow-list, so a browser page cannot send it. The check and
        the 401 are the same for all three.

  parameters:
    Cursor:
      name: cursor
      in: query
      description: Opaque continuation token from the previous page.
      schema: { type: string, maxLength: 2048 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    NoteId:
      name: noteId
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
    CaptureId:
      name: captureId
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema: { type: string, pattern: '^dev_[0-9a-f]{12}$' }
    AskId:
      name: askId
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
    InboxNoteId:
      name: X-Chintan-Note-Id
      in: header
      description: |
        File this capture into this note, for a client that can set headers
        but cannot build JSON. On `/v1/inbox/text` the body's `note_id` wins
        when both are sent. Another tenant's note, or none, is 404.
      schema: { type: string }
    InboxRecordedAt:
      name: X-Chintan-Recorded-At
      in: header
      description: |
        When the device recorded, as milliseconds since the Unix epoch or
        RFC 3339. Telemetry only: it is kept on the capture row for the
        operator's latency figures (`chintanctl latency`), never returned on
        the wire, and ignored — never a 400 — when unparseable, more than
        seven days before now or more than five minutes after it.
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: |
        Replaying a key returns the original response. A double-tap on a flaky
        mobile link must not create two notes. Only a settled response is
        recorded: a 409, a 429 or a 5xx is not, so the retry runs the request
        again. A replay carries the recorded response's own Content-Type.
      schema: { type: string, minLength: 8, maxLength: 128 }

  responses:
    BadRequest:
      description: Malformed or invalid request.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: No such resource for this tenant.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Version conflict; the current state is included.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NoteConflict:
      description: |
        Version conflict; `current_version` is the version to reconcile
        against — unless `reason` is `append_in_progress`, in which case a
        recording's paragraph is on its way into the body, `Retry-After` is
        set, and the client repeats the same save unchanged after it. Only
        PATCH /v1/notes/{noteId} with a `body` produces that reason.
      headers:
        Retry-After:
          description: 'Present only with `reason: append_in_progress`.'
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PayloadTooLarge:
      description: Body or field exceeded its limit.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    SpendCapped:
      description: |
        The daily provider spend cap was reached. Distinct from a generic
        failure so the UI can explain it.

        The body's `type` is
        `https://github.com/vppillai/chintan/blob/main/docs/api/openapi.yaml#spend-capped`.
        That URI is the discriminator, not the title: the gateway's throttling
        429 and this one both read "Too Many Requests", and only one of them
        may be retried.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Retryable:
      description: |
        The operation failed part-way and was rolled back, so nothing changed
        — a move into a `new_note_title` has also removed the note it made —
        and the same request can be repeated. The body's `type` is
        `https://github.com/vppillai/chintan/blob/main/docs/api/openapi.yaml#retryable`
        and a `Retry-After` header is set; a 503 without that type means the
        instance is not configured for the operation, which repeating will
        not fix.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServerError:
      description: Unexpected failure. Correlate via `correlation_id`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      description: RFC 9457 problem detail.
      required: [type, title, status]
      properties:
        type: { type: string, format: uri, default: 'about:blank' }
        title: { type: string }
        status: { type: integer }
        detail:
          type: string
          description: |
            Safe to show a user. Never contains wrapped infrastructure errors —
            serialising upstream messages would leak table names.
        instance: { type: string }
        correlation_id:
          type: string
          description: Matches the `X-Correlation-Id` response header and the server logs.
        current_version:
          type: integer
          description: Present on 409 so the client can reconcile.
        reason:
          type: string
          enum: [append_in_progress]
          description: |
            Present on the one 409 the client must not reconcile against:
            PATCH /v1/notes/{noteId} refused because the worker is writing a
            recording into the body. Repeat the same save after `Retry-After`.

    Readiness:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, enum: [ok, degraded] }
        checks:
          type: object
          additionalProperties:
            type: object
            properties:
              ok: { type: boolean }
              latency_ms: { type: integer }

    Settings:
      type: object
      required: [cleanup_mode, retention_days, theme]
      properties:
        cleanup_mode:
          type: string
          enum: [faithful, polished]
          default: faithful
        retention_days:
          type: integer
          minimum: 0
          maximum: 3650
          default: 0
          description: |
            Days to retain source audio, as one of a fixed set of tiers:
            **0, 7, 30, 90, 365**. 0 means keep indefinitely.

            Any value in range is accepted, and the value that is STORED — and
            returned by this endpoint, and by the PUT that set it — is the tier
            that will actually be enforced. A request is resolved DOWN to the
            longest tier no longer than it, because a retention setting is a
            promise to delete and rounding it up would break that promise
            silently; a value below the shortest tier becomes the shortest.
            So a client that sends 45 is answered with 30, and must render what
            it was answered rather than what it sent.

            The tiers are fixed because the expiry is performed by an S3
            lifecycle rule, and a rule carries its own period rather than
            reading one out of this record: the upload tags the object with its
            tier and one rule per tier matches it. The tag is what connects this
            field to the bucket: without it the value would be stored, returned
            and shown in the UI while nothing expired anything.
        theme:
          type: string
          enum: [ink, nocturne, system]
          default: ink
        default_language:
          type: string
          default: en
          pattern: '^(auto|[a-z]{2})$'
          description: |
            The transcription language for a capture whose destination note
            sets none, and the first language every routed capture is
            transcribed in: a capture recorded without a `note_id` is
            transcribed before it is routed, and transcribed once more in
            the destination note's `language` when that differs from what
            was sent. A note the router creates starts with this value when
            it is a code. `auto` sends no language and lets Whisper detect
            one per recording. There is no mixed-language mode, and
            auto-detection is not one: it picks a single language per
            recording and drops or re-scripts the speech in any other, so for
            a recording that mixes two languages choose the code of the one
            that matters most. Any other value is an ISO-639-1 code passed to
            the provider as-is; supplying one improves accuracy and latency.
            A record written before this field existed reads as `en`.
        daily_spend_cap_micros:
          type: integer
          minimum: 0
          readOnly: true
          description: |
            The instance-wide daily provider spend ceiling, in microdollars
            (1000000 = $1). 0 means calls are counted but never refused.

            Read-only. It is the operator's number, set in the deployment
            configuration, and is reported here so the app can say what is
            actually enforced. It is a runaway guard — set at roughly a
            hundred times a day's normal spend to stop a loop or a leaked
            key, not a budget anybody plans against — so it does not belong
            on the usage screen next to the month's spend; the app mentions
            it on About, if anywhere. A value sent on PUT is accepted for
            compatibility and ignored; the response carries the instance
            value, which is how a client learns its own did not take. Until
            2026-09 this was a per-tenant cap stored in the settings record,
            and the breaker enforced the lower of the two.

    Note:
      type: object
      required: [id, title, updated_at, version, archived, kind, pinned, pin_rank]
      properties:
        id: { type: string }
        title: { type: string, maxLength: 200 }
        kind:
          type: string
          enum: [note, checklist]
          description: |
            What the body is. `note` is free-form Markdown. `checklist` is one
            item per line in GitHub task-list syntax — `- [ ] text` open,
            `- [x] text` done; blank lines are ignored — and nothing else. A
            recording filed into a checklist is appended as one open item
            (the cleaned transcript collapsed to one line, at most 2,000
            runes), and its cleaned view runs in `tasks` mode only. Settable
            through `NoteCreate` and `NoteUpdate`; the server never converts
            the body, the client sends it converted. Always present; a note
            from before the field existed reads `note`.
        aliases:
          type: array
          maxItems: 32
          items: { type: string, maxLength: 120 }
        tags:
          type: array
          maxItems: 32
          items: { type: string, maxLength: 40 }
        snippet: { type: string }
        updated_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        version: { type: integer }
        archived: { type: boolean }
        purge_after: { type: string, format: date-time, nullable: true }
        verbatim:
          type: boolean
          description: |
            Cleanup is bypassed for this note. Settable through `NoteUpdate` and
            returned on every read, because the toggle has to render the state
            it is in. Declared here only after the frontend↔backend contract
            fixtures caught the API sending a field this document did not list.
        language:
          type: string
          pattern: '^(auto|[a-z]{2})$'
          description: |
            The transcription language for this note's captures: `auto` or
            an ISO-639-1 code. Absent when the note inherits the tenant's
            `default_language`. Settable through `NoteUpdate`. A capture
            recorded into the note (`POST /v1/captures` with this `note_id`)
            is transcribed in it from the start; one the router files here
            afterwards was transcribed in the default first, and is
            transcribed again in this language when the two differ. A note
            the router creates starts with the language its first recording
            was transcribed in, unless that was `auto`.
        search_text:
          type: string
          maxLength: 32768
          description: |
            The note body as the server searches it: append markers removed,
            lowercased, whitespace collapsed, cut to 32 KB on a rune boundary.
            Present only on `GET /v1/notes?include=search_text`. It is derived
            from the body on every write (editor save, worker append,
            `chintanctl backfill-search-text`), so a client may search it
            offline and trust that a hit is also a hit on `GET /v1/search`.
        auto_clean:
          type: boolean
          default: false
          description: |
            The worker regenerates the whole-note cleaned view after every
            change to the body it makes or is told about: a recording
            appended, moved in or out, or deleted. Never on an editor save —
            that marks the view stale and leaves the re-run to the user.
            Settable through `NoteUpdate`; one LLM call per change while on,
            bounded by the daily spend cap.
        cleaned_mode:
          type: string
          enum: [polished, structured, tasks]
          description: |
            The mode an automatic or unspecified clean runs in. Absent means
            `structured`. Settable through `NoteUpdate`. Distinct from
            `cleaned.mode`, which is the mode the stored view was generated in.
            A checklist always reads `tasks` — the only mode it cleans in
            (see `NoteUpdate.cleaned_mode`).
        pinned:
          type: boolean
          description: |
            The note is in Home's Pinned group. Set through `NoteUpdate.pinned`;
            archiving clears it, and a restored note comes back unpinned.
            Always present.
        pin_rank:
          type: integer
          nullable: true
          description: |
            The note's place in the Pinned group, ascending; null when not
            pinned. `GET /v1/notes?state=active` lists the pinned notes first
            in this order (a tie broken by the more recently pinned first),
            then the rest by `updated_at`, and the cursor pages across the
            two tiers unchanged. Rewritten by `POST /v1/notes/pins`.

    NoteCleaned:
      type: object
      description: |
        The whole-note cleaned view: one pass of the cleanup model over the
        entire body, as a Markdown document. Read-only — derived from the body
        by the worker's clean-note task and regenerated by
        `POST /v1/notes/{noteId}/clean` or `auto_clean`; edits belong in
        `body`.
      required: [body, mode, generated_at, stale]
      properties:
        body:
          type: string
          maxLength: 204800
          description: |
            The view, in Markdown. Empty only when the most recent run failed
            before any view existed (`error` says why).
        mode:
          type: string
          enum: [polished, structured, tasks]
          description: |
            The mode `body` was generated in, or of the failed attempt when
            there is no body. In `tasks` mode `body` is a checklist body: one
            `- [ ] ` / `- [x] ` item per line and nothing else.
        generated_at:
          type: string
          format: date-time
          description: When `body` was generated, or when the attempt failed when there is no body.
        stale:
          type: boolean
          description: |
            The body changed after `generated_at` — an append, an editor save,
            a recording moved in or out or deleted — so the view no longer
            reflects it. Cleared by the next successful run.
        error:
          type: string
          description: |
            Present after a failed run: the note was empty, over 150 KB, the
            result was over 200 KB, the model returned nothing usable, the
            daily spend cap was reached, or the provider failed. Fixed
            sentences, safe to display; never provider text. Beside a `body`,
            the previous view was kept. The next successful run removes it.

    NoteCleanRequest:
      type: object
      properties:
        mode:
          type: string
          enum: [polished, structured, tasks]
          description: |
            Absent means the note's `cleaned_mode`, else `structured` (`tasks`
            for a checklist). The mode must fit the note's kind: for a
            checklist anything but `tasks` is 400 `cleaned_mode must be tasks
            for a checklist`; for a plain note `tasks` is 400 `cleaned_mode
            must be polished or structured`.

    NoteCleanQueued:
      type: object
      required: [status, mode]
      properties:
        status: { type: string, enum: [queued] }
        mode: { type: string, enum: [polished, structured, tasks] }

    NoteDetail:
      allOf:
        - $ref: '#/components/schemas/Note'
        - type: object
          required: [body, cleaned]
          properties:
            body: { type: string }
            captures:
              type: array
              items: { $ref: '#/components/schemas/Capture' }
            cleaned:
              nullable: true
              allOf:
                - $ref: '#/components/schemas/NoteCleaned'
              description: |
                The whole-note cleaned view; `null` until the note has been
                cleaned, or a clean has failed, at least once.

    NoteCreate:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        body: { type: string, maxLength: 1048576 }
        kind:
          type: string
          enum: [note, checklist]
          default: note
          description: See `Note.kind`. Any other value is 400 `kind must be note or checklist`.
        aliases:
          type: array
          maxItems: 32
          items: { type: string, maxLength: 120 }
        tags:
          type: array
          maxItems: 32
          items: { type: string, maxLength: 40 }

    NoteUpdate:
      type: object
      required: [version]
      properties:
        version: { type: integer }
        title: { type: string, minLength: 1, maxLength: 200 }
        body: { type: string, maxLength: 1048576 }
        kind:
          type: string
          enum: [note, checklist]
          description: |
            See `Note.kind`. Switching kind does not touch the body: send the
            converted `body` in the same request (plain → checklist: one
            `- [ ] paragraph` per paragraph; checklist → plain: one paragraph
            per item). Any other value is 400 `kind must be note or checklist`.
        aliases:
          type: array
          maxItems: 32
          items: { type: string, maxLength: 120 }
        tags:
          type: array
          maxItems: 32
          items: { type: string, maxLength: 40 }
        verbatim:
          type: boolean
          description: |
            Bypass cleanup entirely for this note. Dictated content that must not
            be reworded — a spec, a quote, a prompt — would otherwise be silently
            rewritten by `polished` mode.
        language:
          type: string
          pattern: '^(auto|[a-z]{2})?$'
          description: |
            Transcription language for captures recorded into this note:
            `auto`, an ISO-639-1 code, or the empty string to inherit the
            tenant's `default_language` again.
        auto_clean:
          type: boolean
          description: See `Note.auto_clean`.
        cleaned_mode:
          type: string
          enum: [polished, structured, tasks]
          description: |
            See `Note.cleaned_mode`. Defaults to `structured`. This is the
            preference for future runs; it does not regenerate the view — use
            `POST /v1/notes/{noteId}/clean` for that. The view itself
            (`cleaned.body`) is read-only and cannot be sent here.

            The mode must fit the note's kind as this request leaves it: a
            checklist takes `tasks` and nothing else (400 `cleaned_mode must be
            tasks for a checklist`), a plain note takes `polished` or
            `structured` (400 `cleaned_mode must be polished or structured`).
            `{kind: checklist, cleaned_mode: tasks}` in one request is fine.
        pinned:
          type: boolean
          description: |
            `true` puts the note in Home's Pinned group, last among the pinned
            notes (`pin_rank` one step, 1000, past the highest rank in use, so
            it lands last even after an unpin has left a gap); `false` takes
            it out. Neither moves `updated_at`: a pin is not an edit, and the
            note keeps its place among the days once unpinned. `version`
            still moves. At most fifty notes are pinned (409 `you can pin up
            to fifty notes`). The order within the group is
            `POST /v1/notes/pins`.

    NotePinsRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 50
          items: { type: string }
          description: The caller's pinned notes, in the order they should hold.

    NotePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Note' }
        cursor:
          type: string
          description: Absent or empty when the collection is exhausted.

    NotePurgeRequest:
      type: object
      required: [note_ids]
      properties:
        note_ids:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: string }
          description: |
            The notes to delete permanently. At most 100 per request, which
            bounds the cascade to what fits inside the API's 29-second ceiling.
            Naming the same note twice is allowed; the repeat reports
            `not_found`.

    NotePurgeResult:
      type: object
      required: [note_id, status]
      properties:
        note_id: { type: string }
        status:
          type: string
          enum: [purged, not_found, failed]
          description: |
            `purged` — the note and everything it owned are gone.
            `not_found` — no such note, which is also what a replayed batch
            reports and is what makes a retry safe.
            `failed` — the note is still here. Either it was not archived, or
            part of its cascade failed and the index row was deliberately kept
            so the delete can be retried, or the batch ran out of time before
            it reached this note (`detail` begins "not attempted") — the
            server stops starting notes about twenty seconds in rather than
            run into the gateway's timeout, and the client sends the rest
            again.
        detail:
          type: string
          description: Safe to display. Never contains provider or AWS internals.

    NotePurgeResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/NotePurgeResult' }

    RecordingURL:
      type: object
      required: [capture_id, filename, url, expires_at]
      properties:
        capture_id: { type: string }
        filename:
          type: string
          description: '`<note-title-slug>-<yyyymmdd-hhmm>.<ext>`, unique within the manifest.'
        url: { type: string, format: uri }
        expires_at: { type: string, format: date-time }

    RecordingURLs:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/RecordingURL' }

    CaptureStatus:
      type: string
      enum:
        - uploaded
        - transcribing
        - routing
        - cleaning
        - appending
        - appended
        - needs_target
        - no_content
        - failed
        - spend_capped

    Capture:
      type: object
      required: [id, status, created_at, version, targeted, source, has_audio]
      properties:
        id: { type: string }
        source:
          type: string
          description: >
            What made the recording: `app` for the app itself, or
            `device:<id>` for a device key's request to the inbox, so a row
            can say "From ⟨device⟩" (`GET /v1/devices` names the id). Always
            present; captures from before the field existed read `app`.
        has_audio:
          type: boolean
          description: >
            False for a capture that arrived as text (`POST /v1/inbox/text`):
            there is no recording to play, download or transcribe again, and
            the row shows the transcript alone. True does not promise the
            audio still exists — retention may have expired it.
        note_id: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/CaptureStatus' }
        error:
          type: string
          nullable: true
          description: Safe to display. Never contains provider or AWS internals.
        suggested_note_id:
          type: string
          nullable: true
          description: >
            The note the router proposed for a `needs_target` capture: plausible
            enough to offer, not confident enough to append to unasked. Present
            only when the router named an existing, active note. A client should
            lead with this rather than with an unranked list of every note.
        suggested_title:
          type: string
          nullable: true
          description: >
            The title the router would give a new note, when it found no
            plausible existing destination. Never set at the same time as
            `suggested_note_id`.
        created_at: { type: string, format: date-time }
        appended_at: { type: string, format: date-time, nullable: true }
        last_progress_at:
          type: string
          format: date-time
          nullable: true
          description: >
            When the capture last moved: the pipeline's last write to it, or
            the API's last hand-off to the worker. Null on captures from
            before it was recorded (2026-09-05), which a client reads as
            `created_at`. The filing row gates Retry on it: a capture
            untouched for longer than the worker's 900 s timeout has no live
            worker.
        duration_ms: { type: integer, nullable: true }
        language:
          type: string
          nullable: true
          description: >
            What the current transcript was asked for: `auto` or an ISO-639-1
            code — the one a person chose at `/retranscribe` when they did,
            else the note's effective language when the recording was
            transcribed. Null until it has been.
        language_detected:
          type: string
          nullable: true
          description: >
            The language the transcription provider reported the speech to be
            in, spelled as the provider spells it and passed through unchanged
            (Groq: `English`, `Malayalam`). Under a chosen
            `language` the provider echoes that language back, so the two
            differ only under `auto`. Null until transcribed.
        has_segments: { type: boolean }
        has_peaks: { type: boolean }
        version: { type: integer }
        targeted:
          type: boolean
          description: >
            True when a person chose the destination: the client named
            `note_id` at `POST /v1/captures` ("Record into this"), or a person
            picked the note via `POST /v1/captures/{id}/target`. False when the
            router decided or nothing has decided yet. The Home screen's
            filing rows show only non-targeted captures; a targeted one is
            already visible in its note's Recordings tab. Captures recorded
            before this field existed read false.

    CapturePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Capture' }
        cursor: { type: string }

    CaptureCreate:
      type: object
      required: [content_type]
      properties:
        content_type:
          type: string
          enum: [audio/webm, audio/mp4, audio/ogg, audio/wav]
        note_id:
          type: string
          nullable: true
          description: Target note when already known. Omit to let routing decide.
        duration_ms: { type: integer, minimum: 0 }
        size_bytes:
          type: integer
          minimum: 0
          description: Used to bound the presigned upload's content-length range; 0 or absent means the API's own cap.

    CaptureCreated:
      type: object
      required: [capture, upload]
      properties:
        capture: { $ref: '#/components/schemas/Capture' }
        upload:
          type: object
          required: [url, expires_at, max_bytes]
          properties:
            url: { type: string, format: uri }
            expires_at: { type: string, format: date-time }
            max_bytes: { type: integer }
            headers:
              type: object
              additionalProperties: { type: string }
        peaks_upload:
          type: object
          description: |
            Presigned PUT for the client-computed waveform envelope. The browser
            already holds the decoded signal from its AnalyserNode while
            recording, so computing peaks there is free; doing it server-side
            would require an audio decoder in Lambda for a compressed Opus
            stream. Optional -- a capture without peaks renders a plain player.
          required: [url, expires_at]
          properties:
            url: { type: string, format: uri }
            expires_at: { type: string, format: date-time }
            max_bytes: { type: integer }

    InboxCaptureCreate:
      type: object
      required: [content_type]
      properties:
        content_type:
          type: string
          enum: [audio/webm, audio/ogg, audio/mp4, audio/m4a, audio/mpeg, audio/wav, audio/x-wav]
        note_id:
          type: string
          nullable: true
          description: File into this note. Omit to let routing decide.
        duration_ms: { type: integer, minimum: 0 }
        size_bytes: { type: integer, minimum: 0 }
        language:
          type: string
          pattern: '^(auto|[a-z]{2})$'
          description: The transcription language for this recording; omit for the note's or the default.

    InboxText:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 20000 }
        note_id:
          type: string
          nullable: true
          description: File into this note. Omit to let routing decide.

    InboxAccepted:
      type: object
      required: [capture]
      properties:
        capture: { $ref: '#/components/schemas/Capture' }

    CaptureTarget:
      type: object
      properties:
        note_id: { type: string }
        new_note_title: { type: string, minLength: 1, maxLength: 200 }
      oneOf:
        - required: [note_id]
        - required: [new_note_title]

    CaptureMove:
      type: object
      properties:
        note_id:
          type: string
          description: The active note to move the recording into.
        new_note_title:
          type: string
          minLength: 1
          maxLength: 200
          description: |
            Create a note with this title and move the recording into it.
            Trimmed and whitespace-collapsed as `NoteCreate.title` is. The
            same field, with the same rules, as `CaptureTarget`.
      oneOf:
        - required: [note_id]
        - required: [new_note_title]

    CaptureRetranscribe:
      type: object
      properties:
        language:
          type: string
          pattern: '^(auto|[a-z]{2})$'
          description: |
            `auto` or an ISO-639-1 code. Omitted, the note's effective
            language is used. Remembered on the capture.

    MatchResponse:
      type: object
      required: [candidates, confidence]
      properties:
        confidence: { type: number, minimum: 0, maximum: 1 }
        auto_selected: { type: boolean }
        auto_select_id:
          type: string
          nullable: true
          description: |
            The note the router picked when it was confident enough to pick one
            — the same fact `auto_selected` reports as a boolean. The routing
            worker reads it. Declared here only after the frontend↔backend
            contract fixtures caught the API sending a field this document did
            not list.
        candidates:
          type: array
          items:
            type: object
            required: [note_id, title, score]
            properties:
              note_id: { type: string }
              title: { type: string }
              score: { type: number }
              reason: { type: string }

    SearchPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [note_id, title]
            properties:
              note_id: { type: string }
              title: { type: string }
              excerpt:
                type: string
                description: Match context with the hit in situ.
              matched_in:
                type: array
                items: { type: string, enum: [title, alias, tag, body, transcript] }
        cursor: { type: string }

    UsageTotals:
      type: object
      required: [cost_micros, calls]
      properties:
        cost_micros:
          type: integer
          description: Reconciled provider cost in microdollars (1000000 = $1).
        calls: { type: integer }
        audio_seconds:
          type: number
          description: Seconds of audio transcribed. Absent when zero.
        input_tokens:
          type: integer
          description: Prompt tokens billed. Absent when zero.
        output_tokens:
          type: integer
          description: Completion tokens billed. Absent when zero.

    UsageAws:
      type: object
      description: |
        The instance's AWS spend for one calendar month (UTC), as last read
        from the stack's AWS Budget, and the caller's share of it.
        `month_micros` is instance-level: every tenant sees the same figure.
      required: [month_micros, as_of, budget_micros, share_micros, share_basis]
      properties:
        month_micros:
          type: integer
          description: The budget's month-to-date actual spend, in microdollars.
        as_of:
          type: string
          format: date-time
          description: When the budget was read. The reading is daily, so the figure may be up to a day old.
        budget_micros:
          type: integer
          nullable: true
          description: The budget's monthly limit, in microdollars; null when the budget reports none.
        share_micros:
          type: integer
          nullable: true
          description: |
            `month_micros` × this caller's provider cost for the month ÷ the
            instance's provider spend for the month (the sum of the breaker's
            daily counters). Null when the instance spent nothing at the
            providers, since there is then nothing to apportion by.
        share_basis:
          type: string
          nullable: true
          enum: [provider_cost]
          description: How `share_micros` was apportioned; null when it is null.

    UsageApi:
      type: object
      required: [requests]
      properties:
        requests:
          type: integer
          description: |
            Authenticated API requests this caller made in the month — the sum of
            `days[].api_requests`. Every authenticated request counts, the app's own
            polling included (`GET /v1/captures` while a recording is processing,
            `GET /v1/ask/{askId}` while a question is pending), so the number
            measures traffic to the API, not actions taken. Health probes and 401s
            are not counted.

    UsageStorage:
      type: object
      description: |
        What the caller's recordings and notes add up to, computed from the
        capture and note index rows when the request is served — and, in
        `byte_days` and `note_days`, what they added up to over the month:
        the worker measures the same footprint once a day and adds it onto
        the month, so the figure survives a delete-all and is what storage
        is billed by. No price is attached server-side.
      required: [recordings, audio_seconds, audio_bytes, notes, approximate, byte_days, note_days]
      properties:
        byte_days:
          type: integer
          description: Sum over the month's daily snapshots of the audio bytes held that day. 0 until the first snapshot of the month; divide by the days in the month for an average footprint, or price it as GB-months.
        note_days:
          type: integer
          description: Sum over the month's daily snapshots of the active notes held that day.
        recordings: { type: integer }
        audio_seconds:
          type: number
          description: The recordings' durations summed, as transcribed.
        audio_bytes:
          type: integer
          description: The recordings' uploaded sizes summed, as S3 reported them. A recording processed before the size was recorded contributes zero.
        notes:
          type: integer
          description: Active notes; the archive is not counted.
        approximate:
          type: boolean
          description: True when the walk behind the numbers stopped at its 2,000-row cap, so they are a floor rather than the total.

    Usage:
      allOf:
        - $ref: '#/components/schemas/UsageTotals'
        - type: object
          required: [month, ops, providers, days, api, storage, aws]
          properties:
            month: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
            aws:
              nullable: true
              allOf:
                - $ref: '#/components/schemas/UsageAws'
              description: |
                The instance's AWS spend for the month and this caller's share
                of it, or null when nothing has been recorded for the month —
                the stack has no budget, or the daily task has not run since
                the month began.
            ops:
              type: object
              description: |
                The month's totals split by operation. Keys are the operations
                that call a provider: `transcribe`, `route`, `cleanup`,
                `clean_note` (the whole-note cleaned view) and `ask` (a
                question over the notes). An operation that made no call in
                the month is absent.
              additionalProperties: { $ref: '#/components/schemas/UsageTotals' }
            providers:
              type: object
              description: |
                The same totals split by provider name (`groq`, `openai` — the
                name the price table is keyed on, so the OpenAI-compatible
                endpoint pointed at MiniMax is `openai`). A provider that made
                no call in the month is absent; the object is empty, never
                null, when none did.
              additionalProperties: { $ref: '#/components/schemas/UsageTotals' }
            days:
              type: array
              description: One entry per day with any usage or any API request, ascending.
              items:
                allOf:
                  - $ref: '#/components/schemas/UsageTotals'
                  - type: object
                    required: [date, api_requests, storage_byte_days]
                    properties:
                      date: { type: string, format: date }
                      api_requests:
                        type: integer
                        description: Authenticated API requests served that day, the app's own polling included; 0 when none.
                      storage_byte_days:
                        type: integer
                        description: The audio bytes held on that day, as the daily storage snapshot found them; 0 on a day it did not run.
            api: { $ref: '#/components/schemas/UsageApi' }
            storage: { $ref: '#/components/schemas/UsageStorage' }

    Device:
      type: object
      required: [id, name, created_at, last_used_at, usage_month]
      properties:
        id: { type: string }
        name: { type: string, maxLength: 60 }
        created_at: { type: string, format: date-time }
        last_used_at:
          type: string
          format: date-time
          nullable: true
          description: When the inbox last accepted a request with this key; null until it has.
        usage_month:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/DeviceUsage'
          description: |
            What the key sent in the current UTC month, or null when nothing
            — a fresh device, and one that last sent in an earlier month.

    DeviceUsage:
      type: object
      required: [requests, bytes, month]
      properties:
        requests:
          type: integer
          description: Inbox requests the key was accepted for this month. Requests, not recordings; a two-step upload is two.
        bytes:
          type: integer
          description: The bodies of those requests, summed; a request whose length was not declared adds nothing.
        month:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          description: The UTC month the counters are for, as yyyy-mm.

    DeviceCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
          description: What to call the device; a recording from it says "From ⟨name⟩".

    DeviceCreated:
      allOf:
        - $ref: '#/components/schemas/Device'
        - type: object
          required: [key]
          properties:
            key:
              type: string
              description: |
                `ck_<id>_<secret>`. Shown once. The device sends it as
                `Authorization: Bearer ck_…` on the `/v1/inbox/*` routes.

    DevicePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Device' }

    AskRequest:
      type: object
      required: [question]
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 1000
          description: The question, 1–1000 characters after trimming.
        history:
          type: array
          maxItems: 6
          description: |
            At most six earlier turns of THIS conversation, oldest first, so a
            follow-up resolves. Context for the model only; retrieval is over
            the notes.
          items: { $ref: '#/components/schemas/AskTurn' }

    AskTurn:
      type: object
      required: [question, answer]
      properties:
        question: { type: string, maxLength: 1000 }
        answer: { type: string, maxLength: 4000 }

    AskSource:
      type: object
      required: [note_id, title]
      properties:
        note_id: { type: string }
        title: { type: string }

    Ask:
      type: object
      required: [id, status, question, answer, grounded, sources, error, notes_considered, created_at, answered_at]
      properties:
        id: { type: string }
        status:
          type: string
          enum: [pending, answered, failed]
        question: { type: string }
        answer:
          type: string
          nullable: true
          description: |
            The answer once `answered`, else null. Plain text; may contain
            simple Markdown (paragraphs, "- " lists, **bold**). No headings.
            Capped at 8,000 characters — a longer answer is refused whole and
            the row is `failed`.
        grounded:
          type: boolean
          description: True when the answer was drawn from notes; false when the honest answer is "that is not in your notes", and while pending.
        sources:
          type: array
          description: Only notes that were actually given to the model AND that it cited, in relevance order. Never null; empty while pending.
          items: { $ref: '#/components/schemas/AskSource' }
        error:
          type: string
          nullable: true
          description: A fixed sentence when `failed`, else null. Never provider text.
        notes_considered:
          type: integer
          description: How many notes were in the retrieval window.
        created_at: { type: string, format: date-time }
        answered_at: { type: string, format: date-time, nullable: true }

    ExportJob:
      type: object
      required: [id, status]
      properties:
        id: { type: string }
        status: { type: string, enum: [pending, running, ready, failed] }
        url: { type: string, format: uri, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }
        bytes: { type: integer, nullable: true }
