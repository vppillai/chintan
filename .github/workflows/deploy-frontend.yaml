name: Deploy Frontend

on:
  workflow_run:
    workflows: ["Deploy Backend"]
    types: [completed]
    branches: [main]
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yaml'
  workflow_dispatch:

env:
  AWS_REGION: us-west-2
  PAGES_OWNER: vppillai
  PAGES_REPO: chintan

permissions:
  id-token: write
  contents: read
  pages: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and Deploy Pages
    runs-on: ubuntu-latest
    environment: production
    # Only auto-follow successful backend deploys; allow manual/push otherwise.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/chintan-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Build instance sites
        id: build
        run: |
          set -euo pipefail
          mkdir -p site
          deployed=()
          for cfg in config/instances/*.yaml; do
            instance="$(basename "$cfg" .yaml)"
            stack="chintan-${instance}-prod"
            if ! aws cloudformation describe-stacks --stack-name "$stack" >/dev/null 2>&1; then
              echo "Skipping ${instance}: stack ${stack} not found"
              continue
            fi

            outputs="$(aws cloudformation describe-stacks \
              --stack-name "$stack" \
              --query 'Stacks[0].Outputs' \
              --output json)"

            api_endpoint="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="ApiEndpoint") | .OutputValue')"
            user_pool_id="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="UserPoolId") | .OutputValue')"
            client_id="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="UserPoolClientId") | .OutputValue')"
            cognito_domain="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="UserPoolDomainName") | .OutputValue')"

            if [ -z "$api_endpoint" ] || [ "$api_endpoint" = "null" ]; then
              echo "Error: ApiEndpoint missing for ${stack}"
              exit 1
            fi
            if [ -z "$client_id" ] || [ "$client_id" = "null" ]; then
              echo "Error: UserPoolClientId missing for ${stack}"
              exit 1
            fi
            if [ -z "$cognito_domain" ] || [ "$cognito_domain" = "null" ]; then
              echo "Error: UserPoolDomainName missing for ${stack}"
              exit 1
            fi

            dest="site/${instance}"
            mkdir -p "$dest"
            cp -a frontend/. "$dest/"
            rm -f "$dest/js/config.example.js"
            cat > "$dest/js/config.js" <<EOF
window.CHINTAN_API_URL = '${api_endpoint}';
window.CHINTAN_USER_POOL_ID = '${user_pool_id}';
window.CHINTAN_CLIENT_ID = '${client_id}';
window.CHINTAN_INSTANCE = '${instance}';
window.CHINTAN_COGNITO_DOMAIN = '${cognito_domain}';
EOF
            deployed+=("$instance")
            echo "Built ${dest} → https://${PAGES_OWNER}.github.io/${PAGES_REPO}/${instance}/"
          done

          if [ "${#deployed[@]}" -eq 0 ]; then
            echo "No instance stacks available to deploy"
            exit 1
          fi

          cat > site/index.html <<'EOF'
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chintan</title>
  <meta http-equiv="refresh" content="0; url=./dev/">
</head>
<body>
  <p>Open <a href="./dev/">Chintan Dev</a>.</p>
</body>
</html>
EOF

          echo "instances=${deployed[*]}" >> "$GITHUB_OUTPUT"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
