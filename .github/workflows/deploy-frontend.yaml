name: Deploy Frontend

# Builds one Vite bundle per instance and publishes them all to GitHub Pages.
#
# Two v1 defects are fixed here.
#
#   * The deploy job targeted the `production` environment. actions/deploy-pages
#     requires `github-pages`, so the deployment was rejected by the Pages service
#     regardless of what the rest of the job did.
#   * The build copied static files and generated js/config.js at deploy time. The
#     frontend is now Vite + React + TypeScript, built with Bun, and the
#     per-instance configuration is compiled in.

on:
  workflow_run:
    workflows: ["Deploy Backend"]
    types: [completed]
    branches: [main]
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'config/**'
      - 'scripts/ci-build-site.sh'
      - 'scripts/lib/common.sh'
      - 'scripts/list-instances.sh'
      - '.github/workflows/deploy-frontend.yaml'
  workflow_dispatch:

env:
  AWS_REGION: us-west-2

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build:
    name: Build instance bundles
    runs-on: ubuntu-latest
    # Required: the OIDC trust policy scopes by environment, and a job
    # without one gets a ref: subject that matches nothing.
    environment: build
    # Only auto-follow a successful backend deploy; a manual run or a
    # frontend-only push is unconditional.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python3 -m pip install --quiet --disable-pip-version-check pyyaml

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      # Read-only AWS access: the bundle's API endpoint and Cognito IDs come from
      # the deployed stacks rather than from a checked-in config, so a rebuilt
      # bundle cannot point at a stack that no longer exists.
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/chintan-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Build site
        env:
          PAGES_BASE: /${{ github.event.repository.name }}
        run: scripts/ci-build-site.sh --out site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Publish to Pages
    runs-on: ubuntu-latest
    needs: build
    # actions/deploy-pages requires this exact environment name. v1 named
    # `production` here, which the Pages service does not accept.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
