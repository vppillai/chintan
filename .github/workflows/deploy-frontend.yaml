name: Deploy Frontend

on:
  workflow_run:
    workflows: ["Deploy Backend"]
    types: [completed]
    branches: [main]
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yaml'

env:
  AWS_REGION: us-west-2

permissions:
  id-token: write
  contents: read
  pages: write

jobs:
  discover-instances:
    name: Discover Instances
    runs-on: ubuntu-latest
    outputs:
      instances: ${{ steps.instances.outputs.instances }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Discover instances
        id: instances
        run: |
          instances=$(find config/instances -name "*.yaml" -exec basename {} .yaml \; | jq -R -s -c 'split("\n")[:-1]')
          echo "instances=$instances" >> $GITHUB_OUTPUT

  build-and-deploy:
    name: Build and Deploy ${{ matrix.instance }}
    runs-on: ubuntu-latest
    needs: discover-instances
    environment: production
    strategy:
      matrix:
        instance: ${{ fromJSON(needs.discover-instances.outputs.instances) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/chintan-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Get CloudFormation outputs
        id: cf-outputs
        run: |
          outputs=$(aws cloudformation describe-stacks \
            --stack-name chintan-${{ matrix.instance }}-prod \
            --query 'Stacks[0].Outputs' \
            --output json)
          
          api_endpoint=$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="ApiEndpoint") | .OutputValue')
          user_pool_id=$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="UserPoolId") | .OutputValue')
          client_id=$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="ClientId") | .OutputValue')
          
          if [ "$api_endpoint" = "null" ] || [ -z "$api_endpoint" ]; then
            echo "Error: ApiEndpoint not found in CloudFormation outputs"
            exit 1
          fi
          
          echo "api-endpoint=$api_endpoint" >> $GITHUB_OUTPUT
          echo "user-pool-id=$user_pool_id" >> $GITHUB_OUTPUT
          echo "client-id=$client_id" >> $GITHUB_OUTPUT

      - name: Create frontend directory structure
        run: |
          mkdir -p frontend/js

      - name: Create config.js
        run: |
          cat > frontend/js/config.js << EOF
          window.CONFIG = {
            API_URL: '${{ steps.cf-outputs.outputs.api-endpoint }}',
            USER_POOL_ID: '${{ steps.cf-outputs.outputs.user-pool-id }}',
            CLIENT_ID: '${{ steps.cf-outputs.outputs.client-id }}',
            INSTANCE: '${{ matrix.instance }}'
          };
          EOF

      - name: Create basic index.html if missing
        run: |
          if [ ! -f frontend/index.html ]; then
            cat > frontend/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Chintan - ${{ matrix.instance }}</title>
          </head>
          <body>
            <div id="app">
              <h1>Chintan - ${{ matrix.instance }}</h1>
              <p>Frontend deployment successful!</p>
            </div>
            <script src="js/config.js"></script>
            <script>
              console.log('Config:', window.CONFIG);
            </script>
          </body>
          </html>
          EOF
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4