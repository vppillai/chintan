name: Deploy Frontend

# Builds one Vite bundle per instance and publishes them all to GitHub Pages.
#
# Two v1 defects are fixed here.
#
#   * The deploy job targeted the `production` environment. actions/deploy-pages
#     requires `github-pages`, so the deployment was rejected by the Pages service
#     regardless of what the rest of the job did.
#   * The build copied static files and generated js/config.js at deploy time. The
#     frontend is now Vite + React + TypeScript, built with Bun, and the
#     per-instance configuration is compiled in.

on:
  workflow_run:
    workflows: ["Deploy Backend"]
    types: [completed]
    branches: [main]
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'config/**'
      - 'scripts/ci-build-site.sh'
      - 'scripts/lib/common.sh'
      - 'scripts/list-instances.sh'
      - '.github/workflows/deploy-frontend.yaml'
  workflow_dispatch:

env:
  AWS_REGION: us-west-2

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build:
    name: Build instance bundles
    runs-on: ubuntu-latest
    # Required: the OIDC trust policy scopes by environment, and a job
    # without one gets a ref: subject that matches nothing.
    environment: build
    # Only auto-follow a successful backend deploy; a manual run or a
    # frontend-only push is unconditional.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      id-token: write
    steps:
      # Full history, not the default shallow depth-1 clone: ci-build-site.sh
      # runs `git describe --tags` for the version footnote, which needs the
      # tag refs and enough commit history to walk back to the nearest one.
      # A depth-1 clone has neither, so `describe` silently fell back to the
      # bare commit SHA it was meant to improve on.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python3 -m pip install --quiet --disable-pip-version-check pyyaml

      # Pinned, not `latest`: a Bun release must not be able to change the
      # production bundle, or break its build, with no change in this repository.
      # Dependabot cannot bump this line, so it moves when frontend/bun.lock does.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      # Read-only AWS access: the bundle's API endpoint and Cognito IDs come from
      # the deployed stacks rather than from a checked-in config, so a rebuilt
      # bundle cannot point at a stack that no longer exists. The build role
      # can DescribeStacks on chintan-* and upload Lambda zips, and nothing
      # else; see deploy-backend.yaml for the BUILD_ROLE_ARN fallback.
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.BUILD_ROLE_ARN || format('arn:aws:iam::{0}:role/chintan-github-actions', secrets.AWS_ACCOUNT_ID) }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build site
        env:
          PAGES_BASE: /${{ github.event.repository.name }}
        run: scripts/ci-build-site.sh --out site

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Publish to Pages
    runs-on: ubuntu-latest
    needs: build
    # actions/deploy-pages requires this exact environment name. v1 named
    # `production` here, which the Pages service does not accept.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
