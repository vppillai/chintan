name: Deploy Frontend

# Builds one Vite bundle per instance and publishes them all to GitHub Pages.
#
# Two constraints shape this workflow.
#
#   * The deploy job targets the `github-pages` environment. actions/deploy-pages
#     requires that exact name; the Pages service rejects a deployment from any
#     other environment regardless of what the rest of the job does.
#   * The frontend is Vite + React + TypeScript, built with Bun, one bundle per
#     instance with the per-instance configuration compiled in. Nothing is
#     generated at deploy time, so there is no runtime config file for the
#     service worker to cache past the lifetime of the stack it points at.

on:
  workflow_run:
    workflows: ["Deploy Backend"]
    types: [completed]
    branches: [main]
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'config/**'
      - 'scripts/ci-build-site.sh'
      - 'scripts/lib/common.sh'
      - 'scripts/list-instances.sh'
      - '.github/workflows/deploy-frontend.yaml'
  workflow_dispatch:

env:
  AWS_REGION: us-west-2

permissions:
  contents: read

jobs:
  # The bundle is built against the API that prod runs, so it waits for
  # prod to run this commit's backend. Deploy Backend tags `vX.Y.Z` only on
  # a successful prod deploy, so the backend paths differing between HEAD
  # and the newest tag say prod is behind: a push or a workflow_run then
  # skips the publish and leaves it to the workflow_run that follows the
  # backend deploy that catches up. Gating on HEAD^1 alone let a push whose
  # own commit was frontend-only publish while an earlier commit's backend
  # was still deploying. A dispatch is unconditional. The paths are Deploy
  # Backend's own; config/** and scripts/lib/common.sh are in both.
  follows-backend:
    name: Is prod on this backend?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.paths.outputs.backend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: paths
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          backend=false
          latest="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
          if [ "$EVENT" != "workflow_dispatch" ] && [ -n "$latest" ] && git diff --name-only "$latest" HEAD |
            grep -qE '^(backend/|infrastructure/|config/|scripts/(deploy|ci-deploy-stack|build-lambda|list-instances)\.sh$|scripts/lib/common\.sh$|\.github/workflows/deploy-backend\.yaml$)'; then
            backend=true
          fi
          echo "latest=$latest backend=$backend"
          echo "backend=$backend" >> "$GITHUB_OUTPUT"

  build:
    name: Build instance bundles
    runs-on: ubuntu-latest
    needs: follows-backend
    # On the build and the publish, not the workflow: a run that skips must
    # not cancel another run's publish.
    concurrency:
      group: pages-build
      cancel-in-progress: true
    # Required: the OIDC trust policy scopes by environment, and a job
    # without one gets a ref: subject that matches nothing.
    environment: build
    # Only auto-follow a successful backend deploy; a manual run or a
    # frontend push is unconditional once prod runs this commit's backend
    # (follows-backend).
    if: >-
      (github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success') &&
      needs.follows-backend.outputs.backend != 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      # Full history, not the default shallow depth-1 clone: ci-build-site.sh
      # runs `git describe --tags` for the version footnote, which needs the
      # tag refs and enough commit history to walk back to the nearest one.
      # A depth-1 clone has neither, so `describe` silently fell back to the
      # bare commit SHA it was meant to improve on.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python3 -m pip install --quiet --disable-pip-version-check pyyaml==6.0.3

      # Pinned, not `latest`: a Bun release must not be able to change the
      # production bundle, or break its build, with no change in this repository.
      # Dependabot cannot bump this line, so it moves when frontend/bun.lock does.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      # Read-only AWS access: the bundle's API endpoint and Cognito IDs come from
      # the deployed stacks rather than from a checked-in config, so a rebuilt
      # bundle cannot point at a stack that no longer exists. The build role
      # can DescribeStacks on chintan-* and upload Lambda zips, and nothing
      # else; see deploy-backend.yaml for the BUILD_ROLE_ARN fallback.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.BUILD_ROLE_ARN || format('arn:aws:iam::{0}:role/chintan-github-actions', secrets.AWS_ACCOUNT_ID) }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build site
        env:
          PAGES_BASE: /${{ github.event.repository.name }}
        run: scripts/ci-build-site.sh --out site

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Publish to Pages
    runs-on: ubuntu-latest
    needs: build
    concurrency:
      group: pages-deploy
      cancel-in-progress: true
    # actions/deploy-pages requires this exact environment name; the Pages
    # service rejects a deployment from any other environment.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
