name: Deploy Backend

# Staging first, smoke-tested, then production.
#
# Every change reaches chintan-<instance>-staging first, the smoke test there
# gates the production job, and the production job is behind an environment
# that requires a human. The order matters: a smoke test run only after a
# production deploy would report a red build over a live bad version with no
# way back.
#
# All matrix and repository values reach the shell through `env:` rather than
# through ${{ }} inside a run block. An expression interpolated into a script is
# substituted before bash sees it, so a value containing a quote is executed
# rather than read.
#
# A successful production deploy is tagged and released by the `release` job at
# the end of this workflow. Deploy Frontend runs on this workflow's `completed`
# event, which fires only once every job here — the release included — has
# finished, so the tag exists before the frontend's `git describe` runs and the
# You screen names the release rather than a bare SHA.

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'infrastructure/**'
      - 'config/**'
      - 'scripts/deploy.sh'
      - 'scripts/ci-deploy-stack.sh'
      - 'scripts/build-lambda.sh'
      - 'scripts/lib/common.sh'
      - 'scripts/list-instances.sh'
      - '.github/workflows/deploy-backend.yaml'
  workflow_dispatch:

env:
  # One region for the artifact bucket and every stack. infrastructure/bootstrap.yaml
  # creates exactly one chintan-lambda-<account>-<region> bucket, and Lambda can
  # only load code from a bucket in its own region, so a second region needs a
  # second bootstrap stack before an instance config may name it.
  AWS_REGION: us-west-2

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  discover:
    name: Discover instances
    runs-on: ubuntu-latest
    outputs:
      staging: ${{ steps.instances.outputs.staging }}
      prod: ${{ steps.instances.outputs.prod }}
      has_staging: ${{ steps.instances.outputs.has_staging }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python3 -m pip install --quiet --disable-pip-version-check pyyaml
      # scripts/list-instances.sh is the single reader of config/instances/*.yaml.
      # The instance name and environment come from each file's contents, not
      # its filename: a config that nothing reads is decorative, and a staging
      # stack can only be expressed by a field that reaches the deploy.
      - id: instances
        run: |
          set -euo pipefail
          staging="$(scripts/list-instances.sh --environment staging)"
          prod="$(scripts/list-instances.sh --environment prod)"
          if [ "$(printf '%s' "$prod" | jq 'length')" -eq 0 ]; then
            echo "no prod instance configs found" >&2
            exit 1
          fi
          {
            printf 'staging=%s\n' "$staging"
            printf 'prod=%s\n' "$prod"
            printf 'has_staging=%s\n' \
              "$([ "$(printf '%s' "$staging" | jq 'length')" -gt 0 ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"
          printf 'staging: %s\nprod: %s\n' "$staging" "$prod"

      - name: Every instance region matches the artifact bucket region
        env:
          EXPECTED_REGION: ${{ env.AWS_REGION }}
        run: |
          set -euo pipefail
          bad="$(scripts/list-instances.sh | jq -r --arg r "$EXPECTED_REGION" \
            '.[] | select(.region != $r) | .config')"
          if [ -n "$bad" ]; then
            echo "these configs name a region other than ${EXPECTED_REGION}:" >&2
            echo "$bad" >&2
            echo "deploy a bootstrap stack in that region first, then widen this check" >&2
            exit 1
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: go test -race
        working-directory: backend
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...

  build:
    name: Build Lambda
    runs-on: ubuntu-latest
    # Required: the OIDC trust policy scopes by environment, and a job
    # without one gets a ref: subject that matches nothing.
    environment: build
    needs: test
    outputs:
      artifact_key: ${{ steps.upload.outputs.key }}
      worker_key: ${{ steps.upload.outputs.worker_key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # The build role can upload the two zips and read stack outputs, and
      # nothing else — the `build` environment has no protection rules, so it
      # must not hand out the deploy role. BUILD_ROLE_ARN is a repository
      # variable set by scripts/setup.sh from the bootstrap stack's output; the
      # fallback keeps a repository whose bootstrap stack predates the build
      # role deploying until setup.sh --apply has run.
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.BUILD_ROLE_ARN || format('arn:aws:iam::{0}:role/chintan-github-actions', secrets.AWS_ACCOUNT_ID) }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Build arm64 zips
        # Two artifacts: cmd/api and cmd/worker are separate main packages. A
        # worker running the API handler starts cleanly and then swallows every
        # S3 notification, which reads as a broken pipeline rather than a broken
        # deploy.
        run: |
          scripts/build-lambda.sh \
            --output "function-${GITHUB_SHA}.zip" \
            --worker-output "worker-${GITHUB_SHA}.zip"
      - id: upload
        name: Upload to the artifact bucket
        env:
          ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          BUCKET="chintan-lambda-${ACCOUNT_ID}-${AWS_REGION}"
          KEY="function-${GITHUB_SHA}.zip"
          WORKER_KEY="worker-${GITHUB_SHA}.zip"
          aws s3 cp "$KEY" "s3://${BUCKET}/${KEY}"
          aws s3 cp "$WORKER_KEY" "s3://${BUCKET}/${WORKER_KEY}"
          # The bucket name is deliberately NOT a job output. It embeds the
          # account id, and GitHub scrubs any job output containing a secret --
          # silently, to empty, with no error. Consumers rebuild it from the
          # same secret instead.
          {
            printf 'key=%s\n' "$KEY"
            printf 'worker_key=%s\n' "$WORKER_KEY"
          } >> "$GITHUB_OUTPUT"

  deploy-staging:
    name: Staging ${{ matrix.entry.stack }}
    runs-on: ubuntu-latest
    needs: [discover, build]
    if: needs.discover.outputs.has_staging == 'true'
    environment: staging
    strategy:
      # One instance failing must not cancel its siblings mid-flight: a cancelled
      # CloudFormation deploy leaves a stack in UPDATE_IN_PROGRESS that the next
      # run cannot touch without a manual continue-update-rollback.
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(needs.discover.outputs.staging) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/chintan-github-actions
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy and smoke ${{ matrix.entry.stack }}
        env:
          INSTANCE: ${{ matrix.entry.instance }}
          ENVIRONMENT: ${{ matrix.entry.environment }}
          EXTRA_PARAMETERS: ${{ toJSON(matrix.entry.parameters) }}
          LAMBDA_BUCKET: chintan-lambda-${{ secrets.AWS_ACCOUNT_ID }}-${{ env.AWS_REGION }}
          LAMBDA_KEY: ${{ needs.build.outputs.artifact_key }}
          WORKER_KEY: ${{ needs.build.outputs.worker_key }}
          PAGES_HOST: ${{ github.repository_owner }}.github.io
          REPO_NAME: ${{ github.event.repository.name }}
          SITE_PATH: ${{ matrix.entry.site_path }}
          # When the bootstrap stack exports it, CloudFormation acts under a
          # service role scoped to one stack rather than under the CI role.
          CFN_DEPLOY_ROLE_ARN: ${{ vars.CFN_DEPLOY_ROLE_ARN }}
        run: scripts/ci-deploy-stack.sh

  # ALARM_EMAIL is passed to production only, below. The budget is account-scoped,
  # so subscribing the same address from a second stack sends two emails for one
  # overspend — and staging creates no alarms to notify about anyway.
  deploy-prod:
    name: Production ${{ matrix.entry.stack }}
    runs-on: ubuntu-latest
    needs: [discover, build, deploy-staging]
    # Runs when staging succeeded, and also when there was no staging stack to
    # deploy to. It must not run when staging failed — that is the entire point
    # of deploying there first.
    if: >-
      always() &&
      needs.build.result == 'success' &&
      (needs.deploy-staging.result == 'success' || needs.deploy-staging.result == 'skipped')
    environment: production
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(needs.discover.outputs.prod) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/chintan-github-actions
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy and smoke ${{ matrix.entry.stack }}
        env:
          INSTANCE: ${{ matrix.entry.instance }}
          ENVIRONMENT: ${{ matrix.entry.environment }}
          EXTRA_PARAMETERS: ${{ toJSON(matrix.entry.parameters) }}
          LAMBDA_BUCKET: chintan-lambda-${{ secrets.AWS_ACCOUNT_ID }}-${{ env.AWS_REGION }}
          LAMBDA_KEY: ${{ needs.build.outputs.artifact_key }}
          WORKER_KEY: ${{ needs.build.outputs.worker_key }}
          PAGES_HOST: ${{ github.repository_owner }}.github.io
          REPO_NAME: ${{ github.event.repository.name }}
          SITE_PATH: ${{ matrix.entry.site_path }}
          CFN_DEPLOY_ROLE_ARN: ${{ vars.CFN_DEPLOY_ROLE_ARN }}
          # A secret rather than a field in config/instances/*.yaml, because this
          # repository is public and that file is not the place to publish an
          # address to. Unset is a supported state: the topic deploys with no
          # subscription, which is what a clone gets.
          ALARM_EMAIL: ${{ secrets.ALARM_EMAIL }}
        run: scripts/ci-deploy-stack.sh

  # Tag what just reached production and publish a release for it.
  #
  # The You screen shows `git describe --tags --always` from the frontend
  # build. Deploys were never tagged, so that read as a bare commit SHA — the
  # value the footnote was meant to improve on. This job gives every
  # production deploy a `vX.Y.(Z+1)` tag on the commit that was deployed and a
  # GitHub release with generated notes, so the footnote, the release page and
  # the deployed code agree on one name.
  #
  # Ordering, because it is the whole point: Deploy Frontend is triggered by
  # `workflow_run: completed` on this workflow, and GitHub fires that event
  # only when the entire run — every job, this one included — has finished.
  # The frontend's checkout (fetch-depth: 0, which fetches tags) therefore
  # sees the tag this job pushed, and `git describe` on the same commit
  # answers exactly `vX.Y.Z`. A frontend-only push to main runs Deploy
  # Frontend without a backend deploy and so without a new tag; there
  # `describe` answers `vX.Y.Z-N-g<sha>`, N commits past the last release,
  # which is the truthful description of that build.
  #
  # `contents: write` is granted to this job only; every other job keeps the
  # workflow's read-only default. GITHUB_TOKEN is enough for a tag push and
  # `gh release create`, and a push made with it does not trigger other
  # workflows — none of ours listen to tags anyway.
  release:
    name: Tag and release
    runs-on: ubuntu-latest
    needs: [deploy-prod]
    if: needs.deploy-prod.result == 'success'
    permissions:
      contents: write
    steps:
      # Full history and tags: the next version is derived from the latest
      # existing `v*` tag, and a depth-1 clone has none.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Tag the deployed commit and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --tags --force --quiet

          # A re-run (workflow_dispatch, or a retried job) must not mint a
          # second release for a commit that already has one.
          if existing="$(git describe --exact-match --tags "$DEPLOYED_SHA" 2>/dev/null)"; then
            echo "commit ${DEPLOYED_SHA} is already tagged ${existing}; nothing to release"
            exit 0
          fi

          # Latest v* tag by version order, not by date: a hotfix tag made
          # from an older commit must not be mistaken for the newest release.
          latest="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
          if [ -z "$latest" ]; then
            latest="v0.0.0"
          fi
          if ! [[ "$latest" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "latest tag ${latest} is not vX.Y.Z; refusing to guess the next version" >&2
            exit 1
          fi
          next="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$next" "$DEPLOYED_SHA" \
            --message "Release ${next}: deployed to production by Deploy Backend run ${GITHUB_RUN_ID}"
          git push origin "refs/tags/${next}"

          # Notes run from the previous release; on the very first release
          # there is no previous tag to start from and gh generates them from
          # the beginning of history.
          notes_from=()
          if [ "$latest" != "v0.0.0" ]; then
            notes_from=(--notes-start-tag "$latest")
          fi
          gh release create "$next" \
            --target "$DEPLOYED_SHA" \
            --title "$next" \
            --generate-notes \
            "${notes_from[@]}"
          echo "released ${next} (previous ${latest})"
