# Dependabot keeps three things current: the action pins in the workflows
# (full commit SHAs in every workflow, so a moved tag can reach neither a job
# that holds the deploy role nor a CI gate), the Go module graph, and the
# frontend lockfile. Weekly, on one day, so the pull requests arrive together.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "gomod"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      go-modules:
        patterns: ["*"]

  # Bun lockfiles are their own ecosystem (bun.lock, Bun >= 1.1.39), not npm.
  - package-ecosystem: "bun"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      frontend:
        patterns: ["*"]
