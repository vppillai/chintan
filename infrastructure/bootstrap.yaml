AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Chintan bootstrap — artifact bucket + GitHub Actions deploy role.
  Reuses the account's existing GitHub OIDC provider (do not create a second one).
  Role permissions are scoped to chintan-* only; passbook-* is out of reach.

Metadata:
  cfn-lint:
    config:
      ignore_checks:
        # W3037 flags apigateway:TagResource / :UntagResource as unknown actions.
        # They are real, and ApiGatewayV2's stage handler calls TagResource --
        # removing them to satisfy this rule made every deploy fail with
        # AccessDenied. cfn-lint's action list for this service is stale, so the
        # rule is suppressed here rather than the grant being deleted again.
        - W3037

Parameters:
  GitHubOrg:
    Type: String
    Default: vppillai
    Description: GitHub organization/username

  GitHubRepo:
    Type: String
    Default: chintan
    Description: GitHub repository name

  ExistingOIDCProviderArn:
    Type: String
    Default: ''
    Description: >
      Existing OIDC provider for token.actions.githubusercontent.com. Leave empty
      to use the deploying account's own provider, which is what a clone wants;
      set it explicitly only to point at a provider in another account. This
      stack never creates one — the provider is shared with other projects.

  ArtifactRetentionDays:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 3650
    Description: >
      Days a Lambda deployment package stays in the artifact bucket. Every build
      writes a new current key, so without this the bucket grows without bound.

Conditions:
  # Empty means "this account", spelled out rather than hardcoded to whichever
  # account the template was first written in.
  UseOwnAccountOIDCProvider: !Equals [!Ref ExistingOIDCProviderArn, '']

Resources:
  LambdaDeploymentBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'chintan-lambda-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          # Expiring only noncurrent versions left every build's current key in
          # place forever. The current object now expires too; it becomes
          # noncurrent, the next rule removes it a day later, and the third
          # sweeps the delete marker. S3 rejects ExpiredObjectDeleteMarker in
          # the same rule as a day count, hence the split.
          - Id: ExpireOldArtifacts
            Status: Enabled
            ExpirationInDays: !Ref ArtifactRetentionDays
            NoncurrentVersionExpiration:
              NoncurrentDays: 1
          - Id: CleanupExpiredDeleteMarkers
            Status: Enabled
            ExpiredObjectDeleteMarker: true
          - Id: AbortStaleMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: Application
          Value: Chintan
        - Key: Project
          Value: chintan

  # ---------------------------------------------------------------------------
  # CloudFormation service role.
  #
  # Without --role-arn, CloudFormation acts with the caller's permissions, so
  # the instance stack is deployed by whatever the CI role happens to be allowed
  # to do — which is necessarily wider than one stack needs, and grows every time
  # anything else is added to that role. Passing this role instead pins the blast
  # radius of a deploy to exactly the resource types template.yaml declares.
  #
  # It deliberately carries NO permissions boundary. The boundary's denies are
  # conditioned on aws:CalledVia containing cloudformation.amazonaws.com, which
  # is populated for forward-access sessions — a principal calling *through*
  # CloudFormation. A service role is assumed by CloudFormation and calls *as*
  # itself, so the key is absent, `ForAllValues:StringNotEquals` is vacuously
  # true, and DenyIrreversibleDeletesOutsideCloudFormation would block every
  # delete this role exists to perform. Teardown would fail with a denial that
  # reads like a bug in the boundary.
  #
  # The escalation path the boundary would have closed is closed here instead,
  # at the source: this role may only create a role that carries the boundary,
  # may only attach the one managed policy Lambda needs, and may not remove a
  # boundary from anything. That is the documented delegation pattern, and it is
  # stronger than a boundary on this role would have been.
  CfnDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: chintan-cfn-deploy
      Description: Service role CloudFormation assumes to manage chintan instance stacks.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Tags:
        - Key: Application
          Value: Chintan
        - Key: Project
          Value: chintan
      Policies:
        - PolicyName: ChintanStackResources
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # CreateUserPool alone genuinely cannot be scoped: the pool does
              # not exist yet, so there is no ARN and no tag to match on. The
              # justification stops there.
              #
              # It used to cover this whole block, which meant the deploy role
              # could Delete, Update or SetMfaConfig on EVERY user pool in the
              # account: add a permissive callback URL or enable implicit grant
              # on another app's client, or turn its MFA off. The boundary does
              # not stop it — its Cognito deny carries
              # Null aws:ResourceTag/Project = "false", so it only applies to
              # pools that ALREADY carry a Project tag, and an untagged foreign
              # pool falls straight through. DeleteUserPool is additionally
              # permitted when aws:CalledVia is cloudformation, which is exactly
              # how a deploy runs.
              - Effect: Allow
                Action:
                  - cognito-idp:CreateUserPool
                Resource: '*'

              # Read and tag on any pool: CloudFormation describes a pool before
              # it can know whether it is ours, and TagResource is how a
              # just-created pool acquires the tag every statement below keys on.
              - Effect: Allow
                Action:
                  - cognito-idp:DescribeUserPool
                  - cognito-idp:DescribeUserPoolClient
                  - cognito-idp:DescribeUserPoolDomain
                  - cognito-idp:GetUserPoolMfaConfig
                  - cognito-idp:ListTagsForResource
                  - cognito-idp:TagResource
                  - cognito-idp:UntagResource
                  # Managed login branding: the read half. CloudFormation reads
                  # the branding back after every write to return its state, and
                  # a drift check reads it without writing.
                  - cognito-idp:DescribeManagedLoginBranding
                  - cognito-idp:DescribeManagedLoginBrandingByClient
                Resource: '*'

              # Everything that MUTATES a pool is confined to pools this project
              # tagged. template.yaml tags the pool Project=chintan at creation,
              # so the stack's own updates are unaffected.
              - Effect: Allow
                Action:
                  - cognito-idp:DeleteUserPool
                  - cognito-idp:UpdateUserPool
                  - cognito-idp:CreateUserPoolClient
                  - cognito-idp:DeleteUserPoolClient
                  - cognito-idp:UpdateUserPoolClient
                  - cognito-idp:CreateUserPoolDomain
                  - cognito-idp:DeleteUserPoolDomain
                  - cognito-idp:SetUserPoolMfaConfig
                  # Managed login branding, the styling applied to the hosted
                  # sign-in page. The resource these authorize against is the
                  # USER POOL, not a branding ARN, so the Project tag condition
                  # below constrains them exactly like the rest of this block.
                  # Confirmed in CloudTrail: these were denied before the grant
                  # existed and succeeded after it, WITH this condition in place.
                  - cognito-idp:CreateManagedLoginBranding
                  - cognito-idp:UpdateManagedLoginBranding
                  - cognito-idp:DeleteManagedLoginBranding
                Resource: '*'
                Condition:
                  StringEquals:
                    'aws:ResourceTag/Project': chintan

              # UpdateUserPoolDomain, alone, cannot carry the tag condition
              # above. Changing ManagedLoginVersion on an EXISTING domain is an
              # update rather than a create, so the template's switch to managed
              # login needs it — but Cognito does not put the pool's tags into
              # the request context for this action, so a condition on
              # aws:ResourceTag/Project can never be satisfied and the call is
              # denied however the pool is tagged.
              #
              # That is measured, not assumed. CloudTrail over the whole life of
              # this role shows UpdateUserPoolDomain denied 4/4 times and never
              # once allowed, while CreateManagedLoginBranding — same role, same
              # tagged pool, same condition — succeeded as soon as it was
              # granted. simulate-principal-policy agrees from the other side:
              # the action evaluates to `allowed` only when the tag is injected
              # by hand with --context-entries, which is exactly the value the
              # real service withholds.
              #
              # So the choice is this action unconditioned or managed login not
              # deployable. It is the narrower of the two: it can only change a
              # domain's managed-login version and certificate, cannot create or
              # delete a domain, cannot read or write a user, and every other
              # Cognito mutation in this role stays tag-scoped. Revisit if
              # Cognito ever supports ABAC here.
              - Effect: Allow
                Action:
                  - cognito-idp:UpdateUserPoolDomain
                Resource: '*'

              - Effect: Allow
                Action:
                  - dynamodb:CreateTable
                  - dynamodb:DeleteTable
                  - dynamodb:UpdateTable
                  - dynamodb:DescribeTable
                  - dynamodb:DescribeContinuousBackups
                  - dynamodb:UpdateContinuousBackups
                  - dynamodb:DescribeTimeToLive
                  - dynamodb:UpdateTimeToLive
                  - dynamodb:ListTagsOfResource
                  - dynamodb:TagResource
                  - dynamodb:UntagResource
                  # The expiry stream. UpdateTable is what turns
                  # StreamSpecification on, and DescribeStream/ListStreams are
                  # what the table handler and the event-source-mapping handler
                  # call to resolve the stream ARN afterwards. Enumerated here
                  # rather than discovered: a missing action on this role costs
                  # a whole deploy round trip to find, because only a real
                  # deploy exercises it.
                  - dynamodb:DescribeStream
                  - dynamodb:ListStreams
                Resource:
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/chintan-*'
                  # A stream ARN is table/<name>/stream/<label>. IAM wildcards
                  # match '/', so the entry above already covers it — this is
                  # written out so that reading the policy does not require
                  # knowing that.
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/chintan-*/stream/*'

              - Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:DeleteBucket
                  - s3:GetBucket*
                  - s3:PutBucket*
                  - s3:GetEncryptionConfiguration
                  - s3:PutEncryptionConfiguration
                  - s3:GetLifecycleConfiguration
                  - s3:PutLifecycleConfiguration
                  - s3:GetAccelerateConfiguration
                Resource:
                  - 'arn:aws:s3:::chintan-content-*'

              # Lambda fetches the deployment package as the deploying principal,
              # so the service role needs to read the artifact bucket as well as
              # manage the content bucket. Without this the functions fail with
              # "Your access has been denied by S3 ... not authorized to perform:
              # s3:GetObject" -- which reads like a bucket policy problem and is
              # actually a missing grant on the role doing the deploy.
              # Read-only, and only the artifact bucket's objects.
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource:
                  - !Sub 'arn:aws:s3:::chintan-lambda-${AWS::AccountId}-${AWS::Region}/*'

              # "Everything after CreateKey is the key this stack made, which the
              # account root policy already governs" was wrong, and it was the
              # widest grant in this file. kms:PutKeyPolicy, ScheduleKeyDeletion,
              # DisableKeyRotation and DeleteAlias on Resource: '*' meant anyone
              # who could trigger a deploy — a push to the deploy branch, a
              # compromised runner, a stolen OIDC subject — could rewrite ANOTHER
              # project's CMK policy to grant itself kms:Decrypt (a same-account
              # key policy naming the principal is sufficient authorization) or
              # schedule that key for deletion.
              #
              # The permissions boundary does not contain it either: its ceiling
              # allows kms:*, its name-prefix deny lists no KMS ARNs, and its
              # tag-based deny lists no kms:* action. The template header's
              # "passbook-* is out of reach" holds for every service whose ARNs
              # are name-prefixed and does NOT hold for KMS, because a CMK ARN is
              # a UUID.
              #
              # So: create and read on '*' — a key that does not exist yet has no
              # ARN and no tag — and every mutation conditioned on the Project
              # tag. AWS::KMS::Key passes the template's Tags to CreateKey, so
              # the key is born tagged and the stack's own updates satisfy this.
              - Effect: Allow
                Action:
                  - kms:CreateKey
                  - kms:ListAliases
                Resource: '*'

              # Read-only. Describing a key is how CloudFormation finds out
              # whether it is ours in the first place.
              - Effect: Allow
                Action:
                  - kms:DescribeKey
                  - kms:GetKeyPolicy
                  - kms:GetKeyRotationStatus
                  - kms:ListResourceTags
                Resource: '*'

              - Effect: Allow
                Action:
                  - kms:PutKeyPolicy
                  - kms:EnableKeyRotation
                  - kms:DisableKeyRotation
                  - kms:ScheduleKeyDeletion
                  - kms:CancelKeyDeletion
                  - kms:TagResource
                  - kms:UntagResource
                  - kms:CreateAlias
                  - kms:UpdateAlias
                  - kms:DeleteAlias
                Resource: '*'
                Condition:
                  StringEquals:
                    'aws:ResourceTag/Project': chintan

              # The alias half of Create/Update/DeleteAlias. Those three
              # authorize against BOTH the key and the alias, and an alias ARN
              # carries its name — so unlike the key, it can be prefix-scoped.
              - Effect: Allow
                Action:
                  - kms:CreateAlias
                  - kms:UpdateAlias
                  - kms:DeleteAlias
                Resource:
                  - !Sub 'arn:aws:kms:${AWS::Region}:${AWS::AccountId}:alias/chintan-*'

              - Effect: Allow
                Action:
                  - lambda:CreateFunction
                  - lambda:DeleteFunction
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:GetFunctionConcurrency
                  - lambda:PutFunctionConcurrency
                  - lambda:DeleteFunctionConcurrency
                  - lambda:AddPermission
                  - lambda:RemovePermission
                  - lambda:GetPolicy
                  - lambda:ListTags
                  - lambda:TagResource
                  - lambda:UntagResource
                  # Versions and the live alias are stack resources, not just
                  # deploy-script artefacts.
                  - lambda:PublishVersion
                  - lambda:CreateAlias
                  - lambda:UpdateAlias
                  - lambda:DeleteAlias
                  - lambda:GetAlias
                  - lambda:ListVersionsByFunction
                  - lambda:ListAliases
                Resource:
                  - !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:chintan-*'

              - Effect: Allow
                Action:
                  - lambda:GetEventSourceMapping
                  - lambda:ListEventSourceMappings
                Resource: '*'

              - Effect: Allow
                Action:
                  - lambda:CreateEventSourceMapping
                  - lambda:UpdateEventSourceMapping
                  - lambda:DeleteEventSourceMapping
                Resource: '*'
                Condition:
                  ArnLike:
                    lambda:FunctionArn: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:chintan-*'

              # An event-source-mapping has its own ARN namespace, so the
              # lambda:TagResource granted above on function:chintan-* does not
              # reach it, and CloudFormation tags every resource it creates:
              #   not authorized to perform: lambda:TagResource on resource:
              #   arn:aws:lambda:...:event-source-mapping:*
              # Mapping UUIDs are service-generated, so there is no name to
              # prefix-scope on; the account+region namespace is the tightest
              # scope available. The Create grant above is still conditioned on
              # the function ARN, so only this stack's functions get mappings at
              # all.
              - Effect: Allow
                Action:
                  - lambda:TagResource
                  - lambda:UntagResource
                  - lambda:ListTags
                Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:event-source-mapping:*'

              - Effect: Allow
                Action:
                  - logs:DescribeLogGroups
                Resource: '*'

              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:PutRetentionPolicy
                  - logs:DeleteRetentionPolicy
                  - logs:TagLogGroup
                  - logs:UntagLogGroup
                  - logs:TagResource
                  - logs:UntagResource
                  - logs:ListTagsLogGroup
                  - logs:ListTagsForResource
                Resource:
                  - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/chintan-*'
                  - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/apigateway/chintan-*'

              # Access logging: API Gateway needs the stage's destination group
              # writable, and checks that at stage-update time.
              - Effect: Allow
                Action:
                  - logs:GetLogDelivery
                  - logs:CreateLogDelivery
                  - logs:UpdateLogDelivery
                  - logs:DeleteLogDelivery
                  - logs:ListLogDeliveries
                  - logs:PutResourcePolicy
                  - logs:DescribeResourcePolicies
                Resource: '*'

              - Effect: Allow
                Action:
                  - apigateway:GET
                  - apigateway:POST
                  - apigateway:PUT
                  - apigateway:PATCH
                  - apigateway:DELETE
                  - apigateway:TagResource
                  - apigateway:UntagResource
                # apigateway:TagResource IS a real action, whatever cfn-lint's
                # W3037 says -- its action list for this service is stale. The
                # ApiGatewayV2 stage handler calls TagResource, and without this
                # grant the deploy fails with:
                #   "not authorized to perform: apigateway:TagResource ...
                #    because no identity-based policy allows the action"
                # Removing these to silence a lint warning cost four deploys to
                # find, because only a real deploy can prove it.
                Resource:
                  - !Sub 'arn:aws:apigateway:${AWS::Region}::/apis'
                  - !Sub 'arn:aws:apigateway:${AWS::Region}::/apis/*'
                  - !Sub 'arn:aws:apigateway:${AWS::Region}::/tags/*'

              - Effect: Allow
                Action:
                  - sqs:CreateQueue
                  - sqs:DeleteQueue
                  - sqs:GetQueueAttributes
                  - sqs:SetQueueAttributes
                  - sqs:GetQueueUrl
                  - sqs:ListQueueTags
                  - sqs:TagQueue
                  - sqs:UntagQueue
                Resource:
                  - !Sub 'arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:chintan-*'

              - Effect: Allow
                Action:
                  - sns:CreateTopic
                  - sns:DeleteTopic
                  - sns:GetTopicAttributes
                  - sns:SetTopicAttributes
                  - sns:Subscribe
                  - sns:Unsubscribe
                  - sns:GetSubscriptionAttributes
                  - sns:ListSubscriptionsByTopic
                  - sns:ListTagsForResource
                  - sns:TagResource
                  - sns:UntagResource
                Resource:
                  - !Sub 'arn:aws:sns:${AWS::Region}:${AWS::AccountId}:chintan-*'

              - Effect: Allow
                Action:
                  - cloudwatch:DescribeAlarms
                  - cloudwatch:ListTagsForResource
                Resource: '*'

              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricAlarm
                  - cloudwatch:DeleteAlarms
                  - cloudwatch:TagResource
                  - cloudwatch:UntagResource
                Resource:
                  - !Sub 'arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:chintan-*'

              - Effect: Allow
                Action:
                  - budgets:ViewBudget
                  - budgets:ModifyBudget
                  - budgets:ListTagsForResource
                  - budgets:TagResource
                  - budgets:UntagResource
                Resource:
                  - !Sub 'arn:aws:budgets::${AWS::AccountId}:budget/*'

              - Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:ListRoleTags
                  - iam:TagRole
                  - iam:UntagRole
                Resource:
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/chintan-*'

              # The delegation: a role may be created, and its policies written,
              # only while it carries the agent boundary. Without this condition
              # a stack template could mint an unbounded role and pass it to
              # Lambda, and the deploy path would be an escalation path.
              - Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:UpdateAssumeRolePolicy
                Resource:
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/chintan-*'
                Condition:
                  StringEquals:
                    iam:PermissionsBoundary: !Sub 'arn:aws:iam::${AWS::AccountId}:policy/chintan-agent-boundary'

              - Effect: Allow
                Action:
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                Resource:
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/chintan-*'
                Condition:
                  ArnEquals:
                    iam:PolicyARN: 'arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
                  StringEquals:
                    iam:PermissionsBoundary: !Sub 'arn:aws:iam::${AWS::AccountId}:policy/chintan-agent-boundary'

              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource:
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/chintan-*'
                Condition:
                  StringEquals:
                    iam:PassedToService: 'lambda.amazonaws.com'

              # Belt and braces over the condition above: the boundary can never
              # be taken off a role this role touches, whatever a future template
              # asks for.
              - Effect: Deny
                Action:
                  - iam:DeleteRolePermissionsBoundary
                  - iam:CreateUser
                  - iam:CreateAccessKey
                  - iam:CreateOpenIDConnectProvider
                  - iam:CreatePolicyVersion
                  - iam:SetDefaultPolicyVersion
                Resource: '*'

              # It must not be able to rewrite the guardrails it is checked
              # against, nor to reach the other project in this account.
              - Effect: Deny
                Action: '*'
                Resource:
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:policy/chintan-agent-*'
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/chintan-agent'
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/chintan-github-actions'
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/chintan-cfn-deploy'
                  - 'arn:aws:s3:::passbook-*'
                  - 'arn:aws:s3:::passbook-*/*'
                  - !Sub 'arn:aws:dynamodb:*:${AWS::AccountId}:table/passbook-*'
                  - !Sub 'arn:aws:lambda:*:${AWS::AccountId}:function:passbook-*'
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/passbook-*'

  GitHubActionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: chintan-github-actions
      PermissionsBoundary: !Sub 'arn:aws:iam::${AWS::AccountId}:policy/chintan-agent-boundary'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - UseOwnAccountOIDCProvider
                - !Sub 'arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
                - !Ref ExistingOIDCProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              # GitHub issues immutable subjects (owner@id/repo@id), so both the
              # legacy and immutable forms are accepted for each environment.
              #
              # Scoping is per environment rather than per branch. A `ref:` subject
              # would let ANY job on main assume this role; an `environment:`
              # subject only lets a job that declares that environment do so,
              # which is a property the workflow states out loud and GitHub
              # enforces.
              #
              # Every credentialed job must therefore declare an `environment:`.
              # A job that omits it gets subject `repo:owner/repo:ref:refs/heads/main`,
              # matches nothing here, and fails with "Not authorized to perform
              # sts:AssumeRoleWithWebIdentity" -- which is what happened when the
              # build step was split out of the deploy jobs and shipped with no
              # environment. Nothing in CI can catch that; it only fails against
              # real STS.
              StringLike:
                token.actions.githubusercontent.com:sub:
                  # Builds the artifact and uploads it to the artifact bucket.
                  # Separate from the deploy environments so that gating prod
                  # does not gate compiling.
                  - !Sub 'repo:${GitHubOrg}/${GitHubRepo}:environment:build'
                  - !Sub 'repo:${GitHubOrg}@*/${GitHubRepo}@*:environment:build'
                  - !Sub 'repo:${GitHubOrg}/${GitHubRepo}:environment:staging'
                  - !Sub 'repo:${GitHubOrg}@*/${GitHubRepo}@*:environment:staging'
                  - !Sub 'repo:${GitHubOrg}/${GitHubRepo}:environment:production'
                  - !Sub 'repo:${GitHubOrg}@*/${GitHubRepo}@*:environment:production'
      Tags:
        - Key: Application
          Value: Chintan
        - Key: Project
          Value: chintan
      Policies:
        - PolicyName: ChintanDeploymentPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DeleteStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                Resource:
                  - !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/chintan-*/*'

              - Effect: Allow
                Action:
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ValidateTemplate
                Resource: '*'

              # Read-only, so that scripts/check-boundary-drift.sh can compare
              # the deployed permissions boundary against the repository from a
              # credentialed job. The boundary is the one guardrail
              # CloudFormation does not own — bootstrap-agent.sh applies it, and
              # no deploy runs bootstrap-agent.sh — so the deployed ceiling can
              # fall behind the template's needs with nothing reporting it. When
              # that happened, template.yaml's sqs:ReceiveMessage grant was void
              # and Lambda reported a role that "does not have permissions" for
              # a grant it visibly held.
              #
              # Read only, and it must stay that way: this role carries the
              # boundary itself, whose DenyModifyingTheGuardrailPoliciesThemselves
              # statement withholds iam:CreatePolicyVersion and
              # iam:SetDefaultPolicyVersion on chintan-agent-*. A principal that
              # can rewrite its own ceiling has no ceiling. The check therefore
              # reports drift and prints the command a human runs; it cannot
              # repair it.
              - Effect: Allow
                Action:
                  - iam:GetPolicy
                  - iam:GetPolicyVersion
                Resource:
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:policy/chintan-agent-*'

              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt LambdaDeploymentBucket.Arn
                  - !Sub '${LambdaDeploymentBucket.Arn}/*'

              - Effect: Allow
                Action:
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:GetFunctionConcurrency
                  - lambda:ListTags
                Resource:
                  - !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:chintan-*'

              - Effect: Allow
                Action:
                  - lambda:CreateFunction
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:DeleteFunction
                  - lambda:AddPermission
                  - lambda:RemovePermission
                  - lambda:TagResource
                  - lambda:UntagResource
                  - lambda:PutFunctionConcurrency
                  - lambda:DeleteFunctionConcurrency
                Resource:
                  - !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:chintan-*'
                Condition:
                  ForAnyValue:StringEquals:
                    aws:CalledVia: ['cloudformation.amazonaws.com']

              # Publishing a version and moving the `live` alias happens in
              # scripts/deploy.sh, after the change set succeeds and outside any
              # CloudFormation operation, so these cannot carry the CalledVia
              # condition the mutations above do. They are the rollback handle:
              # without them a bad deploy can only be undone by another deploy.
              - Effect: Allow
                Action:
                  - lambda:PublishVersion
                  - lambda:GetAlias
                  - lambda:ListAliases
                  - lambda:CreateAlias
                  - lambda:UpdateAlias
                  - lambda:ListVersionsByFunction
                Resource:
                  - !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:chintan-*'

              # Event source mappings are named by service-generated UUID, so the
              # scope has to come from the function they attach to.
              - Effect: Allow
                Action:
                  - lambda:GetEventSourceMapping
                  - lambda:ListEventSourceMappings
                Resource: '*'

              - Effect: Allow
                Action:
                  - lambda:CreateEventSourceMapping
                  - lambda:UpdateEventSourceMapping
                  - lambda:DeleteEventSourceMapping
                Resource: '*'
                Condition:
                  ArnLike:
                    lambda:FunctionArn: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:chintan-*'
                  ForAnyValue:StringEquals:
                    aws:CalledVia: ['cloudformation.amazonaws.com']

              - Effect: Allow
                Action:
                  - sqs:GetQueueAttributes
                  - sqs:GetQueueUrl
                  - sqs:ListQueueTags
                Resource:
                  - !Sub 'arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:chintan-*'

              - Effect: Allow
                Action:
                  - sqs:CreateQueue
                  - sqs:DeleteQueue
                  - sqs:SetQueueAttributes
                  - sqs:TagQueue
                  - sqs:UntagQueue
                Resource:
                  - !Sub 'arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:chintan-*'
                Condition:
                  ForAnyValue:StringEquals:
                    aws:CalledVia: ['cloudformation.amazonaws.com']

              - Effect: Allow
                Action:
                  - sns:GetTopicAttributes
                  - sns:ListTagsForResource
                  - sns:ListSubscriptionsByTopic
                Resource:
                  - !Sub 'arn:aws:sns:${AWS::Region}:${AWS::AccountId}:chintan-*'

              - Effect: Allow
                Action:
                  - sns:CreateTopic
                  - sns:DeleteTopic
                  - sns:SetTopicAttributes
                  - sns:Subscribe
                  - sns:Unsubscribe
                  - sns:TagResource
                  - sns:UntagResource
                Resource:
                  - !Sub 'arn:aws:sns:${AWS::Region}:${AWS::AccountId}:chintan-*'
                Condition:
                  ForAnyValue:StringEquals:
                    aws:CalledVia: ['cloudformation.amazonaws.com']

              # Alarm ARNs are name-scoped, so chintan-* holds.
              - Effect: Allow
                Action:
                  - cloudwatch:DescribeAlarms
                  - cloudwatch:ListTagsForResource
                Resource: '*'

              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricAlarm
                  - cloudwatch:DeleteAlarms
                  - cloudwatch:TagResource
                  - cloudwatch:UntagResource
                Resource:
                  - !Sub 'arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:chintan-*'
                Condition:
                  ForAnyValue:StringEquals:
                    aws:CalledVia: ['cloudformation.amazonaws.com']

              # The budget the README used to ask a human to click. Budgets is a
              # global service; its ARNs carry no region.
              # Budgets has no per-verb actions: ViewBudget reads and
              # ModifyBudget covers create, update and delete alike.
              - Effect: Allow
                Action:
                  - budgets:ViewBudget
                  - budgets:ListTagsForResource
                Resource:
                  - !Sub 'arn:aws:budgets::${AWS::AccountId}:budget/*'

              - Effect: Allow
                Action:
                  - budgets:ModifyBudget
                  - budgets:TagResource
                  - budgets:UntagResource
                Resource:
                  - !Sub 'arn:aws:budgets::${AWS::AccountId}:budget/*'
                Condition:
                  ForAnyValue:StringEquals:
                    aws:CalledVia: ['cloudformation.amazonaws.com']

              - Effect: Allow
                Action:
                  - dynamodb:DescribeTable
                  - dynamodb:DescribeContinuousBackups
                  - dynamodb:DescribeTimeToLive
                  - dynamodb:ListTagsOfResource
                  # The expiry stream, for the deploys that run without
                  # CFN_DEPLOY_ROLE_ARN and therefore act as this role.
                  - dynamodb:DescribeStream
                  - dynamodb:ListStreams
                Resource:
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/chintan-*'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/chintan-*/stream/*'

              - Effect: Allow
                Action:
                  - dynamodb:CreateTable
                  - dynamodb:DeleteTable
                  - dynamodb:UpdateTable
                  - dynamodb:UpdateContinuousBackups
                  - dynamodb:UpdateTimeToLive
                  - dynamodb:TagResource
                  - dynamodb:UntagResource
                Resource:
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/chintan-*'
                Condition:
                  ForAnyValue:StringEquals:
                    aws:CalledVia: ['cloudformation.amazonaws.com']

              - Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:DeleteBucket
                  - s3:GetBucket*
                  - s3:PutBucket*
                  - s3:PutEncryptionConfiguration
                  - s3:PutBucketPublicAccessBlock
                  - s3:PutBucketTagging
                # A bucket ARN carries no region or account, so there is nothing
                # for Fn::Sub to substitute. Written plain, as CfnDeployRole
                # already writes the same ARN.
                Resource:
                  - 'arn:aws:s3:::chintan-content-*'
                Condition:
                  ForAnyValue:StringEquals:
                    aws:CalledVia: ['cloudformation.amazonaws.com']

              - Effect: Allow
                Action:
                  - apigateway:GET
                Resource:
                  - !Sub 'arn:aws:apigateway:${AWS::Region}::/apis/*'
                  - !Sub 'arn:aws:apigateway:${AWS::Region}::/apis'
                  - !Sub 'arn:aws:apigateway:${AWS::Region}::/tags/*'

              - Effect: Allow
                Action:
                  - apigateway:POST
                  - apigateway:PUT
                  - apigateway:DELETE
                  - apigateway:PATCH
                  - apigateway:TagResource
                  - apigateway:UntagResource
                # apigateway:TagResource IS a real action, whatever cfn-lint's
                # W3037 says -- its action list for this service is stale. The
                # ApiGatewayV2 stage handler calls TagResource, and without this
                # grant the deploy fails with:
                #   "not authorized to perform: apigateway:TagResource ...
                #    because no identity-based policy allows the action"
                # Removing these to silence a lint warning cost four deploys to
                # find, because only a real deploy can prove it.
                Resource:
                  - !Sub 'arn:aws:apigateway:${AWS::Region}::/apis/*'
                  - !Sub 'arn:aws:apigateway:${AWS::Region}::/apis'
                  - !Sub 'arn:aws:apigateway:${AWS::Region}::/tags/*'
                Condition:
                  ForAnyValue:StringEquals:
                    aws:CalledVia: ['cloudformation.amazonaws.com']

              # Cognito cannot be ARN-prefix-scoped (pool IDs are service-generated).
              # Mutations restricted to CloudFormation; reads allowed for CI smoke.
              - Effect: Allow
                Action:
                  - cognito-idp:Describe*
                  - cognito-idp:List*
                  - cognito-idp:Get*
                Resource: '*'

              - Effect: Allow
                Action:
                  - cognito-idp:CreateUserPool
                  - cognito-idp:DeleteUserPool
                  - cognito-idp:UpdateUserPool
                  - cognito-idp:CreateUserPoolClient
                  - cognito-idp:DeleteUserPoolClient
                  - cognito-idp:UpdateUserPoolClient
                  - cognito-idp:CreateUserPoolDomain
                  - cognito-idp:DeleteUserPoolDomain
                  # Selecting managed login on an existing domain updates it.
                  - cognito-idp:UpdateUserPoolDomain
                  # Hardened pool config: MFA and advanced security.
                  - cognito-idp:SetUserPoolMfaConfig
                  - cognito-idp:TagResource
                  - cognito-idp:UntagResource
                  # Managed login branding. Reads are already covered by the
                  # Describe*/Get* statement above; these are the writes, and
                  # like every mutation here they are usable only via
                  # CloudFormation.
                  - cognito-idp:CreateManagedLoginBranding
                  - cognito-idp:UpdateManagedLoginBranding
                  - cognito-idp:DeleteManagedLoginBranding
                Resource: '*'
                Condition:
                  ForAnyValue:StringEquals:
                    aws:CalledVia: ['cloudformation.amazonaws.com']

              - Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:ListRolePolicies
                  - iam:GetRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:ListAttachedRolePolicies
                Resource:
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/chintan-*'

              - Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:DetachRolePolicy
                Resource:
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/chintan-*'
                Condition:
                  ForAnyValue:StringEquals:
                    aws:CalledVia: ['cloudformation.amazonaws.com']

              - Effect: Allow
                Action:
                  - iam:AttachRolePolicy
                Resource:
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/chintan-*'
                Condition:
                  ArnEquals:
                    iam:PolicyARN: 'arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
                  ForAnyValue:StringEquals:
                    aws:CalledVia: ['cloudformation.amazonaws.com']

              # lambda.amazonaws.com for the function execution role;
              # cloudformation.amazonaws.com for the deploy service role passed
              # as --role-arn, without which the scoped deploy silently is not one.
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource:
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/chintan-*'
                Condition:
                  StringEquals:
                    iam:PassedToService:
                      - 'lambda.amazonaws.com'
                      - 'cloudformation.amazonaws.com'

              - Effect: Allow
                Action:
                  - logs:DescribeLogGroups
                Resource: '*'

              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:PutRetentionPolicy
                  - logs:TagLogGroup
                  - logs:ListTagsLogGroup
                Resource:
                  - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/chintan-*'
                  - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/apigateway/chintan-*'
                Condition:
                  ForAnyValue:StringEquals:
                    aws:CalledVia: ['cloudformation.amazonaws.com']

              # SSM parameter read for deploy verification; Put remains a human/agent-cli step.
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:DescribeParameters
                Resource:
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/chintan/*'

              # Token-vault CMK for biometric unlock (CreateKey is unscoped; mutations CFN-only).
              - Effect: Allow
                Action:
                  - kms:CreateKey
                  - kms:DescribeKey
                  - kms:GetKeyPolicy
                  - kms:GetKeyRotationStatus
                  - kms:ListResourceTags
                  - kms:ScheduleKeyDeletion
                  - kms:CancelKeyDeletion
                  - kms:EnableKeyRotation
                  - kms:DisableKeyRotation
                  - kms:PutKeyPolicy
                  - kms:TagResource
                  - kms:UntagResource
                  - kms:CreateAlias
                  - kms:UpdateAlias
                  - kms:DeleteAlias
                  - kms:ListAliases
                Resource: '*'
                Condition:
                  ForAnyValue:StringEquals:
                    aws:CalledVia: ['cloudformation.amazonaws.com']

Outputs:
  LambdaDeploymentBucketName:
    Description: S3 bucket for Lambda deployment artifacts
    Value: !Ref LambdaDeploymentBucket
    Export:
      Name: ChintanLambdaBucket

  GitHubActionsRoleArn:
    Description: IAM Role ARN for GitHub Actions (chintan-* scoped)
    Value: !GetAtt GitHubActionsRole.Arn
    Export:
      Name: ChintanGitHubActionsRole

  CfnDeployRoleArn:
    Description: >
      CloudFormation service role. Pass to scripts/deploy.sh as
      CFN_DEPLOY_ROLE_ARN so the stack is managed with these permissions rather
      than the caller's.
    Value: !GetAtt CfnDeployRole.Arn
    Export:
      Name: ChintanCfnDeployRole

  OIDCProviderArn:
    Description: GitHub OIDC Provider ARN the deploy role trusts (shared, not created by this stack)
    Value: !If
      - UseOwnAccountOIDCProvider
      - !Sub 'arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
      - !Ref ExistingOIDCProviderArn
