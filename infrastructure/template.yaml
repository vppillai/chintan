AWSTemplateFormatVersion: '2010-09-09'
Description: 'Chintan Instance Template - Per-instance resources for voice AI application'

Parameters:
  InstanceName:
    Type: String
    Description: Name of the Chintan instance (used in resource naming)
    MinLength: 1
    MaxLength: 32
    AllowedPattern: '^[a-z0-9-]+$'
  
  AllowedOrigin:
    Type: String
    Description: CORS allowed origin for the API
    MinLength: 1
  
  LambdaCodeBucket:
    Type: String
    Description: S3 bucket containing Lambda deployment package
    MinLength: 1
  
  LambdaCodeKey:
    Type: String
    Description: S3 key for Lambda deployment package
    MinLength: 1
  
  Environment:
    Type: String
    Default: prod
    Description: Environment name
    AllowedValues:
      - prod
      - staging
      - dev
  
  PagesHost:
    Type: String
    Description: GitHub Pages host for Cognito callbacks
    MinLength: 1
  
  RepoName:
    Type: String
    Description: Repository name for Cognito callback URLs
    MinLength: 1

  WorkerCodeKey:
    Type: String
    MinLength: 1
    Description: >
      S3 key for the worker Lambda deployment package, built from
      backend/cmd/worker. Required, and deliberately without a default.

      It used to default to '' and be read as "share LambdaCodeKey with the API
      function". The API entrypoint is Handler(ctx,
      events.APIGatewayV2HTTPRequest): fed a real SQS event it returns
      {"statusCode":404} with a nil error, and because CaptureEventSourceMapping
      declares FunctionResponseTypes: [ReportBatchItemFailures], Lambda reads a
      success carrying no batchItemFailures key as "the whole batch succeeded"
      and deletes every uploaded recording from the queue on first receive. No
      retry, no DLQ message, no Errors datapoint, no alarm, and GET /v1/health
      still answers — so the deploy reports success while every recording is
      discarded. Failing here, at deploy time, is the cheapest place to catch it.

  AlarmEmail:
    Type: String
    Default: ''
    Description: >
      Email address subscribed to the alarm topic and the budget notifications.
      Empty installs the topic with no subscription, so a clone deploys clean.
    AllowedPattern: '^$|^[^@\s]+@[^@\s]+\.[^@\s]+$'

  MonthlyBudgetUSD:
    Type: Number
    Default: 10
    MinValue: 1
    MaxValue: 100000
    Description: Monthly cost budget, in USD, defined here rather than clicked into the console.

  RetentionDays:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 3650
    Description: >
      Days after which capture audio expires. 0 means indefinite and installs no
      lifecycle rule at all (see §4.9). Note bodies and cleaned text are never
      expired by this setting.

  LogRetentionDays:
    Type: Number
    Default: 14
    Description: CloudWatch log retention, set explicitly so groups never default to never-expire.
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1096, 1827, 2192, 2557, 2922, 3288, 3653]

  DailySpendCapMicros:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 1000000000
    Description: >
      Per-tenant, per-day provider spend ceiling in MICRODOLLARS — 1000000 is
      one US dollar, so a ten-dollar day is 10000000. 0 means the meter still
      records every call but the breaker enforces nothing, which is the default
      because a cap that is guessed at is worse than one that is chosen. The
      ceiling here is $1000/day, high enough never to bind and low enough to
      catch a fat-fingered extra zero.

  CognitoTier:
    Type: String
    Default: ESSENTIALS
    AllowedValues: [LITE, ESSENTIALS, PLUS]
    Description: >
      Cognito feature tier. PLUS adds Threat Protection (compromised-credential
      detection and adaptive auth) and is enabled automatically at that tier.
      PLUS also has NO free monthly active users, where LITE and ESSENTIALS
      include 10,000 — so on a single-user instance this is the difference
      between a free user pool and a billed one, to protect one account that
      already requires a verified email and can enable MFA. Raise it to PLUS
      before this serves people who are not you.

  RefreshTokenValidityDays:
    Type: Number
    Default: 7
    MinValue: 1
    MaxValue: 3650
    Description: >
      Cognito refresh token lifetime. Explicit rather than the 30-day default,
      because the app vaults these tokens under a CMK for biometric unlock.

Conditions:
  ThreatProtectionAvailable: !Equals [!Ref CognitoTier, 'PLUS']
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, '']]
  HasRetention: !Not [!Equals [!Ref RetentionDays, 0]]
  HasSpendCap: !Not [!Equals [!Ref DailySpendCapMicros, 0]]

Resources:
  # Cognito User Pool
  UserPool:
    Type: AWS::Cognito::UserPool
    # The pool is the identity of every enrolled user. Losing it is not recoverable
    # by redeploying, so the stack never takes it with it.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub 'chintan-${InstanceName}-${Environment}'
      DeletionProtection: ACTIVE
      AutoVerifiedAttributes:
        - email
      UsernameConfiguration:
        CaseSensitive: false
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate:
          - email
      # Compromised-credential detection and adaptive authentication.
      # Threat Protection and the pricing tier are one setting, not two.
      # AdvancedSecurityMode requires PLUS; setting it on an ESSENTIALS pool
      # fails the stack outright with "The following features need to be
      # disabled for the ESSENTIALS pricing tier configured: Threat Protection".
      # Declaring them independently is how that mismatch shipped, so CognitoTier
      # now drives both and they cannot disagree.
      UserPoolTier: !Ref CognitoTier
      UserPoolAddOns: !If
        - ThreatProtectionAvailable
        - AdvancedSecurityMode: ENFORCED
        - !Ref AWS::NoValue
      MfaConfiguration: OPTIONAL
      EnabledMfas:
        - SOFTWARE_TOKEN_MFA
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 3
      Schema:
        - AttributeDataType: String
          Name: email
          Required: true
          Mutable: true
      UserPoolTags:
        Project: chintan
        Instance: !Ref InstanceName
        Application: Chintan

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      # Globally unique, same reasoning as ContentBucket above. Renaming this
      # replaces the domain but NOT the user pool, so existing users survive;
      # only the hosted-UI URL changes, and the frontend reads that from a
      # stack output.
      Domain: !Sub 'chintan-${InstanceName}-${Environment}-${AWS::AccountId}'
      UserPoolId: !Ref UserPool

  # Cognito User Pool Client (public, no secret)
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub 'chintan-${InstanceName}-${Environment}-client'
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AllowedOAuthFlows:
        - code
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      CallbackURLs:
        - !Sub 'https://${PagesHost}/${RepoName}/${InstanceName}/'
      LogoutURLs:
        - !Sub 'https://${PagesHost}/${RepoName}/${InstanceName}/'
      SupportedIdentityProviders:
        - COGNITO
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AuthSessionValidity: 3
      # Explicit, because the defaults (1 hour / 30 days) are invisible in the
      # console diff and the refresh token is the thing sealed in the CMK vault.
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: !Ref RefreshTokenValidityDays

  # DynamoDB Table
  DynamoDBTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub 'chintan-${InstanceName}-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      # gsi1pk = TENANT#<id>#NOTE#<noteId>, gsi1sk = CAPTURE#<createdAt>.
      # Turns note -> captures into a Query instead of a partition scan with
      # client-side filtering.
      #
      # INCLUDE, not ALL. ALL would project `data`, the opaque JSON blob that is
      # by far the largest attribute on a capture item, doubling its storage and
      # pulling it over the wire on every list — which is the exact cost the
      # projection work exists to remove. The set below is everything a capture
      # list renders plus every S3 key a cascade delete has to unlink, which is
      # the complete read; nothing here needs a second GetItem.
      #
      # `error` earns its place: a projection miss here is not an error, it is an
      # empty string, and the progress card falls back to "that capture did not
      # finish" — the user is told something broke but never what.
      #
      # Get this right now. Changing a GSI projection is not an update: the index
      # must be deleted and rebuilt, which on a populated table is an outage of
      # the note detail view. The keys are listed even where the model marks them
      # omitempty, because an unused projected attribute costs nothing when the
      # attribute is absent, and a missing one costs an index rebuild.
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              - capture_id
              - note_id
              - status
              - error
              - mode
              - created_at
              - appended_at
              - duration_ms
              - version
              - segments_key
              - peaks_key
              - audio_key
              - raw_key
              - routed_key
              - clean_key
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      # NEW_AND_OLD_IMAGES, and the OLD image is the one that matters. TTL
      # removes an archived note's index row and nothing else, so the S3 objects
      # it named — audio, raw transcript, routed transcript, cleaned text,
      # segments, peaks — used to stay in the bucket, billed, referenced by
      # nothing and reachable by nothing. The only record of what to delete is
      # the item as it was immediately before it vanished, and a TTL deletion
      # has no new image at all.
      #
      # KEYS_ONLY would carry pk and sk and none of the six S3 keys, which would
      # force the handler to read a row that no longer exists. NEW_IMAGE is
      # empty on a REMOVE. Only this view type answers the question.
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      Tags:
        - Key: Project
          Value: chintan
        - Key: Instance
          Value: !Ref InstanceName
        - Key: Application
          Value: Chintan

  # Capture pipeline queue. S3 ObjectCreated on an audio object lands here and
  # the worker drains it out-of-band, so nothing slow is bound by the gateway's
  # fixed 30-second integration ceiling.
  CaptureDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'chintan-captures-dlq-${InstanceName}-${Environment}'
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
      Tags:
        - Key: Project
          Value: chintan
        - Key: Instance
          Value: !Ref InstanceName
        - Key: Application
          Value: Chintan

  CaptureQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'chintan-captures-${InstanceName}-${Environment}'
      # Must exceed the worker Timeout (900s) or Lambda refuses the mapping.
      VisibilityTimeout: 960
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt CaptureDLQ.Arn
        maxReceiveCount: 3
      Tags:
        - Key: Project
          Value: chintan
        - Key: Instance
          Value: !Ref InstanceName
        - Key: Application
          Value: Chintan

  # The expiry handler's own dead-letter queue, matching the capture worker's.
  # A stream record that cannot be unlinked after its retries lands here rather
  # than ageing out of the stream unnoticed, which is what "the leak came back"
  # would otherwise look like: nothing in the logs and a bill that grows.
  #
  # It holds the record's metadata, not the record. Lambda's OnFailure
  # destination for a stream sends a pointer — stream ARN, shard, sequence
  # number range — so no note content and no S3 key reaches this queue.
  ExpiryDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'chintan-expiry-dlq-${InstanceName}-${Environment}'
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
      Tags:
        - Key: Project
          Value: chintan
        - Key: Instance
          Value: !Ref InstanceName
        - Key: Application
          Value: Chintan

  # The bucket ARN is written out rather than !GetAtt'd: ContentBucket already
  # points at the queue through its notification config, and referencing the
  # bucket here would close the cycle. The name is deterministic, so this is
  # exact, not approximate.
  CaptureQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref CaptureQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowContentBucketToPublishObjectCreated
            Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt CaptureQueue.Arn
            Condition:
              ArnLike:
                # MUST stay byte-identical to ContentBucket's BucketName below.
                # These are two hand-written copies of one name, coupled only by
                # this comment: when the bucket gained ${Environment} this was
                # left behind, the ArnLike pattern matched nothing, and S3's
                # test-publish failed the whole stack with "Unable to validate
                # the following destination configurations".
                aws:SourceArn: !Sub 'arn:aws:s3:::chintan-content-${InstanceName}-${Environment}-${AWS::AccountId}'
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  # S3 Content Bucket
  ContentBucket:
    Type: AWS::S3::Bucket
    # Deleting the stack must not delete the recordings.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    # S3 validates the notification destination at create time, so the queue
    # policy has to be in place first.
    DependsOn: CaptureQueuePolicy
    Properties:
      # ${Environment} is load-bearing. S3 bucket names are globally unique, so
      # without it a second environment of the same instance cannot be created
      # at all -- CloudFormation rejects the whole change set with
      # AWS::EarlyValidation::ResourceExistenceCheck before creating anything.
      # Every other named resource in this template already includes it; these
      # two were carried over from when there was only ever one environment.
      BucketName: !Sub 'chintan-content-${InstanceName}-${Environment}-${AWS::AccountId}'
      # S3 filters take one prefix and one suffix, and cannot express
      # tenants/*/captures/. Matching on the audio filename instead is exact:
      # it fires for the uploaded recording and for nothing the worker writes
      # afterwards, which would otherwise re-trigger the worker on its own output.
      NotificationConfiguration:
        QueueConfigurations:
          - Event: 's3:ObjectCreated:*'
            Queue: !GetAtt CaptureQueue.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: 'tenants/'
                  - Name: suffix
                    Value: '/audio.webm'
          - Event: 's3:ObjectCreated:*'
            Queue: !GetAtt CaptureQueue.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: 'tenants/'
                  - Name: suffix
                    Value: '/audio.m4a'
          - Event: 's3:ObjectCreated:*'
            Queue: !GetAtt CaptureQueue.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: 'tenants/'
                  - Name: suffix
                    Value: '/audio.mp3'
          - Event: 's3:ObjectCreated:*'
            Queue: !GetAtt CaptureQueue.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: 'tenants/'
                  - Name: suffix
                    Value: '/audio.ogg'
          - Event: 's3:ObjectCreated:*'
            Queue: !GetAtt CaptureQueue.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: 'tenants/'
                  - Name: suffix
                    Value: '/audio.wav'
          - Event: 's3:ObjectCreated:*'
            Queue: !GetAtt CaptureQueue.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: 'tenants/'
                  - Name: suffix
                    Value: '/audio.bin'
      # §4.9. Retention expires source audio only. The prefix cannot isolate
      # captures either, so the rule is keyed on the object tag the presigned
      # PUT carries; an untagged object is never expired, which fails safe.
      LifecycleConfiguration:
        Rules:
          - !If
            - HasRetention
            - Id: ExpireCaptureAudio
              Status: Enabled
              Prefix: 'tenants/'
              TagFilters:
                - Key: chintan-artifact
                  Value: capture-audio
              ExpirationInDays: !Ref RetentionDays
              NoncurrentVersionExpiration:
                NoncurrentDays: !Ref RetentionDays
            - !Ref AWS::NoValue
          # Versioning is on unconditionally, so every delete and every rewrite
          # of an artifact leaves a noncurrent version behind that is billed and
          # invisible to `aws s3 ls`. This rule is deliberately outside the
          # HasRetention !If above: RetentionDays defaults to 0 and no shipped
          # config sets it, so a conditional rule would mean the default deploy
          # never frees a byte. It expires the superseded copy only; the current
          # object is untouched, which is a different concern and belongs to
          # ExpireCaptureAudio. ExpireDeleteMarkers below cannot do this job
          # either — a delete marker only expires once nothing is behind it.
          - Id: ExpireNoncurrentVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 7
          - Id: AbortStaleMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          - Id: ExpireDeleteMarkers
            Status: Enabled
            ExpiredObjectDeleteMarker: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - '*'
            AllowedMethods:
              - GET
              - PUT
              - HEAD
            AllowedOrigins:
              - !Ref AllowedOrigin
            ExposedHeaders:
              - ETag
              - Content-Type
            MaxAge: 3600
      Tags:
        - Key: Project
          Value: chintan
        - Key: Instance
          Value: !Ref InstanceName
        - Key: Application
          Value: Chintan

  # Lambda Execution Role
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'chintan-lambda-${InstanceName}-${Environment}'
      # Bound by the same ceiling as the agent so privilege cannot escalate through Lambda (G-046).
      PermissionsBoundary: !Sub 'arn:aws:iam::${AWS::AccountId}:policy/chintan-agent-boundary'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                # dynamodb:Scan is deliberately absent. Every access path is a
                # keyed Query; a Scan here would only ever be a bug that reads
                # across tenants.
                Resource:
                  - !GetAtt DynamoDBTable.Arn
                  - !Sub '${DynamoDBTable.Arn}/index/gsi1'
              # The expiry stream. Lambda checks these four at
              # CreateEventSourceMapping time and refuses the mapping without
              # them, so a missing grant here fails the deploy rather than the
              # first expired note. The stream ARN carries a creation-time label
              # that changes if streams are ever disabled and re-enabled, hence
              # the wildcard: !GetAtt DynamoDBTable.StreamArn would pin this
              # policy to one label and silently stop matching after that.
              - Effect: Allow
                Action:
                  - dynamodb:DescribeStream
                  - dynamodb:GetRecords
                  - dynamodb:GetShardIterator
                  - dynamodb:ListStreams
                Resource:
                  - !Sub '${DynamoDBTable.Arn}/stream/*'
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  # A PUT that carries x-amz-tagging needs PutObjectTagging on
                  # the principal that SIGNED the presigned URL, not on the
                  # browser using it. Without it S3 answers 403 to an upload
                  # whose signature is perfectly valid, and the client sees only
                  # "Forbidden" with nothing naming the missing permission.
                  #
                  # The tag is not decorative: the lifecycle rule selects on
                  # chintan-artifact=capture-audio, so it is what makes
                  # RetentionDays expire audio and nothing else. Adding the tag
                  # without this grant made every upload fail.
                  - s3:PutObjectTagging
                  - s3:GetObjectTagging
                Resource: !Sub '${ContentBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !GetAtt ContentBucket.Arn
        - PolicyName: SSMAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/chintan/${InstanceName}/groq_api_key'
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/chintan/${InstanceName}/llm_api_key'
                  # The refresh-token vault key. A SecureString like the two
                  # above, and created out of band for the same reason:
                  # AWS::SSM::Parameter cannot declare type SecureString.
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/chintan/${InstanceName}/token_vault_key'
              # Still needed, and nothing to do with the retired CMK: reading
              # any SecureString decrypts it under the AWS-managed aws/ssm key.
              # That key is free; only customer-managed keys carry the
              # $1/month/version charge that the vault CMK was costing.
              - Effect: Allow
                Action:
                  - kms:Decrypt
                Resource: !Sub 'arn:aws:kms:${AWS::Region}:${AWS::AccountId}:alias/aws/ssm'
        - PolicyName: CognitoRefresh
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # InitiateAuth takes no resource, so the scope has to come from a
              # condition. Unconditioned, this role could initiate auth against
              # every user pool in the account.
              - Effect: Allow
                Action:
                  - cognito-idp:InitiateAuth
                Resource: '*'
                Condition:
                  StringEquals:
                    cognito-idp:userPoolArn: !GetAtt UserPool.Arn
        - PolicyName: CaptureQueueAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Receive/Delete for the worker's event source mapping; Send so the
              # API can requeue a capture on POST /v1/captures/{id}/retry.
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:ChangeMessageVisibility
                  - sqs:GetQueueAttributes
                  - sqs:GetQueueUrl
                  - sqs:SendMessage
                Resource: !GetAtt CaptureQueue.Arn
              - Effect: Allow
                Action:
                  - sqs:GetQueueAttributes
                Resource: !GetAtt CaptureDLQ.Arn
              # A stream event source has no redrive policy of its own: the
              # OnFailure destination is written by LAMBDA using the function's
              # execution role, so without this the mapping is created, the
              # retries are exhausted, and the record is dropped with the
              # destination silently unwritten.
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt ExpiryDLQ.Arn
        - PolicyName: XRayTracing
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # AWSLambdaBasicExecutionRole does not carry these, and the
              # bootstrap role may only attach that one managed policy.
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: '*'
      Tags:
        - Key: Project
          Value: chintan
        - Key: Instance
          Value: !Ref InstanceName
        - Key: Application
          Value: Chintan

  # Lambda Function
  ApiLambdaFunction:
    Type: AWS::Lambda::Function
    # Create the log group first, or Lambda auto-creates one on first invoke and
    # the stack's group then conflicts with it.
    DependsOn: ApiLogGroup
    Properties:
      FunctionName: !Sub 'chintan-api-${InstanceName}-${Environment}'
      Runtime: provided.al2023
      Handler: bootstrap
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref LambdaCodeKey
      Role: !GetAtt LambdaExecutionRole.Arn
      Architectures:
        - arm64
      MemorySize: 512
      # HTTP API integrations are capped at 30 seconds and the cap is not
      # adjustable. Anything above that is unreachable: the client already has
      # its 504 and the account is still paying for the running invocation.
      Timeout: 29
      ReservedConcurrentExecutions: 5
      TracingConfig:
        Mode: Active
      Environment:
        Variables:
          TABLE_NAME: !Ref DynamoDBTable
          CONTENT_BUCKET: !Ref ContentBucket
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          LLM_BASE_URL: https://api.minimax.io/v1
          LLM_MODEL: MiniMax-M3
          GROQ_API_KEY_PATH: !Sub '/chintan/${InstanceName}/groq_api_key'
          LLM_API_KEY_PATH: !Sub '/chintan/${InstanceName}/llm_api_key'
          # Both halves are required. The service verifies tokens itself rather
          # than trusting the gateway authorizer, and it builds the JWKS issuer
          # URL from the region and the pool id — so with the client id alone it
          # fails closed at init with "auth: issuer is required" and every
          # request 500s. Fail-closed is right; shipping only half the config was
          # not.
          USER_POOL_ID: !Ref UserPool
          USER_POOL_CLIENT_ID: !Ref UserPoolClient
          TOKEN_VAULT_KEY_PATH: !Sub '/chintan/${InstanceName}/token_vault_key'
          WEBAUTHN_RP_DISPLAY_NAME: Chintan
          CAPTURE_QUEUE_URL: !Ref CaptureQueue
          DAILY_SPEND_CAP_MICROS: !Ref DailySpendCapMicros
      Tags:
        - Key: Project
          Value: chintan
        - Key: Instance
          Value: !Ref InstanceName
        - Key: Application
          Value: Chintan

  # Worker Lambda — the slow half of the pipeline. Transcribe, route, clean,
  # append. Invoked out-of-band from SQS, so its ceiling is Lambda's 900s rather
  # than the gateway's 30.
  WorkerLambdaFunction:
    Type: AWS::Lambda::Function
    DependsOn: WorkerLogGroup
    Properties:
      FunctionName: !Sub 'chintan-worker-${InstanceName}-${Environment}'
      Runtime: provided.al2023
      Handler: bootstrap
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref WorkerCodeKey
      Role: !GetAtt LambdaExecutionRole.Arn
      Architectures:
        - arm64
      MemorySize: 2048
      Timeout: 900
      ReservedConcurrentExecutions: 5
      TracingConfig:
        Mode: Active
      Environment:
        Variables:
          TABLE_NAME: !Ref DynamoDBTable
          CONTENT_BUCKET: !Ref ContentBucket
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          LLM_BASE_URL: https://api.minimax.io/v1
          LLM_MODEL: MiniMax-M3
          GROQ_API_KEY_PATH: !Sub '/chintan/${InstanceName}/groq_api_key'
          LLM_API_KEY_PATH: !Sub '/chintan/${InstanceName}/llm_api_key'
          # Both halves are required. The service verifies tokens itself rather
          # than trusting the gateway authorizer, and it builds the JWKS issuer
          # URL from the region and the pool id — so with the client id alone it
          # fails closed at init with "auth: issuer is required" and every
          # request 500s. Fail-closed is right; shipping only half the config was
          # not.
          USER_POOL_ID: !Ref UserPool
          USER_POOL_CLIENT_ID: !Ref UserPoolClient
          WEBAUTHN_RP_DISPLAY_NAME: Chintan
          CAPTURE_QUEUE_URL: !Ref CaptureQueue
          DAILY_SPEND_CAP_MICROS: !Ref DailySpendCapMicros
      Tags:
        - Key: Project
          Value: chintan
        - Key: Instance
          Value: !Ref InstanceName
        - Key: Application
          Value: Chintan

  # Expiry Lambda — unlinks the S3 objects belonging to a record DynamoDB TTL
  # has expired. Same deployment package as the worker (backend/cmd/worker
  # dispatches on the event's own eventSource), a different function.
  #
  # A separate function rather than a second event source mapping on the worker,
  # for reasons that are all about blast radius rather than code:
  #   * Concurrency. The worker's five reserved executions are sized for
  #     provider round-trips measured in minutes. A month's worth of notes
  #     expiring in one hour must not consume them and leave a recording the
  #     user just made sitting in the queue.
  #   * Timeout. 900 seconds is right for a transcription and absurd for a
  #     handful of DeleteObject calls; five minutes bounds a runaway.
  #   * Its own dead-letter queue and its own alarm, which is only possible per
  #     function and per mapping.
  #   * Memory. 2048 MB is sized for the worker's provider work; this holds a
  #     page of capture rows.
  #
  # Same package rather than a third artifact: a new zip would mean a new
  # required template parameter plus edits to build-lambda.sh, bootstrap.sh,
  # ci-deploy-stack.sh and the deploy workflow, and a required parameter with no
  # default breaks every existing deploy invocation that does not yet pass it.
  ExpiryLambdaFunction:
    Type: AWS::Lambda::Function
    DependsOn: ExpiryLogGroup
    Properties:
      FunctionName: !Sub 'chintan-expiry-${InstanceName}-${Environment}'
      Runtime: provided.al2023
      Handler: bootstrap
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref WorkerCodeKey
      Role: !GetAtt LambdaExecutionRole.Arn
      Architectures:
        - arm64
      MemorySize: 512
      Timeout: 300
      ReservedConcurrentExecutions: 2
      TracingConfig:
        Mode: Active
      Environment:
        Variables:
          TABLE_NAME: !Ref DynamoDBTable
          CONTENT_BUCKET: !Ref ContentBucket
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          LLM_BASE_URL: https://api.minimax.io/v1
          LLM_MODEL: MiniMax-M3
          # The binary is shared with the worker and refuses to start without a
          # resolvable provider key, deliberately: that fail-fast is what stops
          # a misconfigured worker from reporting healthy. This function never
          # calls a provider, but it is the same process and must satisfy the
          # same contract.
          GROQ_API_KEY_PATH: !Sub '/chintan/${InstanceName}/groq_api_key'
          LLM_API_KEY_PATH: !Sub '/chintan/${InstanceName}/llm_api_key'
          USER_POOL_ID: !Ref UserPool
          USER_POOL_CLIENT_ID: !Ref UserPoolClient
          WEBAUTHN_RP_DISPLAY_NAME: Chintan
          CAPTURE_QUEUE_URL: !Ref CaptureQueue
          DAILY_SPEND_CAP_MICROS: !Ref DailySpendCapMicros
      Tags:
        - Key: Project
          Value: chintan
        - Key: Instance
          Value: !Ref InstanceName
        - Key: Application
          Value: Chintan

  # ---------------------------------------------------------------------------
  # Versions and the `live` alias — the cutover point, and the reason rollback
  # means anything.
  #
  # CloudFormation stages new code on the function. Nothing serves it until the
  # `live` alias moves, which scripts/deploy.sh does once the change set has
  # succeeded. Rollback is then one `lambda update-alias` back to the previous
  # version, with no CloudFormation operation and no rebuild.
  #
  # These versions are published once, at stack create, purely so each alias has
  # a legal target: an alias may not point at $LATEST. They are deliberately NOT
  # tied to LambdaCodeKey. If CloudFormation republished and re-pointed the alias
  # on every deploy, the "previous version" deploy.sh captures for the rollback
  # command would already be the new code, and rollback would be a no-op that
  # looked like a success.
  #
  # The corollary: a bare `aws cloudformation deploy` updates the code without
  # putting it in front of traffic. That is the intended two-phase behaviour, not
  # an oversight — deploy.sh performs the second phase.
  # ---------------------------------------------------------------------------
  ApiLambdaInitialVersion:
    Type: AWS::Lambda::Version
    Properties:
      FunctionName: !Ref ApiLambdaFunction
      Description: Initial version, so the live alias has a target at stack create.

  ApiLambdaLiveAlias:
    Type: AWS::Lambda::Alias
    Properties:
      FunctionName: !Ref ApiLambdaFunction
      Name: live
      FunctionVersion: !GetAtt ApiLambdaInitialVersion.Version
      Description: Traffic pointer. Moved by scripts/deploy.sh, not by this template.

  WorkerLambdaInitialVersion:
    Type: AWS::Lambda::Version
    Properties:
      FunctionName: !Ref WorkerLambdaFunction
      Description: Initial version, so the live alias has a target at stack create.

  WorkerLambdaLiveAlias:
    Type: AWS::Lambda::Alias
    Properties:
      FunctionName: !Ref WorkerLambdaFunction
      Name: live
      FunctionVersion: !GetAtt WorkerLambdaInitialVersion.Version
      Description: Traffic pointer. Moved by scripts/deploy.sh, not by this template.

  ExpiryLambdaInitialVersion:
    Type: AWS::Lambda::Version
    Properties:
      FunctionName: !Ref ExpiryLambdaFunction
      Description: Initial version, so the live alias has a target at stack create.

  ExpiryLambdaLiveAlias:
    Type: AWS::Lambda::Alias
    Properties:
      FunctionName: !Ref ExpiryLambdaFunction
      Name: live
      FunctionVersion: !GetAtt ExpiryLambdaInitialVersion.Version
      Description: Traffic pointer. Moved by scripts/deploy.sh, not by this template.

  CaptureQueueEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    # Lambda validates, at mapping-creation time, that the function's execution
    # role can ReceiveMessage on the queue. Nothing otherwise orders this against
    # LambdaExecutionRole: the dependency runs through the alias to the function
    # to the role, so CloudFormation is free to create the mapping while the
    # role's inline policy is still propagating, and it fails with
    #   "The function execution role does not have permissions to call
    #    ReceiveMessage on SQS"
    # naming a permission the role demonstrably has.
    #
    # DependsOn makes the ordering explicit rather than transitive. It does not
    # abolish IAM's eventual consistency -- nothing in a template can -- so a
    # first create can still lose the race; the deploy script clears
    # ROLLBACK_COMPLETE so a retry is one re-run rather than a manual cleanup.
    DependsOn:
      - LambdaExecutionRole
      - CaptureQueuePolicy
    Properties:
      EventSourceArn: !GetAtt CaptureQueue.Arn
      # The alias, not the function: a rollback that leaves the worker on the
      # bad version has rolled back half the system.
      FunctionName: !Ref WorkerLambdaLiveAlias
      Enabled: true
      # One capture per invocation: a batch failure must not redeliver captures
      # that already appended.
      BatchSize: 1
      FunctionResponseTypes:
        - ReportBatchItemFailures
      ScalingConfig:
        MaximumConcurrency: 5

  # The expiry stream. This is what closes the orphaned-object leak: TTL removes
  # an archived note's index row, and this mapping is how anything finds out.
  TableExpiryEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    # Same reasoning as CaptureQueueEventSourceMapping: Lambda validates the
    # execution role's stream permissions when the mapping is created, and
    # nothing else orders this against the role's inline policy.
    DependsOn:
      - LambdaExecutionRole
    Properties:
      EventSourceArn: !GetAtt DynamoDBTable.StreamArn
      # The alias, not the function, so a rollback moves this too.
      FunctionName: !Ref ExpiryLambdaLiveAlias
      Enabled: true
      # TRIM_HORIZON, not LATEST. The stream is created empty by this same
      # change, so on a first deploy the two are identical — but if the mapping
      # is ever replaced, LATEST silently discards every expiry that happened
      # in between, and those are precisely the records nothing else can
      # reconstruct. Replaying up to 24 hours is harmless because the handler
      # is idempotent: a redelivered record re-deletes objects that are already
      # gone, which repository.Objects reports as success.
      StartingPosition: TRIM_HORIZON
      BatchSize: 10
      MaximumRetryAttempts: 3
      # A poison record must not block its shard. Without this, one record the
      # handler cannot process is retried with the whole batch until it ages
      # out, and every expiry behind it waits.
      BisectBatchOnFunctionError: true
      FunctionResponseTypes:
        - ReportBatchItemFailures
      DestinationConfig:
        OnFailure:
          Destination: !GetAtt ExpiryDLQ.Arn
      # Belt to the handler's braces. purge.IsTTLExpiry makes the same decision
      # in code and is what the tests cover; this filter means Lambda is never
      # invoked for the other 99% of the stream — every note write, every
      # capture status change, every idempotency record — which is both the
      # cost argument and a second lock on the one mistake that matters.
      #
      # userIdentity is stamped only on a deletion DynamoDB performed itself.
      # A user pressing "delete forever" produces a REMOVE with no userIdentity
      # at all, does not match this pattern, and must not: that path has already
      # deleted its own objects, and unlinking again on an ordinary archive
      # would destroy a recording the user still has.
      FilterCriteria:
        Filters:
          - Pattern: '{"eventName":["REMOVE"],"userIdentity":{"type":["Service"],"principalId":["dynamodb.amazonaws.com"]}}'

  # CloudWatch Log Group
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/chintan-api-${InstanceName}-${Environment}'
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Project
          Value: chintan
        - Key: Instance
          Value: !Ref InstanceName
        - Key: Application
          Value: Chintan

  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/chintan-worker-${InstanceName}-${Environment}'
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Project
          Value: chintan
        - Key: Instance
          Value: !Ref InstanceName
        - Key: Application
          Value: Chintan

  ExpiryLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/chintan-expiry-${InstanceName}-${Environment}'
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Project
          Value: chintan
        - Key: Instance
          Value: !Ref InstanceName
        - Key: Application
          Value: Chintan

  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/apigateway/chintan-${InstanceName}-${Environment}'
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Project
          Value: chintan
        - Key: Instance
          Value: !Ref InstanceName
        - Key: Application
          Value: Chintan

  # HTTP API Gateway
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub 'chintan-api-${InstanceName}-${Environment}'
      Description: !Sub 'Chintan HTTP API for ${InstanceName}'
      ProtocolType: HTTP
      CorsConfiguration:
        AllowCredentials: true
        # API Gateway answers the preflight itself, before the Lambda's own CORS
        # middleware ever runs, so this list — not the one in internal/middleware
        # — is what a browser is told. They must agree: the client sends
        # Idempotency-Key on every POST, and with it missing here the browser
        # refuses the request before it is ever sent, reporting only
        #   "Response to preflight request doesn't pass access control check"
        # with no clue which header was the problem.
        AllowHeaders:
          - Authorization
          - Content-Type
          - Idempotency-Key
          - X-Correlation-Id
          - X-Amz-Date
          - X-Api-Key
          - X-Amz-Security-Token
        # Correlation ids are only useful to a caller that can read them back;
        # a cross-origin response hides every header not named here.
        ExposeHeaders:
          - X-Correlation-Id
        AllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        AllowOrigins:
          - !Ref AllowedOrigin
        MaxAge: 86400
      Tags:
        Project: chintan
        Instance: !Ref InstanceName
        Application: Chintan

  # JWT Authorizer for Cognito
  JwtAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      Name: !Sub 'chintan-jwt-${InstanceName}-${Environment}'
      ApiId: !Ref HttpApi
      AuthorizerType: JWT
      IdentitySource:
        - '$request.header.Authorization'
      JwtConfiguration:
        Audience:
          - !Ref UserPoolClient
        Issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'

  # Lambda Integration
  LambdaIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      # The alias ARN, not the function ARN. Pointed at the bare function, the
      # alias would be a record of what was deployed rather than a pointer to
      # what is serving, and moving it back would roll nothing back.
      IntegrationUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ApiLambdaLiveAlias}/invocations'
      PayloadFormatVersion: '2.0'

  # Liveness. Declared NONE explicitly: it is the gateway default for a route
  # that omits the property, but the two health routes and the WebAuthn login
  # pair are the entire unauthenticated surface, and that is worth stating
  # rather than inheriting.
  HealthRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'GET /v1/health'
      AuthorizationType: NONE
      Target: !Sub 'integrations/${LambdaIntegration}'

  # Readiness. docs/api/openapi.yaml declares this operation `security: []` and
  # handler/routes.go registers it public(); without this route it fell through
  # $default to the JWT authorizer and answered the gateway's own
  # 401 {"message":"Unauthorized"} — never reaching Lambda, so an uptime probe
  # written from the document alarmed permanently. The response carries
  # dependency names and latencies only; the probe error text is logged, never
  # serialised (service/readiness.go), so there is nothing here to authenticate.
  # openapi_conformance_test.go asserts this set matches the document.
  HealthReadyRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'GET /v1/health/ready'
      AuthorizationType: NONE
      Target: !Sub 'integrations/${LambdaIntegration}'

  # $default JWT authorizer does not auto-answer CORS preflight; keep OPTIONS open.
  OptionsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'OPTIONS /{proxy+}'
      AuthorizationType: NONE
      Target: !Sub 'integrations/${LambdaIntegration}'

  # Biometric login must be reachable without a Cognito JWT.
  WebAuthnLoginOptionsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'POST /v1/auth/webauthn/login/options'
      AuthorizationType: NONE
      Target: !Sub 'integrations/${LambdaIntegration}'

  WebAuthnLoginRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'POST /v1/auth/webauthn/login'
      AuthorizationType: NONE
      Target: !Sub 'integrations/${LambdaIntegration}'

  # Route for protected endpoints (with auth)
  ProtectedRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: '$default'
      Target: !Sub 'integrations/${LambdaIntegration}'
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  # Default Stage
  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      StageName: $default
      ApiId: !Ref HttpApi
      AutoDeploy: true
      # Route key and status only. No query string, no body, no header beyond
      # the correlation id — nothing here may carry transcript content.
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: >-
          {"requestId":"$context.requestId","correlationId":"$context.requestId","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","routeKey":"$context.routeKey","status":"$context.status","protocol":"$context.protocol","responseLength":"$context.responseLength","responseLatency":"$context.responseLatency","integrationStatus":"$context.integrationStatus","integrationErrorMessage":"$context.integrationErrorMessage","authorizerError":"$context.authorizer.error"}
      DefaultRouteSettings:
        # Off, because it is billed as custom metrics and buys almost nothing
        # here. Detailed metrics add the (ApiId, Method, Resource, Stage)
        # dimension set; the gateway only knows five routes, and every one of
        # the application's other twenty-five arrives as $default because the
        # routing happens inside the Lambda. The per-route breakdown being paid
        # for is therefore mostly one bucket labelled $default, while the EMF
        # ApiRequests/ApiLatency metrics already carry the real registered-route
        # breakdown.
        #
        # Api5xxRateAlarm is unaffected: it dimensions on ApiId alone, and the
        # ApiId and (ApiId, Stage) sets are published by default at no charge.
        DetailedMetricsEnabled: false
        ThrottlingBurstLimit: 100
        ThrottlingRateLimit: 50
      Tags:
        Project: chintan
        Instance: !Ref InstanceName
        Application: Chintan

  # Lambda Permission for API Gateway
  # Granted on the alias, because a qualified invocation is authorised against
  # the qualified resource. A permission on the bare function would not be
  # consulted at all, and the gateway would get 403 on every request.
  LambdaApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiLambdaLiveAlias
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*'

  # ---------------------------------------------------------------------------
  # Alerting. An unattended pipeline that fails silently is worse than no
  # pipeline: the user believes the recording was filed.
  # ---------------------------------------------------------------------------
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub 'chintan-alarms-${InstanceName}-${Environment}'
      DisplayName: !Sub 'Chintan ${InstanceName} alarms'
      Tags:
        - Key: Project
          Value: chintan
        - Key: Instance
          Value: !Ref InstanceName
        - Key: Application
          Value: Chintan

  # No AlarmEmail means no subscription, so a third-party clone deploys without
  # editing anything. The alarms still fire and are still visible in the console.
  AlarmTopicSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  # Budgets publishes as a service principal, which the default topic policy
  # does not cover.
  AlarmTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref AlarmTopic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # A TopicPolicy replaces the default policy outright, so the owner
          # statement has to be restated or the account loses its own topic.
          - Sid: AllowOwningAccountFullControl
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action:
              - sns:GetTopicAttributes
              - sns:SetTopicAttributes
              - sns:AddPermission
              - sns:RemovePermission
              - sns:DeleteTopic
              - sns:Subscribe
              - sns:ListSubscriptionsByTopic
              - sns:Publish
            Resource: !Ref AlarmTopic
          - Sid: AllowCloudWatchAlarmsToPublish
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action: sns:Publish
            Resource: !Ref AlarmTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
          - Sid: AllowBudgetsToPublish
            Effect: Allow
            Principal:
              Service: budgets.amazonaws.com
            Action: sns:Publish
            Resource: !Ref AlarmTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  ApiFunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'chintan-${InstanceName}-${Environment}-api-errors'
      AlarmDescription: API Lambda returned an unhandled error.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiLambdaFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic
      OKActions:
        - !Ref AlarmTopic

  ApiFunctionThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'chintan-${InstanceName}-${Environment}-api-throttles'
      AlarmDescription: API Lambda hit its reserved concurrency ceiling.
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiLambdaFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  WorkerFunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'chintan-${InstanceName}-${Environment}-worker-errors'
      AlarmDescription: Worker Lambda failed a capture. Fires before the DLQ does.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref WorkerLambdaFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic
      OKActions:
        - !Ref AlarmTopic

  WorkerFunctionThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'chintan-${InstanceName}-${Environment}-worker-throttles'
      AlarmDescription: Worker Lambda hit its reserved concurrency ceiling; captures are queueing.
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref WorkerLambdaFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  # A single message here is one recording the user believes was filed and was not.
  CaptureDLQDepthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'chintan-${InstanceName}-${Environment}-capture-dlq'
      AlarmDescription: A capture exhausted its retries and is sitting in the dead-letter queue.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt CaptureDLQ.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic
      OKActions:
        - !Ref AlarmTopic

  # A message here is an expired note whose objects were not unlinked. Nothing
  # else reports that: the index row is already gone, the UI never showed the
  # note again, and the only symptom is a storage bill that keeps growing.
  #
  # There is deliberately no companion Errors alarm on ExpiryLambdaFunction, as
  # there is on the worker. The worker's exists because a capture failure is
  # user-visible and worth hearing about before the DLQ fills three retries
  # later; nobody is waiting on an expiry, and an alarm per transient
  # DeleteObject blip would be noise for a job the retries fix on their own.
  ExpiryDLQDepthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'chintan-${InstanceName}-${Environment}-expiry-dlq'
      AlarmDescription: An expired record exhausted its retries; its S3 objects are still in the bucket.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt ExpiryDLQ.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic
      OKActions:
        - !Ref AlarmTopic

  # ---------------------------------------------------------------------------
  # Provider credentials and provider throttling. Two alarms rather than one,
  # because the two failures need opposite responses and merging them gives
  # either false alarms or a missed outage.
  #
  # Both read a DIMENSIONLESS metric. obs.EmitWithRollup publishes each counter
  # under two identities — {Provider} for the answer, and no dimensions for the
  # alarm — precisely so these can be plain metric alarms. The alternative,
  # taken by SpendCapRejectionsAlarm below, is a Metrics Insights query, which
  # is billed per metric analysed with no free tier and grows by $0.10 every
  # time a provider is added. See docs/cost-analysis.md §5.3.
  #
  # Neither the pipeline nor the handler notifies anybody directly. The email is
  # the alarm's own OK -> ALARM transition, which is what makes a revoked key
  # one message rather than one per capture: the second, third and hundredth
  # failure keep the alarm in ALARM and send nothing.
  # ---------------------------------------------------------------------------
  ProviderKeyRejectedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'chintan-${InstanceName}-${Environment}-provider-key-rejected'
      AlarmDescription: >-
        A provider answered 401 or 403. The API key is revoked, expired or
        wrong, and every capture will fail the same way until it is replaced.
      Namespace: Chintan
      MetricName: ProviderKeyRejected
      Statistic: Sum
      Period: 300
      # One occurrence, immediately. This does not resolve itself, so waiting
      # for a second datapoint only delays the one action that fixes it.
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      # The metric does not exist until the first rejection, which is the
      # healthy state.
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic
      OKActions:
        - !Ref AlarmTopic

  ProviderRateLimitedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'chintan-${InstanceName}-${Environment}-provider-rate-limited'
      AlarmDescription: >-
        A provider has been answering 429 continuously for fifteen minutes.
        Ordinary throttling clears long before this fires.
      Namespace: Chintan
      MetricName: ProviderRateLimited
      Statistic: Sum
      Period: 300
      # Three consecutive five-minute windows, each containing at least one
      # rejection. A single 429 — the common case, and self-resolving — produces
      # one datapoint and two missing periods, and notBreaching means those two
      # do not count. Only sustained throttling reaches all three.
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic
      OKActions:
        - !Ref AlarmTopic

  # Average of the 5xx metric is the 5xx rate: 0.05 is five percent of requests.
  Api5xxRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'chintan-${InstanceName}-${Environment}-api-5xx-rate'
      AlarmDescription: More than five percent of API requests are failing server-side.
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref HttpApi
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 0.05
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic
      OKActions:
        - !Ref AlarmTopic

  # A breaker nobody hears about is a silent outage with a good excuse: captures
  # start failing for cost reasons and look identical to failing for technical
  # ones. Only installed when a cap is actually set — at DailySpendCapMicros 0
  # the breaker never rejects, and an alarm that cannot fire is worse than no
  # alarm, because the console shows it green.
  #
  # This is a Metrics Insights query rather than a plain metric alarm because
  # obs.Emit declares exactly one dimension set, ["Provider","Op"], so CloudWatch
  # holds no dimensionless rollup of SpendCapRejections to alarm on. A
  # no-dimension alarm would never receive a datapoint and, with notBreaching,
  # would sit permanently OK. SCHEMA() sums across every provider and op without
  # naming any of them, so adding a provider needs no template edit.
  SpendCapRejectionsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasSpendCap
    Properties:
      AlarmName: !Sub 'chintan-${InstanceName}-${Environment}-spend-cap-tripped'
      AlarmDescription: >-
        The daily spend cap rejected a provider call. Captures are being refused
        on cost, not on failure.
      Metrics:
        - Id: rejections
          Expression: 'SELECT SUM(SpendCapRejections) FROM SCHEMA("Chintan", Provider, Op)'
          Period: 300
          ReturnData: true
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      # The metric does not exist at all until the first rejection, which is the
      # healthy state. Without this the alarm would read INSUFFICIENT_DATA for
      # the entire life of an instance that never trips.
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic
      OKActions:
        - !Ref AlarmTopic

  # ---------------------------------------------------------------------------
  # Cost ceiling, in the template rather than in a README copy-paste step that
  # nobody performs. Account-scoped on purpose: a tag-filtered budget silently
  # reports zero until Project is activated as a cost allocation tag, and a
  # budget that reads zero is worse than one that reads slightly high.
  # ---------------------------------------------------------------------------
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub 'chintan-${InstanceName}-${Environment}'
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUSD
          Unit: USD
      NotificationsWithSubscribers: !If
        - HasAlarmEmail
        - - Notification:
              NotificationType: ACTUAL
              ComparisonOperator: GREATER_THAN
              Threshold: 80
              ThresholdType: PERCENTAGE
            Subscribers:
              - SubscriptionType: EMAIL
                Address: !Ref AlarmEmail
          - Notification:
              NotificationType: FORECASTED
              ComparisonOperator: GREATER_THAN
              Threshold: 100
              ThresholdType: PERCENTAGE
            Subscribers:
              - SubscriptionType: EMAIL
                Address: !Ref AlarmEmail
        - !Ref AWS::NoValue

Outputs:
  ApiEndpoint:
    Description: HTTP API Gateway endpoint URL
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'
    Export:
      Name: !Sub '${AWS::StackName}-ApiEndpoint'

  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool
    Export:
      Name: !Sub '${AWS::StackName}-UserPoolId'

  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref UserPoolClient
    Export:
      Name: !Sub '${AWS::StackName}-UserPoolClientId'

  UserPoolDomainName:
    Description: Cognito Hosted UI domain prefix
    Value: !Ref UserPoolDomain
    Export:
      Name: !Sub '${AWS::StackName}-UserPoolDomain'

  ContentBucketName:
    Description: S3 Content Bucket Name
    Value: !Ref ContentBucket
    Export:
      Name: !Sub '${AWS::StackName}-ContentBucketName'

  TableName:
    Description: DynamoDB Table Name
    Value: !Ref DynamoDBTable
    Export:
      Name: !Sub '${AWS::StackName}-TableName'

  CaptureQueueUrl:
    Description: Capture pipeline SQS queue URL (CAPTURE_QUEUE_URL)
    Value: !Ref CaptureQueue
    Export:
      Name: !Sub '${AWS::StackName}-CaptureQueueUrl'

  CaptureQueueArn:
    Description: Capture pipeline SQS queue ARN (CAPTURE_QUEUE_ARN)
    Value: !GetAtt CaptureQueue.Arn
    Export:
      Name: !Sub '${AWS::StackName}-CaptureQueueArn'

  CaptureDLQUrl:
    Description: Capture pipeline dead-letter queue URL
    Value: !Ref CaptureDLQ
    Export:
      Name: !Sub '${AWS::StackName}-CaptureDLQUrl'

  WorkerFunctionName:
    Description: Worker Lambda function name
    Value: !Ref WorkerLambdaFunction
    Export:
      Name: !Sub '${AWS::StackName}-WorkerFunctionName'

  ExpiryFunctionName:
    Description: Expiry Lambda function name (DynamoDB TTL stream consumer)
    Value: !Ref ExpiryLambdaFunction
    Export:
      Name: !Sub '${AWS::StackName}-ExpiryFunctionName'

  ExpiryDLQUrl:
    Description: Dead-letter queue for expired records whose objects were not unlinked
    Value: !Ref ExpiryDLQ
    Export:
      Name: !Sub '${AWS::StackName}-ExpiryDLQUrl'

  AlarmTopicArn:
    Description: SNS topic every alarm publishes to
    Value: !Ref AlarmTopic
    Export:
      Name: !Sub '${AWS::StackName}-AlarmTopicArn'

  ApiFunctionLiveAliasArn:
    Description: Alias the API Gateway integration invokes; move it to roll back
    Value: !Ref ApiLambdaLiveAlias
    Export:
      Name: !Sub '${AWS::StackName}-ApiFunctionLiveAliasArn'

  WorkerFunctionLiveAliasArn:
    Description: Alias the capture queue invokes; move it to roll back
    Value: !Ref WorkerLambdaLiveAlias
    Export:
      Name: !Sub '${AWS::StackName}-WorkerFunctionLiveAliasArn'