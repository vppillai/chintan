                backgroundColor: 141816ff
                borderColor: b8f135ff
                indicatorColor: b8f135ff
          idpButtons:
            icons:
              enabled: true
        categories:
          global:
            colorSchemeMode: DYNAMIC
            pageHeader:
              enabled: false
            pageFooter:
              enabled: false
            spacingDensity: REGULAR
          form:
            sessionTimerDisplay: NONE
            instructions:
              enabled: false
            languageSelector:
              enabled: false
            displayGraphics: false
            location:
              horizontal: CENTER
              vertical: CENTER
          auth:
            federation:
              interfaceStyle: BUTTON_LIST
              order: []
            authMethodOrder:
            - - display: INPUT
                type: USERNAME_PASSWORD
          signUp:
            acceptanceElements:
            - enforcement: NONE
              textKey: en
      Assets:
        - Category: FORM_LOGO
          ColorMode: LIGHT
          Extension: PNG
          Bytes: 
        - Category: FORM_LOGO
          ColorMode: DARK
          Extension: PNG
          Bytes: 
        - Category: FAVICON_ICO
          ColorMode: LIGHT
          Extension: ICO
          Bytes: 
        - Category: FAVICON_ICO
          ColorMode: DARK
          Extension: ICO
          Bytes: 

  # DynamoDB Table
  DynamoDBTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub 'chintan-${InstanceName}-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      # gsi1pk = TENANT#<id>#NOTE#<noteId>, gsi1sk = CAPTURE#<createdAt>.
      # Turns note -> captures into a Query instead of a partition scan with
      # client-side filtering.
      #
      # INCLUDE, not ALL. ALL would project `data`, the opaque JSON blob that is
      # by far the largest attribute on a capture item, doubling its storage and
      # pulling it over the wire on every list — which is the exact cost the
      # projection work exists to remove. The set below is everything a capture
      # list renders plus every S3 key a cascade delete has to unlink, which is
      # the complete read; nothing here needs a second GetItem.
      #
      # `error` earns its place: a projection miss here is not an error, it is an
      # empty string, and the progress card falls back to "that capture did not
      # finish" — the user is told something broke but never what.
      #
      # Get this right now. Changing a GSI projection is not an update: the index
      # must be deleted and rebuilt, which on a populated table is an outage of
      # the note detail view. The keys are listed even where the model marks them
      # omitempty, because an unused projected attribute costs nothing when the
      # attribute is absent, and a missing one costs an index rebuild.
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              - capture_id
              - note_id
              - status
              - error
              - mode
              - created_at
              - appended_at
              - duration_ms
              - version
              - segments_key
              - peaks_key
              - audio_key
              - raw_key
              - routed_key
              - clean_key
        # There is no second index. gsi2 (notes by updated_at) existed from
        # 2026-08 to 2026-09 so the notes list could order by touch; the list
        # now drains the partition from the base table and orders in Go, as the
        # capture router always did, and the index, its backfill (`chintanctl
        # reindex`) and the two-step deploy it needed are gone. Removing a GSI
        # is an in-place UpdateTable — one index change per stack update — not
        # a replacement; scripts/deploy.sh's guard would refuse a replacement.
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      # TTL is the backstop, not the mechanism. The weekly expiry sweep
      # (ExpirySweepRule → the worker) deletes an archived note's objects and
      # then its row once purge_after_epoch has passed; the store writes ttl a
      # fortnight later than that deadline so the sweep wins the race. Nothing
      # consumes a stream any more — the stream-triggered expiry Lambda went
      # with the sweep — so the table has no StreamSpecification.
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      # Belt to Retain's braces. Retain keeps the table when the STACK is
      # deleted; this refuses a DeleteTable call on the table itself, which is
      # the console click or the script bug Retain cannot see. cleanup-aws.sh
      # turns it off, by name, in the log, immediately before the delete it
      # intends — the same way it handles the user pool.
      DeletionProtectionEnabled: true
      Tags:
        - Key: Project
          Value: chintan
        - Key: Instance
          Value: !Ref InstanceName
        - Key: Application
          Value: Chintan

  # The capture pipeline's dead-letter queue.
  #
  # There is no queue in FRONT of the worker any more. S3 ObjectCreated on an
  # audio object invokes WorkerLambdaLiveAlias directly (see ContentBucket's
  # NotificationConfiguration), the API's retry and target endpoints invoke it
  # with InvocationType Event, and Lambda's own asynchronous retry — twice,
  # about a minute and then two minutes apart, per WorkerLambdaEventInvokeConfig
  # — replaces the visibility-timeout redelivery. A queue in front would need a
  # visibility timeout longer than the 900 s function timeout, and a redelivery
  # that late lands inside the 20-minute append claim lease.
  #
  # What remains is the destination for an invocation that failed all three
  # attempts. Lambda writes the original payload and the error here through its
  # OnFailure destination, and CaptureDLQDepthAlarm watches the depth, so one
  # message here still means exactly what it did: one recording the user
  # believes was filed and was not. The recovery is POST /v1/captures/{id}/retry,
  # which invokes the worker again for the capture named in the message.
  CaptureDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'chintan-captures-dlq-${InstanceName}-${Environment}'
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
      Tags:
        - Key: Project
          Value: chintan
        - Key: Instance
          Value: !Ref InstanceName
        - Key: Application
          Value: Chintan

  # S3 may invoke the worker. Granted on the alias, because the bucket's
  # notification names the alias and a qualified invocation is authorised
  # against the qualified resource — a permission on the bare function would
  # not be consulted (LambdaApiPermission has the same note).
  #
  # The bucket ARN is written out rather than !GetAtt'd: ContentBucket points at
  # the alias through its notification config, and referencing the bucket here
  # would close the cycle. The name is deterministic, so this is exact, not
  # approximate — but it MUST stay byte-identical to ContentBucket's BucketName
  # below, and to the copies in both execution roles and the functions'
  # CONTENT_BUCKET, all of which exist for the same reason. When the bucket
  # gained ${Environment} the queue policy this replaced was left behind, the
  # SourceArn matched nothing, and S3's test-publish failed the whole stack
  # with "Unable to validate the following destination configurations".
  ContentBucketInvokesWorkerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref WorkerLambdaLiveAlias
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub 'arn:aws:s3:::chintan-content-${InstanceName}-${Environment}-${AWS::AccountId}'

  # S3 Content Bucket
  ContentBucket:
    Type: AWS::S3::Bucket
    # Deleting the stack must not delete the recordings.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    # S3 validates the notification destination when the configuration is
    # written, so the permission has to exist first. NotificationConfiguration
    # is a mutable property: switching it from the retired queue to the alias
    # is an in-place update of the existing bucket, and scripts/deploy.sh still
    # refuses any change set that would replace ContentBucket.
    DependsOn: ContentBucketInvokesWorkerPermission
    Properties:
      # ${Environment} is load-bearing. S3 bucket names are globally unique, so
      # without it a second environment of the same instance cannot be created
      # at all -- CloudFormation rejects the whole change set with
      # AWS::EarlyValidation::ResourceExistenceCheck before creating anything.
      # Every other named resource in this template already includes it; these
      # two were carried over from when there was only ever one environment.
      BucketName: !Sub 'chintan-content-${InstanceName}-${Environment}-${AWS::AccountId}'
      # S3 filters take one prefix and one suffix, and cannot express
      # tenants/*/captures/. Matching on the audio filename instead is exact:
      # it fires for the uploaded recording and for nothing the worker writes
      # afterwards, which would otherwise re-trigger the worker on its own output.
      #
      # The destination is the worker's live alias, invoked asynchronously —
      # the same pointer the API integration and the API's retries use, so a
      # rollback that moves the alias moves every way into the worker at once.
      # The cycle this would normally create (bucket → alias → function → role
      # → bucket) is broken on the Lambda side: the role's S3 grants and the
      # functions' CONTENT_BUCKET spell the bucket name out instead of
      # referencing this resource.
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: 's3:ObjectCreated:*'
            Function: !Ref WorkerLambdaLiveAlias
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: 'tenants/'
                  - Name: suffix
                    Value: '/audio.webm'
          - Event: 's3:ObjectCreated:*'
            Function: !Ref WorkerLambdaLiveAlias
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: 'tenants/'
                  - Name: suffix
                    Value: '/audio.m4a'
          - Event: 's3:ObjectCreated:*'
            Function: !Ref WorkerLambdaLiveAlias
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: 'tenants/'
                  - Name: suffix
                    Value: '/audio.mp3'
          - Event: 's3:ObjectCreated:*'
            Function: !Ref WorkerLambdaLiveAlias
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: 'tenants/'
                  - Name: suffix
                    Value: '/audio.ogg'
          - Event: 's3:ObjectCreated:*'
            Function: !Ref WorkerLambdaLiveAlias
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: 'tenants/'
                  - Name: suffix
                    Value: '/audio.wav'
      # Retention expires source audio only. The prefix cannot isolate
      # captures either, so the rules are keyed on the object tags the presigned
      # PUT carries; an untagged object is never expired, which fails safe.
      #
      # One rule per retention tier, because a lifecycle rule carries its own
      # ExpirationInDays and cannot read a number out of a DynamoDB item. The
      # only thing an upload can vary per user is WHICH rule matches, by way of
      # the chintan-retention tag value — so the set of periods this system can
      # offer is exactly the set of rules written here, and model.RetentionTiers
      # is the same list on the Go side. TestEveryRetentionTierHasALifecycleRule
      # fails if the two drift.
      #
      # The rules are keyed on the tag, not on a stack parameter: a single rule
      # with a stack-wide period would let the per-user `retention_days`
      # setting be validated, stored, returned and rendered while nothing
      # expired anything on account of it. An object carrying no
      # chintan-retention tag matches none of these and is kept indefinitely,
      # which is what a retention of 0 means and the only thing it means.
      #
      # chintan-processed is the third, newer condition. A capture whose upload
      # event never reached the worker — the S3 notification lost, the worker
      # dead — sits at `uploaded` with no chance to run, and this tag is
      # the only one of the three the WORKER sets rather than the upload PUT: it
      # is applied by internal/pipeline.markAudioProcessedIfSafe once
      # transcription actually succeeds, not merely once time has passed. Before
      # that, all three tags being required means an object that never got
      # processed keeps its audio indefinitely regardless of age, instead of a
      # clock that has no idea the pipeline stalled deleting the one surviving
      # copy of what was said. TestEveryLifecycleRuleRequiresTheProcessedTag
      # pins this on the Go side.
      LifecycleConfiguration:
        Rules:
          - Id: ExpireCaptureAudio7
            Status: Enabled
            Prefix: 'tenants/'
            TagFilters:
              - Key: chintan-artifact
                Value: capture-audio
              - Key: chintan-retention
                Value: '7'
              - Key: chintan-processed
                Value: 'true'
            ExpirationInDays: 7
            NoncurrentVersionExpiration:
              NoncurrentDays: 7
          - Id: ExpireCaptureAudio30
            Status: Enabled
            Prefix: 'tenants/'
            TagFilters:
              - Key: chintan-artifact
                Value: capture-audio
              - Key: chintan-retention
                Value: '30'
              - Key: chintan-processed
                Value: 'true'
            ExpirationInDays: 30
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
          - Id: ExpireCaptureAudio90
            Status: Enabled
            Prefix: 'tenants/'
            TagFilters:
              - Key: chintan-artifact
                Value: capture-audio
              - Key: chintan-retention
                Value: '90'
              - Key: chintan-processed
                Value: 'true'
            ExpirationInDays: 90
            NoncurrentVersionExpiration:
              NoncurrentDays: 90
          - Id: ExpireCaptureAudio365
            Status: Enabled
            Prefix: 'tenants/'
            TagFilters:
              - Key: chintan-artifact
                Value: capture-audio
              - Key: chintan-retention
                Value: '365'
              - Key: chintan-processed
                Value: 'true'
            ExpirationInDays: 365
            NoncurrentVersionExpiration:
              NoncurrentDays: 365
          # An export (POST /v1/export) is a snapshot of the tenant's whole
          # corpus under tenants/<id>/exports/<job>/, fetched once through a
          # presigned URL that lives minutes. Nothing else deleted the
          # snapshot, so every export grew the bucket for good. The service
          # tags export.json and job.json chintan-artifact=export through the
          # tagging put, and this rule removes them a day later; an untagged
          # object, as everywhere in this bucket, is never expired.
          - Id: ExpireExportSnapshots
            Status: Enabled
            Prefix: 'tenants/'
            TagFilters:
              - Key: chintan-artifact
                Value: export
            ExpirationInDays: 1
            NoncurrentVersionExpiration:
              NoncurrentDays: 1
          # Versioning is on unconditionally, so every delete and every rewrite
          # of an artifact leaves a noncurrent version behind that is billed and
          # invisible to `aws s3 ls`. Those superseded versions are also the
          # only undo a note has: every append, save, move and merge rewrites
          # tenants/<t>/notes/<n>/note.md (and meta.json) in place. So the
          # unconditional rule keeps them 90 days, the window the owner chose.
          #
          # It is the untagged catch-all rather than a rule on a note tag
          # because S3 applies the SHORTEST matching expiry and a filter cannot
          # say "everything but notes": a 7-day default beside a 90-day note
          # rule would still delete note versions at 7 days. Inverting it makes
          # the safe case the default — note versions written before this rule
          # existed, and any writer added later, get 90 days without a tag.
          # What is worth expiring sooner is audio, which is nearly all of the
          # noncurrent bytes (about 4.5 MB of a week's 5.7 MB in 2026-09; the
          # text and JSON beside it are kilobytes), and the upload PUT already
          # signs chintan-artifact=capture-audio onto every recording.
          # ExpireCaptureAudioVersions keeps audio at the 7 days it had; the
          # tier rules above give 7 to 365, and the shortest wins, so a
          # superseded or deleted recording still goes after a week. Exports
          # keep their 1 day. The current object is untouched by either rule;
          # that is the tier rules' concern. ExpireDeleteMarkers below cannot
          # do this job — a delete marker only expires once nothing is behind
          # it.
          - Id: ExpireCaptureAudioVersions
            Status: Enabled
            Prefix: 'tenants/'
            TagFilters:
              - Key: chintan-artifact
                Value: capture-audio
            NoncurrentVersionExpiration:
              NoncurrentDays: 7
          - Id: ExpireNoncurrentVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 90
          - Id: AbortStaleMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          - Id: ExpireDeleteMarkers
            Status: Enabled
            ExpiredObjectDeleteMarker: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - '*'
            AllowedMethods:
              - GET
              - PUT
              - HEAD
            AllowedOrigins:
              - !Ref AllowedOrigin
            ExposedHeaders:
              - ETag
              - Content-Type
            MaxAge: 3600
      Tags:
        - Key: Project
          Value: chintan
        - Key: Instance
          Value: !Ref InstanceName
        - Key: Application
          Value: Chintan

  # Execution roles: one per function.
  #
  # One role for both would hand the API — the function every browser can
  # reach — the worker's grants: both provider keys through SSM, dynamodb:Scan
  # across every tenant, budgets:ViewBudget. cmd/api/main.go wires no Scan, SQS or Budgets
  # client; what it uses is item operations and Query on the table, objects
  # under the tenant prefixes, one asynchronous invoke of the worker's live
  # alias, and — since Web Push (docs/design/push.md) — one SSM read of the
  # VAPID *public* key, which is public. The worker gets the rest, including
  # the private key.
  #
  # Both names keep the `chintan-lambda-` prefix. The agent boundary and deny
  # policies (infrastructure/agent-policies) refuse ssm:GetParameter and
  # kms:Decrypt on /chintan/* to every principal that is not
  # `role/chintan-lambda-*`, and bootstrap.yaml lets the deploy role create a
  # role only under `chintan-*` and only with the boundary attached; a name
  # outside the prefix would deploy and then fail the worker's start-up on
  # the key read.
  ApiFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'chintan-lambda-api-${InstanceName}-${Environment}'
      # Bound by the same ceiling as the agent so privilege cannot escalate through Lambda.
      PermissionsBoundary: !Sub 'arn:aws:iam::${AWS::AccountId}:policy/chintan-agent-boundary'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  # BatchGetItem is its own IAM action. The notes list fetches
                  # search_text for a page with it, and the captures list asks
                  # about a page's notes with it (2026-09-05); without the
                  # grant both fail at runtime with AccessDeniedException while
                  # /v1/health stays 200.
                  - dynamodb:BatchGetItem
                  # No Scan: every API read is a keyed Query, and a Scan
                  # anywhere in the API would be a bug that reads across
                  # tenants. The one Scan belongs to the worker's expiry sweep.
                # The table, and every index ON that table.
                #
                # This enumerated the indexes one by one and listed only gsi1.
                # When gsi2 was added (2026-08, since removed) so the notes list
                # could order by updated_at, the table gained the index and this
                # list did not, so every GET /v1/notes failed with
                #
                #   AccessDeniedException: not authorized to perform:
                #   dynamodb:Query on resource: table/chintan-dev-prod/index/gsi2
                #
                # The deploy succeeded, /v1/health stayed 200, and the notes list
                # was broken for days before anybody looked.
                #
                # The wildcard is scoped to this table's own indexes and grants
                # nothing new: an index holds a projection of rows this role
                # already reads and writes in full, so being able to Query gsi2
                # is not more access than Query on the table — it is the same
                # data by another key. What it removes is a list that has to be
                # remembered, in a place where forgetting fails at runtime rather
                # than at deploy.
                Resource:
                  - !GetAtt DynamoDBTable.Arn
                  - !Sub '${DynamoDBTable.Arn}/index/*'
        - PolicyName: SSMAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # The one parameter the API reads: the VAPID public key GET
              # /v1/push/key hands the browser (docs/design/push.md). Not
              # the private key, which only the worker signs with. An
              # optional read: absent, the route answers 404 and the app's
              # Notifications card says notifications are not set up here.
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/chintan/${InstanceName}/vapid_public_key'
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  # A PUT that carries x-amz-tagging needs PutObjectTagging on
                  # the principal that SIGNED the presigned URL, not on the
                  # browser using it. Without it S3 answers 403 to an upload
                  # whose signature is perfectly valid, and the client sees only
                  # "Forbidden" with nothing naming the missing permission.
                  #
                  # The tags are not decorative: the lifecycle rules select on
                  # chintan-artifact=capture-audio, which is what makes them
                  # expire audio and nothing else, and on chintan-retention,
                  # which is what makes the tenant's own setting decide when.
                  # Adding the tag without this grant made every upload fail.
                  - s3:PutObjectTagging
                  - s3:GetObjectTagging
                # The bucket name is spelled out, not !GetAtt'd. ContentBucket's
                # notification invokes the worker alias, whose function runs
                # under WorkerFunctionRole; the two roles are written the same
                # way so they cannot drift apart, and a reference here would be
                # the last edge of a cycle CloudFormation refuses. MUST stay
                # byte-identical to ContentBucket's BucketName.
                Resource: !Sub 'arn:aws:s3:::chintan-content-${InstanceName}-${Environment}-${AWS::AccountId}/*'
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !Sub 'arn:aws:s3:::chintan-content-${InstanceName}-${Environment}-${AWS::AccountId}'
        - PolicyName: WorkerHandOff
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # The API hands work to the worker — a capture on POST
              # /v1/captures/{id}/retry and /target, a clean-note task, an ask
              # — by invoking the worker's live alias asynchronously. The alias
              # ARN is spelled out rather than !Ref'd: the alias depends on the
              # function, the function on its role, and the bucket notification
              # on the alias, and a reference here would close that cycle. MUST
              # stay in step with WorkerLambdaFunction's FunctionName and the
              # alias Name below.
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:chintan-worker-${InstanceName}-${Environment}:live'
      Tags:
        - Key: Project
          Value: chintan
        - Key: Instance
          Value: !Ref InstanceName
        - Key: Application
          Value: Chintan

  WorkerFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'chintan-lambda-worker-${InstanceName}-${Environment}'
      PermissionsBoundary: !Sub 'arn:aws:iam::${AWS::AccountId}:policy/chintan-agent-boundary'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:BatchGetItem
                  # Scan is for two callers: the weekly expiry sweep, which
                  # has to find every note past its purge deadline in every
                  # tenant, and the quarter-hourly reconcile of stuck
                  # captures, which has to find every pending row the same
                  # way; the worker knows no tenant list. Nothing in the API
                  # has it.
                  - dynamodb:Scan
                # The table and its indexes; see ApiFunctionRole for why the
                # indexes are a wildcard.
                Resource:
                  - !GetAtt DynamoDBTable.Arn
                  - !Sub '${DynamoDBTable.Arn}/index/*'
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  # The worker re-tags audio once it has been processed
                  # (MarkProcessed) so the retention lifecycle may expire it;
                  # see ApiFunctionRole for the tags themselves.
                  - s3:PutObjectTagging
                  - s3:GetObjectTagging
                # Spelled out for the same cycle as in ApiFunctionRole. MUST
                # stay byte-identical to ContentBucket's BucketName.
                Resource: !Sub 'arn:aws:s3:::chintan-content-${InstanceName}-${Environment}-${AWS::AccountId}/*'
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !Sub 'arn:aws:s3:::chintan-content-${InstanceName}-${Environment}-${AWS::AccountId}'
        - PolicyName: SSMAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/chintan/${InstanceName}/groq_api_key'
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/chintan/${InstanceName}/llm_api_key'
                  # The VAPID pair Web Push signs with (docs/design/push.md).
                  # Both are optional reads: absent, the worker starts and
                  # sends nothing. scripts/vapid-keys.sh --apply creates
                  # them, and scripts/setup.sh runs it when web_push is on.
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/chintan/${InstanceName}/vapid_private_key'
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/chintan/${InstanceName}/vapid_public_key'
              # No kms:Decrypt. ssm:GetParameter with WithDecryption on a
              # SecureString under the AWS-managed aws/ssm key is authorised by
              # the SSM grant alone; the AWS-managed key's policy lets SSM
              # decrypt on the caller's behalf, and a kms:Decrypt statement on
              # the key ALIAS ARN would grant nothing in any case, because KMS
              # authorises against key ARNs, not alias ARNs. The statement that
              # sat here was dead, and its comment claimed otherwise (review
              # 2026-09-03, infra M3).
        - PolicyName: CapturePipelineAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # The worker invokes its own live alias for the clean-note task
              # after an append to a note with auto_clean, so the clean runs as
              # its own invocation with its own retries. Spelled out for the
              # cycle ApiFunctionRole describes. MUST stay in step with
              # WorkerLambdaFunction's FunctionName and the alias Name below.
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:chintan-worker-${InstanceName}-${Environment}:live'
              # The dead-letter destination is written by LAMBDA using the
              # function's execution role (WorkerLambdaEventInvokeConfig).
              # Without this grant the retries are exhausted and the record is
              # dropped with the destination silently unwritten and the alarm
              # never given a datapoint.
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                  - sqs:GetQueueAttributes
                Resource:
                  - !GetAtt CaptureDLQ.Arn
      Tags:
        - Key: Project
          Value: chintan
        - Key: Instance
          Value: !Ref InstanceName
        - Key: Application
          Value: Chintan

  # Lambda Function
  ApiLambdaFunction:
    Type: AWS::Lambda::Function
    # Create the log group first, or Lambda auto-creates one on first invoke and
    # the stack's group then conflicts with it.
    DependsOn: ApiLogGroup
    Properties:
      FunctionName: !Sub 'chintan-api-${InstanceName}-${Environment}'
      Runtime: provided.al2023
      Handler: bootstrap
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref LambdaCodeKey
      Role: !GetAtt ApiFunctionRole.Arn
      Architectures:
        - arm64
      MemorySize: 512
      # HTTP API integrations are capped at 30 seconds and the cap is not
      # adjustable. Anything above that is unreachable: the client already has
      # its 504 and the account is still paying for the running invocation.
      Timeout: 29
      # A single page load fires this many requests near-simultaneously on its
      # own — usePendingCaptures alone polls four capture statuses in parallel,
      # plus /settings — so 5 leaves no headroom even for one person with one
      # tab open, and a page load trips a throttle. 50 is well above any realistic
      # single-tenant burst while still bounded, unlike the worker's five,
      # which really is sized for concurrent provider round-trips.
      ReservedConcurrentExecutions: 50
      # PassThrough: no X-Ray. Every invocation was being sampled and traced
      # (1,690 traces in August 2026 for one user) for nobody to read; the
      # traces were inside the free tier but cost ~70 bytes on every REPORT
      # line and an IAM statement. Flip one function to Active for an
      # afternoon when there is a latency question.
      TracingConfig:
        Mode: PassThrough
      Environment:
        Variables:
          TABLE_NAME: !Ref DynamoDBTable
          # Spelled out rather than !Ref'd, to keep the function off the
          # bucket → alias → function → role cycle; see ContentBucket.
          CONTENT_BUCKET: !Sub 'chintan-content-${InstanceName}-${Environment}-${AWS::AccountId}'
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          # No LLM_* or provider *_KEY_PATH: cmd/api calls no provider, so the
          # four the worker reads were set here and read by nothing (review
          # 2026-09-24, R4-38). The one SSM path it does read is the VAPID
          # public key below.
          VAPID_PUBLIC_KEY_PATH: !Sub '/chintan/${InstanceName}/vapid_public_key'
          # Both halves are required. The service verifies tokens itself rather
          # than trusting the gateway authorizer, and it builds the JWKS issuer
          # URL from the region and the pool id — so with the client id alone it
          # fails closed at init with "auth: issuer is required" and every
          # request 500s. Fail-closed is right; shipping only half the config was
          # not.
          USER_POOL_ID: !Ref UserPool
          USER_POOL_CLIENT_ID: !Ref UserPoolClient
          # The worker's live alias, which retry and target invoke
          # asynchronously. The alias, not the function, so a rollback that
          # moves the alias moves the API's retries with it.
          WORKER_FUNCTION_ARN: !Ref WorkerLambdaLiveAlias
          DAILY_SPEND_CAP_MICROS: !Ref DailySpendCapMicros
      Tags:
        - Key: Project
          Value: chintan
        - Key: Instance
          Value: !Ref InstanceName
        - Key: Application
          Value: Chintan

  # Worker Lambda — the slow half of the pipeline. Transcribe, route, clean,
  # append. Invoked asynchronously by S3 and by the API, so its ceiling is
  # Lambda's 900s rather than the gateway's 30. Also the weekly expiry sweep
  # (ExpirySweepRule), the daily AWS cost reading (AwsCostRule) and the daily
  # storage snapshot (StorageSnapshotRule), all dispatched on the payload's
  # task field.
  WorkerLambdaFunction:
    Type: AWS::Lambda::Function
    DependsOn: WorkerLogGroup
    Properties:
      FunctionName: !Sub 'chintan-worker-${InstanceName}-${Environment}'
      Runtime: provided.al2023
      Handler: bootstrap
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref WorkerCodeKey
      Role: !GetAtt WorkerFunctionRole.Arn
      Architectures:
        - arm64
      MemorySize: 2048
      Timeout: 900
      ReservedConcurrentExecutions: 5
      # PassThrough: no X-Ray. Every invocation was being sampled and traced
      # (1,690 traces in August 2026 for one user) for nobody to read; the
      # traces were inside the free tier but cost ~70 bytes on every REPORT
      # line and an IAM statement. Flip one function to Active for an
      # afternoon when there is a latency question.
      TracingConfig:
        Mode: PassThrough
      Environment:
        Variables:
          TABLE_NAME: !Ref DynamoDBTable
          # Spelled out rather than !Ref'd, to keep the function off the
          # bucket → alias → function → role cycle; see ContentBucket.
          CONTENT_BUCKET: !Sub 'chintan-content-${InstanceName}-${Environment}-${AWS::AccountId}'
          LLM_BASE_URL: https://api.minimax.io/v1
          LLM_MODEL: MiniMax-M3
          GROQ_API_KEY_PATH: !Sub '/chintan/${InstanceName}/groq_api_key'
          LLM_API_KEY_PATH: !Sub '/chintan/${InstanceName}/llm_api_key'
          # Web Push (docs/design/push.md): the VAPID pair the worker signs
          # notifications with, and the subject a push service may contact
          # about them — the app's own origin, an https URL as RFC 8292
          # wants. Both parameters are optional reads; until the owner puts
          # them in SSM the worker logs one line at start and sends nothing.
          VAPID_PRIVATE_KEY_PATH: !Sub '/chintan/${InstanceName}/vapid_private_key'
          VAPID_PUBLIC_KEY_PATH: !Sub '/chintan/${InstanceName}/vapid_public_key'
          VAPID_SUBJECT: !Ref AllowedOrigin
          # No USER_POOL_ID / USER_POOL_CLIENT_ID and no ALLOWED_ORIGIN: the
          # worker is invoked by S3, EventBridge and the API, never with a
          # user's token and never by a browser, and cmd/worker/main.go reads
          # none of them. They were copied from the API's environment and read
          # by nothing (reviews 2026-09-05 S34 and 2026-09-24 R4-38).
          DAILY_SPEND_CAP_MICROS: !Ref DailySpendCapMicros
          # Its own live alias, spelled out for the same reason the API's
          # invoke grant is (a !Ref would close the alias → function cycle).
          # After an append to a note with auto_clean the worker queues the
          # clean-note task for itself here, so the whole-note cleaned view
          # runs as its own invocation with its own retries. MUST stay in step
          # with FunctionName above and the alias Name below.
          WORKER_FUNCTION_ARN: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:chintan-worker-${InstanceName}-${Environment}:live'
          # The daily aws-cost task (AwsCostRule) reads this budget's
          # month-to-date actual spend with budgets:DescribeBudget and stores
          # it for GET /v1/usage. MonthlyBudget exists only with an alarm
          # address, so a stack without one passes '' and the task is a logged
          # no-op. !Ref on a budget is its name, so the generated name (see
          # MonthlyBudget on why it is generated) follows a replacement here
          # without anyone re-typing it. DescribeBudget addresses a budget by
          # account and name, hence the account id beside it.
          MONTHLY_BUDGET_NAME: !If [HasAlarmEmail, !Ref MonthlyBudget, '']
          AWS_ACCOUNT_ID: !Ref AWS::AccountId
      Tags:
        - Key: Project
          Value: chintan
        - Key: Instance
          Value: !Ref InstanceName
        - Key: Application
          Value: Chintan

  # ---------------------------------------------------------------------------
  # Versions and the `live` alias — the cutover point, and the reason rollback
  # means anything.
  #
  # CloudFormation stages new code on the function. Nothing serves it until the
  # `live` alias moves, which scripts/deploy.sh does once the change set has
  # succeeded. Rollback is then one `lambda update-alias` back to the previous
  # version, with no CloudFormation operation and no rebuild.
  #
  # These versions are published once, at stack create, purely so each alias has
  # a legal target: an alias may not point at $LATEST. They are deliberately NOT
  # tied to LambdaCodeKey. If CloudFormation republished and re-pointed the alias
  # on every deploy, the "previous version" deploy.sh captures for the rollback
  # command would already be the new code, and rollback would be a no-op that
  # looked like a success.
  #
  # The corollary: a bare `aws cloudformation deploy` updates the code without
  # putting it in front of traffic. That is the intended two-phase behaviour, not
  # an oversight — deploy.sh performs the second phase.
  # ---------------------------------------------------------------------------
  ApiLambdaInitialVersion:
    Type: AWS::Lambda::Version
    Properties:
      FunctionName: !Ref ApiLambdaFunction
      Description: Initial version, so the live alias has a target at stack create.

  ApiLambdaLiveAlias:
    Type: AWS::Lambda::Alias
    Properties:
      FunctionName: !Ref ApiLambdaFunction
      Name: live
      FunctionVersion: !GetAtt ApiLambdaInitialVersion.Version
      Description: Traffic pointer. Moved by scripts/deploy.sh, not by this template.

  WorkerLambdaInitialVersion:
    Type: AWS::Lambda::Version
    Properties:
      FunctionName: !Ref WorkerLambdaFunction
      Description: Initial version, so the live alias has a target at stack create.

  WorkerLambdaLiveAlias:
    Type: AWS::Lambda::Alias
    Properties:
      FunctionName: !Ref WorkerLambdaFunction
      Name: live
      FunctionVersion: !GetAtt WorkerLambdaInitialVersion.Version
      Description: Traffic pointer. Moved by scripts/deploy.sh, not by this template.

  # How the worker's asynchronous invocations are retried, and where one that
  # cannot be goes. This applies to every asynchronous invocation of the alias
  # alike — S3's notification and the API's retry and target.
  #
  # Two retries is Lambda's maximum and its default; it is written down so the
  # schedule the pipeline's tests replay (about one minute after the failure,
  # then about two minutes after that) is pinned here rather than assumed. Both
  # fall inside the append claim's twenty-minute lease, which is fine: an
  # attempt that died after writing the paragraph is finished by the first
  # retry on the strength of the marker it wrote, and the one attempt that has
  # to wait for the lease — died between claiming and writing — dead-letters
  # and is recovered by the user's retry after the alarm. Six hours of event
  # age is how long a burst of throttled captures may wait for the worker's
  # five reserved executions before being dead-lettered instead.
  #
  # On the alias, not the function: an EventInvokeConfig is per qualifier, and
  # everything that invokes the worker invokes the alias.
  WorkerLambdaEventInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    # The Qualifier is the alias NAME, not a reference, so nothing here orders
    # this against the alias existing; DependsOn does. Lambda also validates,
    # when the destination is written, that the execution role can SendMessage
    # to it, and nothing otherwise orders this against WorkerFunctionRole —
    # the dependency runs through the alias to the function to the role, so
    # CloudFormation is free to write the destination while the role's inline
    # policy is still propagating — so the role is named too rather than
    # reached transitively through the function.
    DependsOn:
      - WorkerLambdaLiveAlias
      - WorkerFunctionRole
    Properties:
      FunctionName: !Ref WorkerLambdaFunction
      Qualifier: live
      MaximumRetryAttempts: 2
      MaximumEventAgeInSeconds: 21600
      DestinationConfig:
        OnFailure:
          # The failure record carries the original payload — the S3 event or
          # the API's {tenant_id, capture_id} — and the error, so the capture
          # can be named from the message. Written by Lambda under
          # WorkerFunctionRole, which is why that role has sqs:SendMessage on
          # the queue.
          Destination: !GetAtt CaptureDLQ.Arn

  # The weekly expiry sweep. Archiving a note stamps it with a purge deadline
  # thirty days out; once that has passed the note's objects — its body, its
  # metadata, and every capture filed against it with its audio and transcripts
  # — have to leave the bucket, and DynamoDB TTL deletes rows, not objects.
  # This rule invokes the worker once a week with a constant payload naming the
  # task (internal/purge.Task), and the worker scans for notes past their
  # deadline, runs the same cascade a user's "delete forever" runs, and deletes
  # the row. TTL, set a fortnight after the deadline by the store, is only the
  # backstop for a sweep that did not run.
  #
  # A scheduled task in the existing worker, not a third Lambda function on
  # the table's stream: a stream consumer brings its own event-source mapping,
  # dead-letter queue, log group, alias, alarms and stream permissions for
  # what is one scan and one cascade a week. A week is the cadence because the
  # objects are already invisible: the archived list filters on the same
  # deadline, so nothing the user can reach changes between the deadline and
  # the sweep, only the bucket's bill.
  #
  # The target is the live alias, like every other way into the worker, so a
  # rollback that moves the alias moves the sweep too. The invocation is
  # asynchronous (EventBridge's default for Lambda), so a sweep that returns an
  # error is retried by Lambda twice and then dead-lettered to CaptureDLQ with
  # the others — the depth alarm's description covers both.
  ExpirySweepRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub 'chintan-${InstanceName}-${Environment}-expiry-sweep'
      Description: Weekly sweep of archived notes past their purge deadline; invokes the worker with {"task":"sweep-expired"}.
      ScheduleExpression: rate(7 days)
      State: ENABLED
      Targets:
        - Id: worker
          Arn: !Ref WorkerLambdaLiveAlias
          Input: '{"task":"sweep-expired"}'

  # EventBridge may invoke the worker. On the alias, for the same reason as
  # ContentBucketInvokesWorkerPermission: the rule names the alias, and a
  # qualified invocation is authorised against the qualified resource. Scoped
  # to this one rule's ARN so no other rule in the account can invoke it.
  ExpirySweepRuleInvokesWorkerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref WorkerLambdaLiveAlias
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ExpirySweepRule.Arn

  # Once a day the worker reads the stack budget's month-to-date actual spend
  # (budgets:DescribeBudget — free; nothing here calls Cost Explorer, which is
  # $0.01 a request) and stores it as INSTANCE / AWSCOST#<yyyy-mm>, the number
  # behind the "AWS this month" line on GET /v1/usage. Daily is the right
  # cadence: Budgets refreshes the figure up to three times a day, and the
  # line carries an as-of date. Same target and retry story as the sweep
  # above. The rule is not conditional on HasAlarmEmail: without a budget the
  # task logs that it has nothing to read and returns, which is one free
  # invocation a day and one fewer conditional to keep in step.
  AwsCostRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub 'chintan-${InstanceName}-${Environment}-aws-cost'
      Description: Daily reading of the stack budget's month-to-date AWS spend; invokes the worker with {"task":"aws-cost"}.
      ScheduleExpression: rate(1 day)
      State: ENABLED
      Targets:
        - Id: worker
          Arn: !Ref WorkerLambdaLiveAlias
          Input: '{"task":"aws-cost"}'

  AwsCostRuleInvokesWorkerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref WorkerLambdaLiveAlias
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt AwsCostRule.Arn

  # Once a day the worker measures what each tenant is storing — the same
  # walk of the capture and note rows GET /v1/usage makes for `storage` — and
  # adds the reading onto the tenant's USAGE#<yyyy-mm> row as byte-days and
  # note-days (internal/storagesnap). The on-demand figure is the footprint
  # now; this is the footprint over the month, which is what S3 bills by, and
  # it survives a tenant deleting everything on the 30th. Daily because that
  # is the resolution S3's own byte-hour billing rounds to for a figure shown
  # in GB-days, and the write is conditioned on the day so a retry or a
  # second firing adds nothing. Same target, same retry story, same IAM as the
  # rule above: the table Query and UpdateItem the role already has.
  StorageSnapshotRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub 'chintan-${InstanceName}-${Environment}-storage-snapshot'
      Description: Daily reading of each tenant's stored audio and notes onto their usage rows; invokes the worker with {"task":"storage-snapshot"}.
      # A fixed hour rather than rate(1 day): a rate schedule fires at the
      # minute the rule was created, so a stack created near midnight UTC
      # would take its reading on either side of the day boundary from one
      # run to the next and attribute a day's storage to its neighbour (review
      # 2026-09-05, S26). 03:00 UTC is far from the boundary and from the
      # aws-cost reading.
      ScheduleExpression: cron(0 3 * * ? *)
      State: ENABLED
      Targets:
        - Id: worker
          Arn: !Ref WorkerLambdaLiveAlias
          Input: '{"task":"storage-snapshot"}'

  StorageSnapshotRuleInvokesWorkerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref WorkerLambdaLiveAlias
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt StorageSnapshotRule.Arn

  # Every fifteen minutes the worker looks for captures left in a pipeline
  # stage (internal/reconcile): a pending row with no write for longer than
  # the worker's own timeout has no live worker, and the only things that
  # otherwise come back for it are Lambda's retries of a FAILED invocation
  # and the person's Retry. An invocation that returned nil with the capture
  # still pending gets neither, so the row sat in `appending` for hours with
  # no alarm. The task runs the pipeline once more for each such capture
  # (a resume is idempotent) and marks failed, with a fixed sentence, any it
  # cannot finish; CaptureReapedAlarm reads the second count. Fifteen
  # minutes is the stuck rule's own period (service.CaptureStuckAfter), so
  # a capture is reaped within half an hour of stalling. The task reads the
  # table with a filtered Scan, which is why the worker role has Scan.
  ReconcileStuckRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub 'chintan-${InstanceName}-${Environment}-reconcile-stuck'
      Description: Quarter-hourly resume-or-fail of captures left in a pipeline stage; invokes the worker with {"task":"reconcile-stuck"}.
      ScheduleExpression: rate(15 minutes)
      State: ENABLED
      Targets:
        - Id: worker
          Arn: !Ref WorkerLambdaLiveAlias
          Input: '{"task":"reconcile-stuck"}'

  ReconcileStuckRuleInvokesWorkerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref WorkerLambdaLiveAlias
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ReconcileStuckRule.Arn

  # CloudWatch Log Group
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/chintan-api-${InstanceName}-${Environment}'
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Project
          Value: chintan
        - Key: Instance
          Value: !Ref InstanceName
        - Key: Application
          Value: Chintan

  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/chintan-worker-${InstanceName}-${Environment}'
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Project
          Value: chintan
        - Key: Instance
          Value: !Ref InstanceName
        - Key: Application
          Value: Chintan

  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/apigateway/chintan-${InstanceName}-${Environment}'
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Project
          Value: chintan
        - Key: Instance
          Value: !Ref InstanceName
        - Key: Application
          Value: Chintan

  # HTTP API Gateway
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub 'chintan-api-${InstanceName}-${Environment}'
      Description: !Sub 'Chintan HTTP API for ${InstanceName}'
      ProtocolType: HTTP
      CorsConfiguration:
        AllowCredentials: true
        # This block is what a browser is told, but not because the gateway
        # answers preflights on its own. HTTP API auto-answers an OPTIONS
        # request only when NO route matches it, and `$default` below matches
        # everything and carries the JWT authorizer, so a preflight that
        # reached it would be answered 401 (removing the OPTIONS route proves it
        # on staging: every preflight fails).
        # What actually happens: `OptionsRoute` sends `OPTIONS /{proxy+}` to the
        # Lambda with no authorizer, backend/internal/middleware/cors.go answers
        # 204, and on the way out the gateway OVERWRITES the CORS headers of
        # that response from this list — the live 204 carries these seven
        # header names lower-cased, plus the Lambda's own x-correlation-id.
        #
        # Consequences. This list is what the browser sees, so it must name
        # every header the client sends — the client sends Idempotency-Key on
        # every POST and X-Correlation-Id on every request, and a name missing
        # here has the browser refuse the request before it is sent, reporting
        # only "Response to preflight request doesn't pass access control
        # check" with no clue which header. The middleware's own list matters
        # only for a run without the gateway. Every preflight is one Lambda
        # invocation (about one in seven API invocations in the 2026-09-05 prod
        # log); the only way to have the gateway answer them itself is to
        # enumerate every route so that nothing matches OPTIONS. The
        # middleware's list is held to this one by the handler package's
        # TestMiddlewareCORSHeadersAreInTheGatewaysList.
        AllowHeaders:
          - Authorization
          - Content-Type
          - Idempotency-Key
          - X-Correlation-Id
          - X-Amz-Date
          - X-Api-Key
          - X-Amz-Security-Token
        # Correlation ids are only useful to a caller that can read them back;
        # a cross-origin response hides every header not named here.
        ExposeHeaders:
          - X-Correlation-Id
        AllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        AllowOrigins:
          - !Ref AllowedOrigin
        MaxAge: 86400
      Tags:
        Project: chintan
        Instance: !Ref InstanceName
        Application: Chintan

  # JWT Authorizer for Cognito
  JwtAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      Name: !Sub 'chintan-jwt-${InstanceName}-${Environment}'
      ApiId: !Ref HttpApi
      AuthorizerType: JWT
      IdentitySource:
        - '$request.header.Authorization'
      JwtConfiguration:
        Audience:
          - !Ref UserPoolClient
        Issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'

  # Lambda Integration
  LambdaIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      # The alias ARN, not the function ARN. Pointed at the bare function, the
      # alias would be a record of what was deployed rather than a pointer to
      # what is serving, and moving it back would roll nothing back.
      IntegrationUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ApiLambdaLiveAlias}/invocations'
      PayloadFormatVersion: '2.0'

  # Liveness. Declared NONE explicitly: it is the gateway default for a route
  # that omits the property, but the two health routes, the three inbox
  # routes (which the Lambda authenticates itself, by device key) and CORS
  # preflight are the entire surface without the JWT authorizer, and that is
  # worth stating rather than inheriting. Sign-in itself happens on the
  # Cognito managed-login page, not on this API.
  HealthRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'GET /v1/health'
      AuthorizationType: NONE
      Target: !Sub 'integrations/${LambdaIntegration}'

  # Readiness. docs/api/openapi.yaml declares this operation `security: []` and
  # handler/routes.go registers it public(); without this route it fell through
  # $default to the JWT authorizer and answered the gateway's own
  # 401 {"message":"Unauthorized"} — never reaching Lambda, so an uptime probe
  # written from the document alarmed permanently. The response carries
  # dependency names and latencies only; the probe error text is logged, never
  # serialised (service/readiness.go), so there is nothing here to authenticate.
  # openapi_conformance_test.go asserts this set matches the document.
  HealthReadyRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'GET /v1/health/ready'
      AuthorizationType: NONE
      Target: !Sub 'integrations/${LambdaIntegration}'

  # The inbox: an external recorder, watch or app posts audio or text here
  # with a device key (Authorization: Bearer ck_…), not a Cognito token, so
  # the JWT authorizer must not stand in front of these three. The Lambda
  # validates the key (handler/inbox.go) — hashed at rest, revocable, two
  # hundred requests a day — and no note content is ever returned on them.
  # docs/design/inbox.md has the threat model; openapi_conformance_test.go
  # asserts these three are exactly the operations the document puts under
  # the deviceKey scheme.
  InboxCapturesRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'POST /v1/inbox/captures'
      AuthorizationType: NONE
      Target: !Sub 'integrations/${LambdaIntegration}'

  InboxAudioRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'POST /v1/inbox/audio'
      AuthorizationType: NONE
      Target: !Sub 'integrations/${LambdaIntegration}'

  InboxTextRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'POST /v1/inbox/text'
      AuthorizationType: NONE
      Target: !Sub 'integrations/${LambdaIntegration}'

  # See CorsConfiguration on HttpApi: without this route a preflight falls
  # through to `$default`, whose JWT authorizer answers it 401 (staging, #51).
  # The Lambda's middleware answers the OPTIONS 204 and the gateway rewrites
  # the CORS headers from CorsConfiguration on the way out.
  OptionsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'OPTIONS /{proxy+}'
      AuthorizationType: NONE
      Target: !Sub 'integrations/${LambdaIntegration}'

  # Route for protected endpoints (with auth)
  ProtectedRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: '$default'
      Target: !Sub 'integrations/${LambdaIntegration}'
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  # Default Stage
  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    # RouteSettings below names the inbox routes, which the stage cannot be
    # created or updated ahead of.
    DependsOn: [InboxCapturesRoute, InboxAudioRoute, InboxTextRoute]
    Properties:
      StageName: $default
      ApiId: !Ref HttpApi
      AutoDeploy: true
      # Route key and status only. No query string, no body, no header beyond
      # the correlation id — nothing here may carry transcript content.
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: >-
          {"requestId":"$context.requestId","correlationId":"$context.requestId","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","routeKey":"$context.routeKey","status":"$context.status","protocol":"$context.protocol","responseLength":"$context.responseLength","responseLatency":"$context.responseLatency","integrationStatus":"$context.integrationStatus","integrationErrorMessage":"$context.integrationErrorMessage","authorizerError":"$context.authorizer.error"}
      DefaultRouteSettings:
        # Off, because it is billed as custom metrics and buys almost nothing
        # here. Detailed metrics add the (ApiId, Method, Resource, Stage)
        # dimension set; the gateway only knows five routes, and every one of
        # the application's other twenty-five arrives as $default because the
        # routing happens inside the Lambda. The per-route breakdown being paid
        # for is therefore mostly one bucket labelled $default, while the EMF
        # ApiRequests/ApiLatency metrics already carry the real registered-route
        # breakdown.
        #
        DetailedMetricsEnabled: false
        ThrottlingBurstLimit: 100
        ThrottlingRateLimit: 50
      # The three routes anyone on the internet can POST a body to. The
      # Lambda refuses a bad key before it does anything else, but the
      # invocation and the body transfer are paid before it runs — a 4 MiB
      # bad-key POST bills 170–300 ms of runtime decoding the base64 event
      # before the handler sees it. One request a second is still some forty
      # times what ten devices at two hundred requests a day can need, and it
      # caps a saturated route at about a fifth of what 5 rps cost. The
      # ceiling is per route and shared by every caller, so a flood pauses the
      # inbox for the owner's own devices meanwhile; the app uses other routes.
      # ApiClientErrorsAlarm below is what says a flood is under way.
      RouteSettings:
        'POST /v1/inbox/captures': { ThrottlingRateLimit: 1, ThrottlingBurstLimit: 10 }
        'POST /v1/inbox/audio': { ThrottlingRateLimit: 1, ThrottlingBurstLimit: 10 }
        'POST /v1/inbox/text': { ThrottlingRateLimit: 1, ThrottlingBurstLimit: 10 }
      Tags:
        Project: chintan
        Instance: !Ref InstanceName
        Application: Chintan

  # Lambda Permission for API Gateway
  # Granted on the alias, because a qualified invocation is authorised against
  # the qualified resource. A permission on the bare function would not be
  # consulted at all, and the gateway would get 403 on every request.
  LambdaApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiLambdaLiveAlias
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*'

  # ---------------------------------------------------------------------------
  # The custom API domain: api.example.com in front of the HTTP API.
  #
  # Four resources, every one conditional on ApiHost, so a stack with no
  # `api_host` in its config is byte-for-byte the stack it was before these
  # existed. Nothing above changes for them: the API id, the routes, the
  # authorizer and LambdaApiPermission's SourceArn are all keyed on HttpApi,
  # and a request that arrives through the domain is the same API invocation.
  # The origin the browser and every device use is the ApiEndpoint output,
  # which flips to https://<ApiHost> below.
  #
  # The certificate is regional and free. An HTTP API's custom domain is a
  # REGIONAL endpoint, so the certificate has to be in this stack's region —
  # unlike a Cognito custom domain, whose CloudFront-fronted certificate has to
  # be in us-east-1 and cannot come from this template; that is why the
  # sign-in page keeps its amazoncognito.com address (README, Custom domain).
  #
  # Validation is by DNS, in one of two ways. With DnsZoneId, CloudFormation
  # writes the validation CNAME into the zone as the deploy role and the
  # certificate issues in a few minutes. Without it, ApiCertificate sits in
  # CREATE_IN_PROGRESS with the record to create in its stack events
  # ("Content of DNS Record is: ...") until the owner adds it; ACM issues the
  # same validation record for the same name in the same account every time,
  # so a stack rebuilt later validates against the record already there.
  # ---------------------------------------------------------------------------
  ApiCertificate:
    Type: AWS::CertificateManager::Certificate
    Condition: HasApiHost
    Properties:
      DomainName: !Ref ApiHost
      ValidationMethod: DNS
      DomainValidationOptions: !If
        - HasDnsZone
        - - DomainName: !Ref ApiHost
            HostedZoneId: !Ref DnsZoneId
        - !Ref AWS::NoValue
      # The Project tag is what CfnDeployRole's acm:DeleteCertificate grant is
      # conditioned on (infrastructure/bootstrap.yaml); born tagged, like the
      # KMS key was.
      Tags:
        - Key: Project
          Value: chintan
        - Key: Instance
          Value: !Ref InstanceName
        - Key: Application
          Value: Chintan

  ApiDomainName:
    Type: AWS::ApiGatewayV2::DomainName
    Condition: HasApiHost
    Properties:
      DomainName: !Ref ApiHost
      DomainNameConfigurations:
        - CertificateArn: !Ref ApiCertificate
          EndpointType: REGIONAL
          SecurityPolicy: TLS_1_2
      Tags:
        Project: chintan
        Instance: !Ref InstanceName
        Application: Chintan

  # Every path on the domain maps to this API's $default stage, so
  # https://api.example.com/v1/health is the same request as the execute-api
  # URL's. The stage name is a string, not a reference, hence DependsOn.
  ApiMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Condition: HasApiHost
    DependsOn: ApiStage
    Properties:
      ApiId: !Ref HttpApi
      DomainName: !Ref ApiDomainName
      Stage: '$default'

  # Only with a zone to write into. Without one, ApiDomainTarget in Outputs is
  # the value to CNAME the host to at the DNS provider.
  ApiAliasRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasDnsZone
    Properties:
      HostedZoneId: !Ref DnsZoneId
      Name: !Ref ApiHost
      Type: A
      AliasTarget:
        DNSName: !GetAtt ApiDomainName.RegionalDomainName
        HostedZoneId: !GetAtt ApiDomainName.RegionalHostedZoneId
        EvaluateTargetHealth: false

  # ---------------------------------------------------------------------------
  # Alerting. An unattended pipeline that fails silently is worse than no
  # pipeline: the user believes the recording was filed.
  # ---------------------------------------------------------------------------
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub 'chintan-alarms-${InstanceName}-${Environment}'
      DisplayName: !Sub 'Chintan ${InstanceName} alarms'
      Tags:
        - Key: Project
          Value: chintan
        - Key: Instance
          Value: !Ref InstanceName
        - Key: Application
          Value: Chintan

  # No AlarmEmail means no subscription, so a third-party clone deploys without
  # editing anything. The alarms still fire and are still visible in the console.
  AlarmTopicSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  # Budgets publishes as a service principal, which the default topic policy
  # does not cover.
  AlarmTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref AlarmTopic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # A TopicPolicy replaces the default policy outright, so the owner
          # statement has to be restated or the account loses its own topic.
          - Sid: AllowOwningAccountFullControl
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action:
              - sns:GetTopicAttributes
              - sns:SetTopicAttributes
              - sns:AddPermission
              - sns:RemovePermission
              - sns:DeleteTopic
              - sns:Subscribe
              - sns:ListSubscriptionsByTopic
              - sns:Publish
            Resource: !Ref AlarmTopic
          - Sid: AllowCloudWatchAlarmsToPublish
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action: sns:Publish
            Resource: !Ref AlarmTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
          - Sid: AllowBudgetsToPublish
            Effect: Allow
            Principal:
              Service: budgets.amazonaws.com
            Action: sns:Publish
            Resource: !Ref AlarmTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  ApiFunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: AlarmsEnabled
    Properties:
      AlarmName: !Sub 'chintan-${InstanceName}-${Environment}-api-errors'
      AlarmDescription: API Lambda returned an unhandled error.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiLambdaFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      # Five in five minutes, not one. The Errors metric counts the function
      # faulting — a panic, a timeout, an init failure — never an application
      # 5xx, and a one-error threshold fires on development noise. One fault from a provider blip is the retry's
      # problem; five in a window is an outage.
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  # The three inbox routes take a POST from anyone on the internet before any
  # key is checked, and the gateway bills every refused one (ApiStage's
  # RouteSettings bound the rate). Nothing else says a flood is happening:
  # the Lambda log skips 401s, ApiRequests carries only a status class, and
  # the first signal would be the budget's forecast e-mail about a day in.
  # This is a Sum, not a rate, and the threshold follows from the throttles
  # above: each inbox route admits 1 rps with a burst of 10, so a flood held
  # at one route's ceiling for the whole five-minute window reaches the
  # handler 300 + 10 = 310 times, and all three routes together at most 930.
  # Those are admitted requests: the gateway's own 429s also land in this
  # metric, so a flood above the throttle crosses 300 sooner. A thousand would
  # be out of reach of the admitted requests alone; 300 is the count a single saturated route
  # produces in one window, and still some twelve times anything the app
  # produces, so the alarm says one thing only — a public route is being
  # hammered — and stays quiet through a stale token or a mistyped key.
  # ApiId alone is the dimension the gateway publishes without detailed
  # metrics.
  ApiClientErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: AlarmsEnabled
    Properties:
      AlarmName: !Sub 'chintan-${InstanceName}-${Environment}-api-4xx'
      AlarmDescription: >-
        The gateway answered three hundred or more 4xx in five minutes: one
        inbox route held at its 1 rps throttle for the whole window (310
        admitted requests; the gateway's own 429s count here too, so a flood
        above the throttle gets here sooner). The open inbox routes are being
        flooded with bad keys, or a client is stuck in a retry loop; each
        refused request is billed before the key is checked.
      Namespace: AWS/ApiGateway
      MetricName: 4xx
      Dimensions:
        - Name: ApiId
          Value: !Ref HttpApi
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 300
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  # The gateway's own 5xx count. ApiFunctionErrorsAlarm above sees only the
  # function faulting; a handler that returns a 500 on purpose (a DynamoDB or
  # S3 call failing, a bug caught by the error mapper) is a clean invocation
  # to Lambda, and so was silent until this alarm. A Sum rather than a rate,
  # for the reason the note below the inbox alarm gives: five in five minutes
  # is well past one request retried, and at single-user volume it is the app
  # failing for somebody, not noise.
  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: AlarmsEnabled
    Properties:
      AlarmName: !Sub 'chintan-${InstanceName}-${Environment}-api-5xx'
      AlarmDescription: >-
        The gateway answered five or more 5xx in five minutes. Requests are
        failing server-side; the API log says which route and why.
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref HttpApi
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  # The gap between the 4xx flood alarm and silence. deviceAuthenticated
  # counts every inbox request it refuses as Chintan/InboxKeyRefused — a
  # counter, no key material — through the same rollup ProviderKeyRejected
  # uses, so this reads the dimensionless identity and is a plain metric
  # alarm: one of the thirteen per stack, $0.10 an alarm-month once the
  # account is past its free ten. Twenty-five in fifteen minutes is far above one
  # wrong header and far below the flood: it is the shape of a device that
  # keeps posting with a key its owner revoked, or of somebody walking key
  # ids. Before the first refusal the metric does not exist, which
  # notBreaching reads as healthy.
  InboxKeyRefusedAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: AlarmsEnabled
    Properties:
      AlarmName: !Sub 'chintan-${InstanceName}-${Environment}-inbox-key-refused'
      AlarmDescription: >-
        Twenty-five or more inbox requests refused in fifteen minutes: a device
        is still posting with a revoked or mistyped key, or someone is probing
        a key id — far below the gateway flood alarm, far above one wrong
        header.
      Namespace: Chintan
      MetricName: InboxKeyRefused
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 24
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  # There are deliberately no Throttles alarms, no worker Errors alarm and no
  # API 5xx-RATE alarm. Each would be an alarm-month billed to say nothing
  # useful: a throttles alarm watches a reserved-concurrency ceiling one
  # browser tab cannot reach; a worker Errors alarm fires just before the DLQ
  # alarm says the same thing; and a 5xx-rate alarm, an average over a quiet
  # five minutes, trips on a single 500 in ten requests. The 4xx and 5xx
  # alarms above are counts with thresholds one stray request does not reach,
  # which is why they earn their alarm-months and a rate does not. Thirteen
  # alarms exist (docs/ops/alarms.md), and none notifies on OK: an OK
  # transition is not something anyone needs an e-mail about. InboxKeyRefusedAlarm above earns its slot as
  # the only signal between one mistyped header and the three-hundred-in-
  # five-minutes flood: a device left posting with a revoked key is invisible to
  # every other alarm here and costs a billed request per attempt.
  #
  # A single message here is one recording the user believes was filed and was
  # not — an asynchronous invocation of the worker failed all three attempts
  # and Lambda wrote its OnFailure record here — or a weekly expiry sweep that
  # could not finish (the same alias, the same destination; the record names
  # which).
  CaptureDLQDepthAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: AlarmsEnabled
    Properties:
      AlarmName: !Sub 'chintan-${InstanceName}-${Environment}-capture-dlq'
      AlarmDescription: A worker invocation exhausted its retries and its failure record is in the dead-letter queue — a capture (retry it from the app) or a scheduled or queued worker task (sweep-expired, aws-cost, storage-snapshot, clean-note, ask; the record names it).
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt CaptureDLQ.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  # ---------------------------------------------------------------------------
  # Provider credentials. A rejected key does not resolve itself and every
  # capture fails the same way until it is replaced, so it is worth an e-mail
  # on the first occurrence. Provider throttling (429) has no alarm: ordinary
  # throttling clears on its own, and an alarm on it would e-mail about nothing.
  #
  # This reads a DIMENSIONLESS metric. obs.EmitWithRollup publishes the counter
  # under two identities — {Provider} for the answer, and no dimensions for the
  # alarm — precisely so this can be a plain metric alarm rather than a Metrics
  # Insights query alarm, a form that is billed per metric analysed with no
  # free tier. SpendCapRejectionsAlarm below does the same.
  #
  # Neither the pipeline nor the handler notifies anybody directly. The email is
  # the alarm's own OK -> ALARM transition, which is what makes a revoked key
  # one message rather than one per capture: the second, third and hundredth
  # failure keep the alarm in ALARM and send nothing.
  # ---------------------------------------------------------------------------
  ProviderKeyRejectedAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: AlarmsEnabled
    Properties:
      AlarmName: !Sub 'chintan-${InstanceName}-${Environment}-provider-key-rejected'
      AlarmDescription: >-
        A provider answered 401 or 403. The API key is revoked, expired or
        wrong, and every capture will fail the same way until it is replaced.
      Namespace: Chintan
      MetricName: ProviderKeyRejected
      Statistic: Sum
      Period: 300
      # One occurrence, immediately. This does not resolve itself, so waiting
      # for a second datapoint only delays the one action that fixes it.
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      # The metric does not exist until the first rejection, which is the
      # healthy state.
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  # A provider that is down, not rejecting the key: Groq or MiniMax answering
  # 5xx, resetting the connection or returning something that will not decode.
  # The pipeline ends each such capture as `failed` with a Retry button and
  # returns nil to Lambda — a verdict, not a fault — so there is no retry, no
  # dead-letter record and, until this alarm, no e-mail: an hour-long provider
  # outage was visible only to the person pressing Retry. CaptureStageFailures
  # is emitted through obs.CountWithRollup at every site (the obs rollup test
  # pins that), so this reads the dimensionless sum across stages; the
  # {Stage} copy says where once it has fired. Three in fifteen minutes, not
  # one: a single provider blip is the Retry button's problem, and three
  # captures failing inside one window at this instance's volume is every
  # capture failing. A stalled provider takes the other path — the stage's
  # deadline returns an error, Lambda retries, and the third attempt lands in
  # the DLQ under its own alarm — but each attempt also passes through this
  # counter, so a stall and an outage both reach the same address.
  CaptureFailuresAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: AlarmsEnabled
    Properties:
      AlarmName: !Sub 'chintan-${InstanceName}-${Environment}-capture-failures'
      AlarmDescription: >-
        A capture failed in a pipeline stage. The transcription or cleanup
        provider failed or stalled, or an append could not take its claim;
        the worker log names the stage and the cause, and the app's Retry
        re-runs the capture. One is worth the e-mail: a provider fault ends
        the capture with a Retry button and no Lambda retry, so nothing else
        says it happened, and the counter has not fired at all in a month of
        several hundred captures.
      Namespace: Chintan
      MetricName: CaptureStageFailures
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      # The metric does not exist until the first failure, which is the
      # healthy state.
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  # A run of the pipeline that returned nil — "done" to Lambda — with the
  # capture still in a stage. Nothing retries it, nothing dead-letters it,
  # and the row sits where it stopped; the worker fails the invocation
  # (pipeline.runCapture) and counts it here. The count is the direct fact:
  # a CapturePipelineDuration{Outcome=<stage>} sample says the same thing
  # from the side, but an alarm over four Outcome values needs four metric
  # queries and a metric-math sum, where this is one plain alarm. One is a
  # bug, not noise; the reconcile task is the backstop that finishes the
  # capture either way.
  CaptureOrphanedAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: AlarmsEnabled
    Properties:
      AlarmName: !Sub 'chintan-${InstanceName}-${Environment}-capture-orphaned'
      AlarmDescription: >-
        A worker run returned without finishing, failing or conceding a
        capture, leaving it in a pipeline stage. The invocation was failed so
        Lambda retries it; the worker log names the capture and the stage,
        and the reconcile task resumes or fails it within half an hour.
      Namespace: Chintan
      MetricName: CaptureOrphaned
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  # The reconcile task ran a stuck capture once more and it still did not
  # finish, so the task marked it failed with its fixed sentence. The person
  # sees Retry; this says it happened and the worker log says why. Read on
  # the Outcome=failed identity alone: a capture the second run finished is
  # the task doing its job and is listed in metrics.md, not alarmed.
  CaptureReapedAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: AlarmsEnabled
    Properties:
      AlarmName: !Sub 'chintan-${InstanceName}-${Environment}-capture-reaped'
      AlarmDescription: >-
        The reconcile task found a capture stuck in a pipeline stage, ran it
        again and it still did not finish, so it is now failed with "Filing
        did not finish. Retry to try again." The worker log names the capture
        and the stage; Retry in the app runs it once more.
      Namespace: Chintan
      MetricName: CaptureReaped
      Dimensions:
        - Name: Outcome
          Value: failed
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  # The five failure counters that page beside CaptureFailuresAlarm (the sixth
  # is that alarm): each counts a failure that nothing else surfaces, so
  # without its alarm the fault is invisible until the person notices. All
  # six emit with a rollup (obs.CountWithRollup; obs.EmitWithRollup for the
  # purge's count), which the obs rollup test holds them to, and each threshold is set where one
  # occurrence is the retry's business and the number here is the fault
  # continuing.

  # A 404 or 410 from the push service prunes the subscription and is not a
  # failure; this counts, once per subscription per send, the service
  # answering 5xx or the network failing. One is a blip the next notification
  # sends past; three in fifteen minutes at this instance's one or two
  # subscriptions is every notification failing, and the person stops hearing
  # that their recordings filed.
  PushSendFailuresAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: AlarmsEnabled
    Properties:
      AlarmName: !Sub 'chintan-${InstanceName}-${Environment}-push-send-failures'
      AlarmDescription: >-
        Three or more push notifications failed to send in fifteen minutes.
        The push service is failing or unreachable; the worker log carries the
        status and the reason.
      Namespace: Chintan
      MetricName: PushSendFailures
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 2
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  # A note the person archived was promised gone in thirty days; a failed
  # purge is its audio and text still there. The sweep returns an error, so
  # the invocation retries and the third attempt reaches the dead-letter
  # queue, but that alarm says only that a sweep failed; this one fires on
  # the first attempt and its datapoint is how many notes are still waiting.
  # The sweep runs weekly and emits zero when all is well, hence the hour.
  ExpiredNotesFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: AlarmsEnabled
    Properties:
      AlarmName: !Sub 'chintan-${InstanceName}-${Environment}-expired-notes-failed'
      AlarmDescription: >-
        The weekly expiry sweep could not purge at least one archived note past
        its deadline. The worker log names the note ids; the sweep retries on
        its next run.
      Namespace: Chintan
      MetricName: ExpiredNotesFailed
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  # An unparseable message is a request the API wrote in a shape this worker
  # build cannot read — a deploy skew between the two functions, or an event
  # sent by hand — and it is dropped without a retry, so the recording or the
  # clean it asked for never happens and nothing else says so. One is a bug,
  # not noise.
  WorkerMessagesDiscardedAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: AlarmsEnabled
    Properties:
      AlarmName: !Sub 'chintan-${InstanceName}-${Environment}-worker-messages-discarded'
      AlarmDescription: >-
        The worker dropped a message it could not parse. The API and the worker
        disagree on a message shape, usually a half-finished deploy; the worker
        log carries the reason, and the request has to be made again.
      Namespace: Chintan
      MetricName: WorkerMessagesDiscarded
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  # The API could not record a clean request or could not invoke the worker
  # for it, so the note keeps a stale cleaned view and its "cleaning" promise.
  # One failed hand-off is re-requested by the next save or the next press of
  # Clean; two in fifteen minutes is the API unable to reach the table or the
  # worker, which no other alarm sees from this side.
  NoteCleanInvokeFailuresAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: AlarmsEnabled
    Properties:
      AlarmName: !Sub 'chintan-${InstanceName}-${Environment}-note-clean-invoke-failures'
      AlarmDescription: >-
        The API failed twice in fifteen minutes to hand a note to the worker for
        cleaning. The API log names the note and the error; the cleaned view
        stays stale until a save or Clean asks again.
      Namespace: Chintan
      MetricName: NoteCleanInvokeFailures
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  # A stage's own deadline fired (pipeline-deadlines.md): the provider is
  # answering, slowly. One stalled capture counts at most three — one per
  # Lambda attempt — before it lands in the dead-letter queue under that
  # alarm, and each attempt also counts a capture failure above; five in
  # fifteen minutes is more than one recording waiting on a slow provider,
  # the latency outage neither of those alarms names.
  ProviderTimedOutAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: AlarmsEnabled
    Properties:
      AlarmName: !Sub 'chintan-${InstanceName}-${Environment}-provider-timed-out'
      AlarmDescription: >-
        Five or more provider calls ran out of time in fifteen minutes. The
        transcription, cleanup or clean-note provider is stalling; the worker
        log names the stage, and the captures retry on their own.
      Namespace: Chintan
      MetricName: ProviderTimedOut
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 4
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  # A breaker nobody hears about is a silent outage with a good excuse: captures
  # start failing for cost reasons and look identical to failing for technical
  # ones. Only installed when a cap is actually set — at DailySpendCapMicros 0
  # the breaker never rejects, and an alarm that cannot fire is worse than no
  # alarm, because the console shows it green.
  #
  # This was a Metrics Insights query, because SpendCapRejections was emitted
  # through obs.Count — one dimension set, ["Provider","Op"], and so no
  # dimensionless identity for an ordinary alarm to read. The query alarm worked,
  # but Metrics Insights alarms are billed per metric analysed with NO free tier,
  # and these two (prod and staging) were the only charge on an otherwise idle
  # instance: a measured $0.0040/day, about $0.12/month, while every standard
  # alarm here costs nothing.
  #
  # The metric now emits through obs.CountWithRollup, exactly like its siblings
  # ProviderKeyRejected and ProviderRateLimited, which have always been plain
  # alarms with no Dimensions for this reason. The rollup costs one extra metric
  # identity — inside the free ten — and buys back the query-alarm charge.
  # Adding a provider still needs no template edit: the rollup sums across every
  # provider and op by construction.
  SpendCapRejectionsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: SpendCapAlarmEnabled
    Properties:
      AlarmName: !Sub 'chintan-${InstanceName}-${Environment}-spend-cap-tripped'
      AlarmDescription: >-
        The daily spend cap rejected a provider call. Captures are being refused
        on cost, not on failure.
      Namespace: Chintan
      MetricName: SpendCapRejections
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      # The metric does not exist at all until the first rejection, which is the
      # healthy state. Without this the alarm would read INSUFFICIENT_DATA for
      # the entire life of an instance that never trips.
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  # ---------------------------------------------------------------------------
  # Cost ceiling, in the template rather than in a README copy-paste step that
  # nobody performs. Account-scoped on purpose: a tag-filtered budget silently
  # reports zero until Project is activated as a cost allocation tag, and a
  # budget that reads zero is worse than one that reads slightly high.
  # ---------------------------------------------------------------------------
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    # Only with somebody to tell. A budget is account-scoped, so staging's was
    # a second copy of prod's number with no subscriber — clutter in the
    # console and nothing else. Budgets are free; this is tidiness, not cost.
    Condition: HasAlarmEmail
    Properties:
      Budget:
        # Deliberately unnamed, and this is load-bearing rather than an
        # oversight. NotificationsWithSubscribers below is Update-requires-
        # Replacement, so the first deploy that adds, removes or changes a
        # subscriber makes CloudFormation create the replacement budget BEFORE
        # deleting the old one. With a fixed BudgetName the two collide and the
        # deploy fails on
        #
        #   A budget or resource with the same name but a different internalId
        #   already exists.
        #
        # which is exactly what happened the first time ALARM_EMAIL was set: the
        # stack rolled back and the only way forward was deleting the budget by
        # hand. Letting CloudFormation generate the name — it derives one from
        # the stack and logical id — makes every future subscriber change an
        # ordinary replacement. The name is cosmetic; the budget is found by its
        # stack, and its limit and notifications are declared here. The one
        # consumer of the name — the worker's daily aws-cost task, through
        # MONTHLY_BUDGET_NAME and WorkerReadsBudgetPolicy — takes it by !Ref,
        # so a replacement carries it along.
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUSD
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlarmEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlarmEmail

  # The worker may read that one budget, and only when it exists. A separate
  # policy rather than a statement in WorkerFunctionRole because the grant is
  # conditional with the budget and a role's inline statement cannot be; and
  # scoped to the budget's own ARN, not budgets:* — the read is
  # budgets:ViewBudget (the IAM action behind DescribeBudget), which reveals
  # the account's spend. On the worker's role only: the API function never
  # reads it. Budget ARNs carry no region.
  WorkerReadsBudgetPolicy:
    Type: AWS::IAM::Policy
    Condition: HasAlarmEmail
    Properties:
      PolicyName: !Sub 'chintan-${InstanceName}-${Environment}-read-budget'
      Roles:
        - !Ref WorkerFunctionRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - budgets:ViewBudget
            Resource: !Sub 'arn:aws:budgets::${AWS::AccountId}:budget/${MonthlyBudget}'

Outputs:
  # The API's public origin: the custom domain when ApiHost is set, otherwise
  # the execute-api URL. This is what scripts/ci-build-site.sh bakes into the
  # bundle as VITE_API_URL and what the Devices card prints, so setting
  # `api_host` in the config moves the app and every recorder with one deploy.
  ApiEndpoint:
    Description: The API origin the bundle and every device use
    Value: !If
      - HasApiHost
      - !Sub 'https://${ApiHost}'
      - !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'
    Export:
      Name: !Sub '${AWS::StackName}-ApiEndpoint'

  # The execute-api URL, unconditionally. scripts/deploy.sh smokes this one so
  # a deploy proves the Lambda before DNS proves the domain; it smokes
  # ApiEndpoint as well when the two differ.
  ApiGatewayEndpoint:
    Description: HTTP API Gateway endpoint URL, regardless of ApiHost
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'
    Export:
      Name: !Sub '${AWS::StackName}-ApiGatewayEndpoint'

  ApiDomainTarget:
    Condition: HasApiHost
    Description: CNAME ApiHost to this at the DNS provider when DnsZoneId is not set
    Value: !GetAtt ApiDomainName.RegionalDomainName

  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool
    Export:
      Name: !Sub '${AWS::StackName}-UserPoolId'

  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref UserPoolClient
    Export:
      Name: !Sub '${AWS::StackName}-UserPoolClientId'

  UserPoolDomainName:
    Description: Cognito Hosted UI domain prefix
    Value: !Ref UserPoolDomain
    Export:
      Name: !Sub '${AWS::StackName}-UserPoolDomain'

  ContentBucketName:
    Description: S3 Content Bucket Name
    Value: !Ref ContentBucket
    Export:
      Name: !Sub '${AWS::StackName}-ContentBucketName'

  TableName:
    Description: DynamoDB Table Name
    Value: !Ref DynamoDBTable
    Export:
      Name: !Sub '${AWS::StackName}-TableName'

  CaptureDLQUrl:
    Description: Dead-letter queue for worker invocations that failed every retry
    Value: !Ref CaptureDLQ
    Export:
      Name: !Sub '${AWS::StackName}-CaptureDLQUrl'

  WorkerFunctionName:
    Description: Worker Lambda function name
    Value: !Ref WorkerLambdaFunction
    Export:
      Name: !Sub '${AWS::StackName}-WorkerFunctionName'

  AlarmTopicArn:
    Description: SNS topic every alarm publishes to
    Value: !Ref AlarmTopic
    Export:
      Name: !Sub '${AWS::StackName}-AlarmTopicArn'

  ApiFunctionLiveAliasArn:
    Description: Alias the API Gateway integration invokes; move it to roll back
    Value: !Ref ApiLambdaLiveAlias
    Export:
      Name: !Sub '${AWS::StackName}-ApiFunctionLiveAliasArn'

  WorkerFunctionLiveAliasArn:
    Description: Alias S3 and the API invoke (WORKER_FUNCTION_ARN); move it to roll back
    Value: !Ref WorkerLambdaLiveAlias
    Export:
      Name: !Sub '${AWS::StackName}-WorkerFunctionLiveAliasArn'