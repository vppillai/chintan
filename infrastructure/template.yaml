AWSTemplateFormatVersion: '2010-09-09'
Description: 'Chintan Instance Template - Per-instance resources for voice AI application'

Parameters:
  InstanceName:
    Type: String
    Description: Name of the Chintan instance (used in resource naming)
    MinLength: 1
    MaxLength: 32
    AllowedPattern: '^[a-z0-9-]+$'
  
  AllowedOrigin:
    Type: String
    Description: CORS allowed origin for the API
    MinLength: 1
  
  LambdaCodeBucket:
    Type: String
    Description: S3 bucket containing Lambda deployment package
    MinLength: 1
  
  LambdaCodeKey:
    Type: String
    Description: S3 key for Lambda deployment package
    MinLength: 1
  
  Environment:
    Type: String
    Default: prod
    Description: Environment name
    AllowedValues:
      - prod
      - staging
      - dev
  
  PagesHost:
    Type: String
    Description: GitHub Pages host for Cognito callbacks
    MinLength: 1
  
  RepoName:
    Type: String
    Description: Repository name for Cognito callback URLs
    MinLength: 1

  SitePath:
    Type: String
    Default: ''
    Description: >
      The GitHub Pages sub-path this stack's bundle is served from, without
      slashes — the `site_path` field scripts/list-instances.sh resolves for the
      instance config. The Cognito callback and logout URLs are built from it,
      and Cognito matches redirect_uri byte for byte. Empty means "the instance
      name", which is what a prod stack's path is; a staging stack's path is
      `<instance>-staging`, and registering `/<instance>/` for it (which is
      what this template did before the parameter existed) meant every
      staging sign-in ended in redirect_mismatch before the login form.

  WorkerCodeKey:
    Type: String
    MinLength: 1
    Description: >
      S3 key for the worker Lambda deployment package, built from
      backend/cmd/worker. Required, and deliberately without a default.

      It used to default to '' and be read as "share LambdaCodeKey with the API
      function". The API entrypoint is Handler(ctx,
      events.APIGatewayV2HTTPRequest): fed a real SQS event it returns
      {"statusCode":404} with a nil error, and because CaptureEventSourceMapping
      declares FunctionResponseTypes: [ReportBatchItemFailures], Lambda reads a
      success carrying no batchItemFailures key as "the whole batch succeeded"
      and deletes every uploaded recording from the queue on first receive. No
      retry, no DLQ message, no Errors datapoint, no alarm, and GET /v1/health
      still answers — so the deploy reports success while every recording is
      discarded. Failing here, at deploy time, is the cheapest place to catch it.

  AlarmEmail:
    Type: String
    Default: ''
    Description: >
      Email address subscribed to the alarm topic and the budget notifications.
      Empty installs the topic with no subscription, so a clone deploys clean.
    AllowedPattern: '^$|^[^@\s]+@[^@\s]+\.[^@\s]+$'

  EnableAlarms:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >
      Create the CloudWatch alarms for this stack. CloudWatch's always-free
      allowance is ten alarm-months, and this template declares ten alarms, so a
      single environment fits exactly and a second identical environment puts
      half of them outside it — a fixed ~$1.00/month for alarms nobody reads.
      Set false on an environment whose failures are already caught some other
      way; the deploy's own smoke test is what gates staging.

  MonthlyBudgetUSD:
    Type: Number
    Default: 10
    MinValue: 1
    MaxValue: 100000
    Description: Monthly cost budget, in USD, defined here rather than clicked into the console.

  LogRetentionDays:
    Type: Number
    Default: 14
    Description: CloudWatch log retention, set explicitly so groups never default to never-expire.
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1096, 1827, 2192, 2557, 2922, 3288, 3653]

  DailySpendCapMicros:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 1000000000
    Description: >
      Per-tenant, per-day provider spend ceiling in MICRODOLLARS — 1000000 is
      one US dollar, so a ten-dollar day is 10000000. 0 means the meter still
      records every call but the breaker enforces nothing, which is the default
      because a cap that is guessed at is worse than one that is chosen. The
      ceiling here is $1000/day, high enough never to bind and low enough to
      catch a fat-fingered extra zero.

  CognitoTier:
    Type: String
    Default: ESSENTIALS
    AllowedValues: [LITE, ESSENTIALS, PLUS]
    Description: >
      Cognito feature tier. PLUS adds Threat Protection (compromised-credential
      detection and adaptive auth) and is enabled automatically at that tier.
      PLUS also has NO free monthly active users, where LITE and ESSENTIALS
      include 10,000 — so on a single-user instance this is the difference
      between a free user pool and a billed one, to protect one account that
      already requires a verified email and can enable MFA. Raise it to PLUS
      before this serves people who are not you.

  RefreshTokenValidityDays:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 3650
    Description: >
      Cognito refresh token lifetime. Explicit so it shows in a console diff.
      Thirty days: signing in again is one passkey tap on the hosted page, so a
      long-lived refresh token is not what keeps the app usable, and a leaked
      one has a bounded life. It was 7 when the app kept its own sealed copy of
      the token for biometric unlock; that machinery is gone.

Conditions:
  ThreatProtectionAvailable: !Equals [!Ref CognitoTier, 'PLUS']
  HasSitePath: !Not [!Equals [!Ref SitePath, '']]
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, '']]
  HasSpendCap: !Not [!Equals [!Ref DailySpendCapMicros, 0]]
  AlarmsEnabled: !Equals [!Ref EnableAlarms, 'true']
  # The spend-cap alarm needs both: a cap to enforce, and alarms turned on.
  SpendCapAlarmEnabled: !And [!Condition HasSpendCap, !Condition AlarmsEnabled]

Resources:
  # Cognito User Pool
  UserPool:
    Type: AWS::Cognito::UserPool
    # The pool is the identity of every enrolled user. Losing it is not recoverable
    # by redeploying, so the stack never takes it with it.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub 'chintan-${InstanceName}-${Environment}'
      DeletionProtection: ACTIVE
      AutoVerifiedAttributes:
        - email
      UsernameConfiguration:
        CaseSensitive: false
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate:
          - email
      # Compromised-credential detection and adaptive authentication.
      # Threat Protection and the pricing tier are one setting, not two.
      # AdvancedSecurityMode requires PLUS; setting it on an ESSENTIALS pool
      # fails the stack outright with "The following features need to be
      # disabled for the ESSENTIALS pricing tier configured: Threat Protection".
      # Declaring them independently is how that mismatch shipped, so CognitoTier
      # now drives both and they cannot disagree.
      UserPoolTier: !Ref CognitoTier
      UserPoolAddOns: !If
        - ThreatProtectionAvailable
        - AdvancedSecurityMode: ENFORCED
        - !Ref AWS::NoValue
      MfaConfiguration: OPTIONAL
      EnabledMfas:
        - SOFTWARE_TOKEN_MFA
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      # Passkeys, natively. The hosted managed-login page offers "sign in with a
      # passkey" once one is registered, and the browser's platform
      # authenticator (Face ID, Touch ID, Windows Hello) does the rest. This
      # replaces ~2,600 lines of custom WebAuthn, a sealed refresh-token vault
      # and an SSM key the app used to carry for the same tap. The relying
      # party id has to be the domain the ceremony runs on, which is the user
      # pool's managed-login domain — not the Pages host the app is served
      # from. It is built from the same pieces as UserPoolDomain.Domain below.
      WebAuthnRelyingPartyID: !Sub 'chintan-${InstanceName}-${Environment}-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com'
      WebAuthnUserVerification: required
      Policies:
        SignInPolicy:
          AllowedFirstAuthFactors:
            - PASSWORD
            - WEB_AUTHN
        PasswordPolicy:
          MinimumLength: 12
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 3
      Schema:
        - AttributeDataType: String
          Name: email
          Required: true
          Mutable: true
      UserPoolTags:
        Project: chintan
        Instance: !Ref InstanceName
        Application: Chintan

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    # The branding must exist BEFORE this domain starts serving managed login.
    #
    # A version 2 domain with no ManagedLoginBranding for the app client does
    # not fall back to the classic hosted UI — it serves "Login pages
    # unavailable. Please contact an administrator." and sign-in is simply down.
    # That was observed, not guessed: deleting the branding under a version 2
    # domain took the dev pool's sign-in offline until the version was put back.
    #
    # Without this ordering CloudFormation is free to flip the domain first, so
    # every deploy that touched both would open a window where nobody can sign
    # in, and a fresh stack would spend its whole CREATE in that state.
    #
    # The dependency is safe in this direction: CreateManagedLoginBranding is a
    # user-pool + client operation and does not require a domain to exist. That
    # was verified against a throwaway pool with no domain at all.
    DependsOn: ManagedLoginBranding
    Properties:
      # Globally unique, same reasoning as ContentBucket above. Renaming this
      # replaces the domain but NOT the user pool, so existing users survive;
      # only the hosted-UI URL changes, and the frontend reads that from a
      # stack output.
      Domain: !Sub 'chintan-${InstanceName}-${Environment}-${AWS::AccountId}'
      UserPoolId: !Ref UserPool
      # 2 = managed login; 1 = the classic hosted UI. This is the switch that
      # makes ManagedLoginBranding below visible at all — the branding resource
      # applies cleanly against a version 1 domain and then renders nothing,
      # which looks like a broken deploy rather than a missing setting.
      #
      # It changes how the sign-in page is drawn, not what it does: the domain
      # name, the OAuth endpoints, the callback URLs and the app client are all
      # untouched, and the frontend goes on calling /oauth2/authorize.
      ManagedLoginVersion: 2

  # Cognito User Pool Client (public, no secret)
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub 'chintan-${InstanceName}-${Environment}-client'
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        # Choice-based sign-in, which is what lets managed login offer the
        # passkey the pool's SignInPolicy allows.
        - ALLOW_USER_AUTH
      AllowedOAuthFlows:
        - code
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      CallbackURLs:
        - !Sub
          - 'https://${PagesHost}/${RepoName}/${Path}/'
          - Path: !If [HasSitePath, !Ref SitePath, !Ref InstanceName]
      LogoutURLs:
        - !Sub
          - 'https://${PagesHost}/${RepoName}/${Path}/'
          - Path: !If [HasSitePath, !Ref SitePath, !Ref InstanceName]
      SupportedIdentityProviders:
        - COGNITO
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AuthSessionValidity: 3
      # Explicit, because the defaults (1 hour / 30 days) are invisible in the
      # console diff.
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: !Ref RefreshTokenValidityDays


  # Managed login branding — the hosted sign-in page, in the app's own palette.
  #
  # The sign-in page is the first screen a user sees and, unbranded, it was the
  # only screen in the product that was not Chintan: AWS blue on grey, Helvetica,
  # square corners. Classic hosted-UI CSS customisation cannot fix that — it
  # exposes a fixed handful of properties and no dark variant — so this uses
  # managed login, which is included at the ESSENTIALS tier the pool already
  # runs on (see UserPoolTier above) and costs nothing extra.
  #
  # Every colour below is a token from frontend/src/styles/tokens.css, whose
  # contrast ratios were computed rather than estimated after v1 shipped four
  # tokens that failed AA. Nothing here invents a hue. In particular:
  #
  #   * The primary button is --color-ink, not --color-accent. shell.css says
  #     the record button is "the only element permitted to use --color-accent",
  #     and every .*__action--primary in the app is an ink fill on ground.
  #   * Links are --color-ink, because base.css sets `a { color: inherit }` —
  #     the app distinguishes links by underline, never by hue.
  #   * The error alert IS the accent. The palette defines no red; the accent is
  #     the app's one "consequential" signal and already carries the destructive
  #     dialog.
  #
  # colorSchemeMode DYNAMIC follows prefers-color-scheme, exactly as the app's
  # "system" theme does. Without it a Nocturne user gets a white flash at night,
  # which is the case the dark theme exists for. LIGHT is Ink & Paper, DARK is
  # Nocturne.
  #
  # The logo is the shipped app icon (frontend/public/icon-192.png), not a new
  # mark. The shipped PNG has an opaque --color-ground square baked in, which
  # would read as a cream tile on Nocturne, so each variant carries the same
  # artwork with the ground recovered to transparency and the foreground mapped
  # to that theme's --color-ink / --color-accent.
  ManagedLoginBranding:
    Type: AWS::Cognito::ManagedLoginBranding
    Properties:
      UserPoolId: !Ref UserPool
      ClientId: !Ref UserPoolClient
      # Cognito merges its defaults under these, so only what differs is stated.
      UseCognitoProvidedValues: false
      Settings:
