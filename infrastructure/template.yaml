AWSTemplateFormatVersion: '2010-09-09'
Description: 'Chintan Instance Template - Per-instance resources for voice AI application'

Parameters:
  InstanceName:
    Type: String
    Description: Name of the Chintan instance (used in resource naming)
    MinLength: 1
    MaxLength: 32
    AllowedPattern: '^[a-z0-9-]+$'
  
  AllowedOrigin:
    Type: String
    Description: CORS allowed origin for the API
    MinLength: 1
  
  LambdaCodeBucket:
    Type: String
    Description: S3 bucket containing Lambda deployment package
    MinLength: 1
  
  LambdaCodeKey:
    Type: String
    Description: S3 key for Lambda deployment package
    MinLength: 1
  
  Environment:
    Type: String
    Default: prod
    Description: Environment name
    AllowedValues:
      - prod
      - staging
      - dev
  
  SiteBaseUrl:
    Type: String
    MinLength: 8
    AllowedPattern: '^https://[^/]+(/[^/]+)*$'
    Description: >
      Where the bundles are served from, without the instance's site path and
      without a trailing slash: https://<owner>.github.io/<repo> on GitHub
      Pages, or https://app.example.com behind a custom domain (`app_host` in
      config/instances/*.yaml). The Cognito callback and logout URLs are this
      base, a slash, the site path and a slash, and Cognito matches
      redirect_uri byte for byte. Computed by scripts/ci-deploy-stack.sh. It
      replaced the PagesHost and RepoName pair, which could only spell the
      Pages form of that URL.

  ApiHost:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'
    Description: >
      Custom hostname for the API, e.g. api.example.com — `api_host` in
      config/instances/*.yaml. Empty, the default, leaves the API on its
      execute-api URL and creates nothing: ApiCertificate, ApiDomainName,
      ApiMapping and ApiAliasRecord all carry Condition HasApiHost. Set, the
      stack requests an ACM certificate for the name (DNS validation, free),
      fronts the HTTP API with it, and the ApiEndpoint output becomes
      https://<ApiHost> — which scripts/ci-build-site.sh bakes into the bundle
      as VITE_API_URL and the Devices card hands to every recorder.

  DnsZoneId:
    Type: String
    Default: ''
    Description: >
      Route 53 hosted zone that holds ApiHost — `dns_zone_id` in the instance
      config. Set, the stack writes the certificate's validation CNAME and the
      API's alias record itself and the deploy completes unattended. Empty, the
      two records are yours to create at the DNS provider: the validation
      CNAME is printed in the stack events while ApiCertificate waits for it,
      and the API's target is the ApiDomainTarget output. Ignored without
      ApiHost. The stack never creates a zone: a zone costs $0.50 a month and
      outlives any stack, so it is the owner's decision, not a resource here.

  SitePath:
    Type: String
    Default: ''
    Description: >
      The GitHub Pages sub-path this stack's bundle is served from, without
      slashes — the `site_path` field scripts/list-instances.sh resolves for the
      instance config. The Cognito callback and logout URLs are built from it,
      and Cognito matches redirect_uri byte for byte. Empty means "the instance
      name", which is what a prod stack's path is; a staging stack's path is
      `<instance>-staging`, and registering `/<instance>/` for it (which is
      what this template did before the parameter existed) meant every
      staging sign-in ended in redirect_mismatch before the login form.

  PasskeyRelyingPartyID:
    Type: String
    Default: ''
    MaxLength: 63
    Description: >
      The WebAuthn relying party for Cognito passkeys: the pool's managed-login
      domain, which is where the ceremony runs (not the Pages host the app is
      served from). Cognito caps it at 63 characters, and a prefix domain of the
      form chintan-<instance>-<environment>-<account>.auth.<region>.amazoncognito.com
      is 62 for "prod" and 65 for "staging", so it is computed by
      scripts/ci-deploy-stack.sh and passed only when it fits. Empty leaves the
      pool password-only, which is what a staging pool with no users needs.

  WorkerCodeKey:
    Type: String
    MinLength: 1
    Description: >
      S3 key for the worker Lambda deployment package, built from
      backend/cmd/worker. Required, and deliberately without a default.

      An empty default would be read as "share LambdaCodeKey with the API
      function". The API entrypoint is Handler(ctx,
      events.APIGatewayV2HTTPRequest): fed the S3 notification for a recording it
      returns {"statusCode":404} with a nil error, which Lambda reads as a
      successful asynchronous invocation and never retries. No retry, no DLQ
      message, no Errors datapoint, no alarm, and GET /v1/health still answers —
      so the deploy reports success while every recording is discarded. Failing
      here, at deploy time, is the cheapest place to catch it.

  AlarmEmail:
    Type: String
    Default: ''
    # NoEcho: an e-mail address is personal data, and without it DescribeStacks
    # returns the value to anything that can read the stack — the build role any
    # branch of the repository can assume included. The subscription and the
    # budget still receive the real value; only the parameter readback is masked.
    NoEcho: true
    Description: >
      Email address subscribed to the alarm topic and the budget notifications.
      Empty installs the topic with no subscription, so a clone deploys clean.
    AllowedPattern: '^$|^[^@\s]+@[^@\s]+\.[^@\s]+$'

  EnableAlarms:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >
      Create the CloudWatch alarms for this stack. The template declares
      fifteen (fourteen, plus the spend-cap alarm when a cap is set): API
      function errors, a gateway 4xx flood, a gateway 5xx count, refused inbox
      keys, the capture dead-letter queue, a rejected provider key, failed
      captures, failed push sends, a failed expiry purge, a worker message it
      could not read, a clean the API could not hand to the worker, provider
      calls running out of time, a capture a run left in a stage, a stuck
      capture the reconcile task gave up on, and the spend cap. CloudWatch's
      always-free allowance is ten alarm-months for the whole account, so the
      five above it are billed at $0.10 an alarm-month, and a second
      environment's copies are billed in full. Set false on an environment whose
      failures are already caught some other way; the deploy's own smoke test
      is what gates staging.

  MonthlyBudgetUSD:
    Type: Number
    Default: 10
    MinValue: 1
    MaxValue: 100000
    Description: Monthly cost budget, in USD, defined here rather than clicked into the console.

  LogRetentionDays:
    Type: Number
    Default: 14
    Description: CloudWatch log retention, set explicitly so groups never default to never-expire.
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1096, 1827, 2192, 2557, 2922, 3288, 3653]

  DailySpendCapMicros:
    Type: Number
    Default: 5000000
    MinValue: 0
    MaxValue: 1000000000
    Description: >
      Instance-wide, per-day provider spend ceiling in MICRODOLLARS — 1000000
      is one US dollar, so a ten-dollar day is 10000000. One counter for the
      whole instance, the SPEND#<day> row in the table; every paid call
      reserves against it first. The default is $5/day, about a hundred times
      a single user's heaviest day, so a fresh instance is bounded before
      anyone has thought about it: a runaway retry loop or a leaked login
      stops at five dollars, not at the monthly budget email. 0 disables the
      cap — the counter still records every call, the breaker enforces nothing
      and the spend-cap alarm is not created. Do this only deliberately, for an
      instance whose bill is bounded some other way. The ceiling here is
      $1000/day, high enough never to bind and low enough to catch a
      fat-fingered extra zero.

  CognitoTier:
    Type: String
    Default: ESSENTIALS
    AllowedValues: [LITE, ESSENTIALS, PLUS]
    Description: >
      Cognito feature tier. PLUS adds Threat Protection (compromised-credential
      detection and adaptive auth) and is enabled automatically at that tier.
      PLUS also has NO free monthly active users, where LITE and ESSENTIALS
      include 10,000 — so on a single-user instance this is the difference
      between a free user pool and a billed one, to protect one account that
      already requires a verified email and can enable MFA. Raise it to PLUS
      before this serves people who are not you.

  RefreshTokenValidityDays:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 3650
    Description: >
      Cognito refresh token lifetime. Explicit so it shows in a console diff.
      Thirty days: signing in again is one passkey tap on the hosted page, so a
      long-lived refresh token is not what keeps the app usable, and a leaked
      one has a bounded life. It was 7 when the app kept its own sealed copy of
      the token for biometric unlock; that machinery is gone.

Conditions:
  ThreatProtectionAvailable: !Equals [!Ref CognitoTier, 'PLUS']
  HasSitePath: !Not [!Equals [!Ref SitePath, '']]
  # The custom API domain. Both false on every deploy that has no `api_host`,
  # so the four resources they guard do not exist and today's stacks are
  # unchanged; scripts/check-custom-domain-dormant.sh holds them to that.
  HasApiHost: !Not [!Equals [!Ref ApiHost, '']]
  HasDnsZone: !And [!Condition HasApiHost, !Not [!Equals [!Ref DnsZoneId, '']]]
  HasPasskeys: !Not [!Equals [!Ref PasskeyRelyingPartyID, '']]
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, '']]
  HasSpendCap: !Not [!Equals [!Ref DailySpendCapMicros, 0]]
  AlarmsEnabled: !Equals [!Ref EnableAlarms, 'true']
  # The spend-cap alarm needs both: a cap to enforce, and alarms turned on.
  SpendCapAlarmEnabled: !And [!Condition HasSpendCap, !Condition AlarmsEnabled]

Resources:
  # Cognito User Pool
  UserPool:
    Type: AWS::Cognito::UserPool
    # The pool is the identity of every enrolled user. Losing it is not recoverable
    # by redeploying, so the stack never takes it with it.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub 'chintan-${InstanceName}-${Environment}'
      DeletionProtection: ACTIVE
      # Accounts are created by scripts/invite-user.sh (admin-create-user) and
      # by nothing else. Cognito's default is self sign-up: the managed-login
      # page offers "Create an account" to anyone who reads the public client
      # id out of the bundle, and a stranger's recordings would then run
      # against the shared provider keys, the instance-wide spend cap and the
      # one API throttle, so the owner's own captures fail with spend_capped.
      # This is an in-place update (the property is mutable), so deploy.sh's
      # replacement guard is not involved.
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      AutoVerifiedAttributes:
        - email
      UsernameConfiguration:
        CaseSensitive: false
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate:
          - email
      # Compromised-credential detection and adaptive authentication.
      # Threat Protection and the pricing tier are one setting, not two.
      # AdvancedSecurityMode requires PLUS; setting it on an ESSENTIALS pool
      # fails the stack outright with "The following features need to be
      # disabled for the ESSENTIALS pricing tier configured: Threat Protection".
      # Declaring them independently is how that mismatch shipped, so CognitoTier
      # now drives both and they cannot disagree.
      UserPoolTier: !Ref CognitoTier
      UserPoolAddOns: !If
        - ThreatProtectionAvailable
        - AdvancedSecurityMode: ENFORCED
        - !Ref AWS::NoValue
      MfaConfiguration: OPTIONAL
      EnabledMfas:
        - SOFTWARE_TOKEN_MFA
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      # Passkeys, natively. The hosted managed-login page offers "sign in with a
      # passkey" once one is registered, and the browser's platform
      # authenticator (Face ID, Touch ID, Windows Hello) does the rest. Nothing
      # in the app implements WebAuthn, holds a refresh-token vault or carries
      # an SSM key for the same tap: the pool owns the ceremony. The relying
      # party id has to be the domain the ceremony runs on, which is the user
      # pool's managed-login domain — not the Pages host the app is served
      # from; see the PasskeyRelyingPartyID parameter for why it arrives as one.
      WebAuthnRelyingPartyID: !If [HasPasskeys, !Ref PasskeyRelyingPartyID, !Ref AWS::NoValue]
      WebAuthnUserVerification: !If [HasPasskeys, required, !Ref AWS::NoValue]
      Policies:
        SignInPolicy:
          AllowedFirstAuthFactors: !If [HasPasskeys, [PASSWORD, WEB_AUTHN], [PASSWORD]]
        PasswordPolicy:
          MinimumLength: 12
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 3
      Schema:
        - AttributeDataType: String
          Name: email
          Required: true
          Mutable: true
      UserPoolTags:
        Project: chintan
        Instance: !Ref InstanceName
        Application: Chintan

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    # The branding must exist BEFORE this domain starts serving managed login.
    #
    # A version 2 domain with no ManagedLoginBranding for the app client does
    # not fall back to the classic hosted UI — it serves "Login pages
    # unavailable. Please contact an administrator." and sign-in is simply down.
    # That was observed, not guessed: deleting the branding under a version 2
    # domain took the dev pool's sign-in offline until the version was put back.
    #
    # Without this ordering CloudFormation is free to flip the domain first, so
    # every deploy that touched both would open a window where nobody can sign
    # in, and a fresh stack would spend its whole CREATE in that state.
    #
    # The dependency is safe in this direction: CreateManagedLoginBranding is a
    # user-pool + client operation and does not require a domain to exist. That
    # was verified against a throwaway pool with no domain at all.
    DependsOn: ManagedLoginBranding
    Properties:
      # Globally unique, same reasoning as ContentBucket above. Renaming this
      # replaces the domain but NOT the user pool, so existing users survive;
      # only the hosted-UI URL changes, and the frontend reads that from a
      # stack output.
      Domain: !Sub 'chintan-${InstanceName}-${Environment}-${AWS::AccountId}'
      UserPoolId: !Ref UserPool
      # 2 = managed login; 1 = the classic hosted UI. This is the switch that
      # makes ManagedLoginBranding below visible at all — the branding resource
      # applies cleanly against a version 1 domain and then renders nothing,
      # which looks like a broken deploy rather than a missing setting.
      #
      # It changes how the sign-in page is drawn, not what it does: the domain
      # name, the OAuth endpoints, the callback URLs and the app client are all
      # untouched, and the frontend goes on calling /oauth2/authorize.
      ManagedLoginVersion: 2

  # Cognito User Pool Client (public, no secret)
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub 'chintan-${InstanceName}-${Environment}-client'
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        # Choice-based sign-in, which is what lets managed login offer the
        # passkey the pool's SignInPolicy allows.
        - ALLOW_USER_AUTH
      AllowedOAuthFlows:
        - code
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - openid
        - email
        - profile
        # No aws.cognito.signin.user.admin. It was added in #30 for an in-app
        # passkey list that never shipped, and with it every access token in
        # localStorage could call DeleteUser, change the recovery email, strip
        # passkeys or enrol a TOTP for an hour. Re-add it with the feature
        # that calls those APIs — frontend first (oauth.ts SCOPES), so no
        # client requests a scope the pool no longer grants.
      CallbackURLs:
        - !Sub
          - '${SiteBaseUrl}/${Path}/'
          - Path: !If [HasSitePath, !Ref SitePath, !Ref InstanceName]
      LogoutURLs:
        - !Sub
          - '${SiteBaseUrl}/${Path}/'
          - Path: !If [HasSitePath, !Ref SitePath, !Ref InstanceName]
      SupportedIdentityProviders:
        - COGNITO
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AuthSessionValidity: 3
      # Explicit, because the defaults (1 hour / 30 days) are invisible in the
      # console diff.
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: !Ref RefreshTokenValidityDays


  # Managed login branding — the hosted sign-in page, in the app's own palette.
  #
  # The sign-in page is the first screen a user sees and, unbranded, it was the
  # only screen in the product that was not Chintan: AWS blue on grey, Helvetica,
  # square corners. Classic hosted-UI CSS customisation cannot fix that — it
  # exposes a fixed handful of properties and no dark variant — so this uses
  # managed login, which is included at the ESSENTIALS tier the pool already
  # runs on (see UserPoolTier above) and costs nothing extra.
  #
  # Every colour below is a token from frontend/src/styles/tokens.css, whose
  # contrast ratios are computed, not estimated: an estimated pair can fail AA
  # while looking fine. Nothing here invents a hue. In particular:
  #
  #   * The primary button is --color-ink, not --color-accent. shell.css says
  #     the record button is "the only element permitted to use --color-accent",
  #     and every .*__action--primary in the app is an ink fill on ground.
  #   * Links are --color-ink, because base.css sets `a { color: inherit }` —
  #     the app distinguishes links by underline, never by hue.
  #   * The error alert IS the accent. The palette defines no red; the accent is
  #     the app's one "consequential" signal and already carries the destructive
  #     dialog.
  #
  # colorSchemeMode DYNAMIC follows prefers-color-scheme, exactly as the app's
  # "system" theme does. Without it a Nocturne user gets a white flash at night,
  # which is the case the dark theme exists for. LIGHT is Ink & Paper, DARK is
  # Nocturne.
  #
  # The logo is the app's mark, the Bindu C (docs/design/branding/bindu-*.svg),
  # on a transparent ground so it sits on the form in either theme rather than
  # as a cream tile on Nocturne: infrastructure/branding/cognito-logo-light.svg
  # draws the ring in --color-ink and the bindu in --color-accent, and
  # cognito-logo-dark.svg the same in Nocturne's ink and accent. The Assets
  # bytes below are those two SVGs rendered at 192 px — the PNG as FORM_LOGO
  # and the same PNG in a one-image ICO wrapper as FAVICON_ICO, since the
  # resource takes bytes inline and the favicon must be ICO or SVG. They are
  # generated, never edited: `cd frontend && node scripts/make-icons.mjs
  # --cognito` prints the whole Assets block to paste over this one.
  ManagedLoginBranding:
    Type: AWS::Cognito::ManagedLoginBranding
    Properties:
      UserPoolId: !Ref UserPool
      ClientId: !Ref UserPoolClient
      # Cognito merges its defaults under these, so only what differs is stated.
      UseCognitoProvidedValues: false
      Settings:
        components:
          pageBackground:
            image:
              enabled: false
            lightMode:
              color: fbf9f4ff
            darkMode:
              color: 0a0c0bff
          pageHeader:
            backgroundImage:
              enabled: false
            logo:
              location: START
              enabled: false
            lightMode:
              borderColor: e4dfd2ff
              background:
                color: f2eee4ff
            darkMode:
              borderColor: 242a27ff
              background:
                color: 141816ff
          pageFooter:
            backgroundImage:
              enabled: false
            logo:
              location: START
              enabled: false
            lightMode:
              borderColor: e4dfd2ff
              background:
                color: f2eee4ff
            darkMode:
              borderColor: 242a27ff
              background:
                color: 141816ff
          pageText:
            lightMode:
              headingColor: 1a1917ff
              bodyColor: 534f48ff
              descriptionColor: 716a5bff
            darkMode:
              headingColor: f2f5f3ff
              bodyColor: a4aca8ff
              descriptionColor: 7c8c82ff
          form:
            borderRadius: 20.0
            backgroundImage:
              enabled: false
            logo:
              location: CENTER
              position: TOP
              enabled: true
              formInclusion: IN
            lightMode:
              backgroundColor: f5f1e8ff
              borderColor: 8a8478ff
            darkMode:
              backgroundColor: 1c211fff
              borderColor: 5e6e66ff
          primaryButton:
            lightMode:
              defaults:
                backgroundColor: 1a1917ff
                textColor: fbf9f4ff
              hover:
                backgroundColor: 534f48ff
                textColor: fbf9f4ff
              active:
                backgroundColor: 534f48ff
                textColor: fbf9f4ff
              disabled:
                backgroundColor: e4dfd2ff
                borderColor: e4dfd2ff
            darkMode:
              defaults:
                backgroundColor: f2f5f3ff
                textColor: 0a0c0bff
              hover:
                backgroundColor: a4aca8ff
                textColor: 0a0c0bff
              active:
                backgroundColor: a4aca8ff
                textColor: 0a0c0bff
              disabled:
                backgroundColor: 242a27ff
                borderColor: 242a27ff
          secondaryButton:
            lightMode:
              defaults:
                backgroundColor: fbf9f4ff
                borderColor: 8a8478ff
                textColor: 1a1917ff
              hover:
                backgroundColor: f2eee4ff
                borderColor: 1a1917ff
                textColor: 1a1917ff
              active:
                backgroundColor: e4dfd2ff
                borderColor: 1a1917ff
                textColor: 1a1917ff
            darkMode:
              defaults:
                backgroundColor: 0a0c0bff
                borderColor: 5e6e66ff
                textColor: f2f5f3ff
              hover:
                backgroundColor: 141816ff
                borderColor: f2f5f3ff
                textColor: f2f5f3ff
              active:
                backgroundColor: 242a27ff
                borderColor: f2f5f3ff
                textColor: f2f5f3ff
          alert:
            borderRadius: 14.0
            lightMode:
              error:
                backgroundColor: f2eee4ff
                borderColor: c2410cff
            darkMode:
              error:
                backgroundColor: 141816ff
                borderColor: b8f135ff
          idpButton:
            standard:
              lightMode:
                defaults:
                  backgroundColor: fbf9f4ff
                  borderColor: 8a8478ff
                  textColor: 1a1917ff
                hover:
                  backgroundColor: f2eee4ff
                  borderColor: 1a1917ff
                  textColor: 1a1917ff
                active:
                  backgroundColor: e4dfd2ff
                  borderColor: 1a1917ff
                  textColor: 1a1917ff
              darkMode:
                defaults:
                  backgroundColor: 0a0c0bff
                  borderColor: 5e6e66ff
                  textColor: f2f5f3ff
                hover:
                  backgroundColor: 141816ff
                  borderColor: f2f5f3ff
                  textColor: f2f5f3ff
                active:
                  backgroundColor: 242a27ff
                  borderColor: f2f5f3ff
                  textColor: f2f5f3ff
            custom: {}
          favicon:
            enabledTypes:
            - ICO
          phoneNumberSelector:
            displayType: TEXT
        componentClasses:
          buttons:
            borderRadius: 22.0
          input:
            borderRadius: 8.0
            lightMode:
              defaults:
                backgroundColor: fbf9f4ff
                borderColor: 8a8478ff
              placeholderColor: 716a5bff
            darkMode:
              defaults:
                backgroundColor: 0a0c0bff
                borderColor: 5e6e66ff
              placeholderColor: 7c8c82ff
          inputDescription:
            lightMode:
              textColor: 716a5bff
