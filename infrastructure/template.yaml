              enabled: false
            logo:
              location: START
              enabled: false
            lightMode:
              borderColor: e4dfd2ff
              background:
                color: f2eee4ff
            darkMode:
              borderColor: 242a27ff
              background:
                color: 141816ff
          pageFooter:
            backgroundImage:
              enabled: false
            logo:
              location: START
              enabled: false
            lightMode:
              borderColor: e4dfd2ff
              background:
                color: f2eee4ff
            darkMode:
              borderColor: 242a27ff
              background:
                color: 141816ff
          pageText:
            lightMode:
              headingColor: 1a1917ff
              bodyColor: 534f48ff
              descriptionColor: 716a5bff
