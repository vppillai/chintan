              bodyColor: a4aca8ff
              descriptionColor: 7c8c82ff
          form:
            borderRadius: 20.0
            backgroundImage:
              enabled: false
            logo:
              location: CENTER
              position: TOP
              enabled: true
              formInclusion: IN
            lightMode:
              backgroundColor: f5f1e8ff
              borderColor: 8a8478ff
            darkMode:
              backgroundColor: 1c211fff
              borderColor: 5e6e66ff
          primaryButton:
            lightMode:
              defaults:
                backgroundColor: 1a1917ff
                textColor: fbf9f4ff
              hover:
                backgroundColor: 534f48ff
                textColor: fbf9f4ff
              active:
                backgroundColor: 534f48ff
                textColor: fbf9f4ff
              disabled:
                backgroundColor: e4dfd2ff
                borderColor: e4dfd2ff
            darkMode:
              defaults:
                backgroundColor: f2f5f3ff
                textColor: 0a0c0bff
              hover:
                backgroundColor: a4aca8ff
                textColor: 0a0c0bff
              active:
                backgroundColor: a4aca8ff
                textColor: 0a0c0bff
              disabled:
                backgroundColor: 242a27ff
                borderColor: 242a27ff
          secondaryButton:
            lightMode:
              defaults:
                backgroundColor: fbf9f4ff
