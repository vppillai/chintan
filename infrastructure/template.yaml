              enabled: false
            logo:
              location: START
              enabled: false
            lightMode:
              borderColor: e4dfd2ff
              background:
                color: f2eee4ff
            darkMode:
              borderColor: 242a27ff
              background:
                color: 141816ff
          pageFooter:
            backgroundImage:
              enabled: false
            logo:
              location: START
              enabled: false
