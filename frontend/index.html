<!doctype html>
<html lang="en" data-theme="ink">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="description" content="Speak a thought. It files itself." />
    <meta name="color-scheme" content="light dark" />
    <!-- iOS standalone: without these the app opens in Safari chrome from the
         home screen, and the status bar sits over the header. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Chintan" />
    <!--
      Base-absolute, not relative. A bare `icon-192.png` resolves against the
      *document's* directory, so on a deep link such as /chintan/dev/notes/x it
      asked for /chintan/dev/notes/icon-192.png and got a 404 — the icons only
      loaded on paths that happened to sit one level down. Vite substitutes
      %BASE_URL% with the same value the bundle's own asset URLs use.
    -->
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%icon-192.png" />
    <title>Chintan</title>
    <script type="text/javascript">
      // Undoes the redirect public/404.html made for a path GitHub Pages has
      // no server-side route for, restoring the real URL before the router
      // ever reads `window.location`. See 404.html for why this exists.
      //
      // Adapted from the "spa-github-pages" trick (rafgraph, MIT License,
      // https://github.com/rafgraph/spa-github-pages).
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
    <script>
      /*
       * Theme pre-paint. The stylesheet resolves `system` with a media query,
       * so all this has to do is restore the stored preference before first
       * paint — otherwise a Nocturne user sees a frame of Ink & Paper on every
       * cold start. Inline and synchronous by necessity; kept to the minimum.
       */
      try {
        var stored = localStorage.getItem('chintan.theme');
        if (stored === 'ink' || stored === 'nocturne' || stored === 'system') {
          document.documentElement.setAttribute('data-theme', stored);
        }
      } catch (e) {
        /* Storage denied. The default theme applies. */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
