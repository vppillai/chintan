# Staging for the `dev` instance.
#
# Same `name` as config/instances/dev.yaml, different `environment`, therefore a
# different stack: chintan-dev-staging alongside chintan-dev-prod. Every deploy
# reaches this stack first and its smoke test gates the prod job, so a template
# or Lambda change that fails on real AWS fails somewhere that has no user data.
#
# Its own Cognito user pool, DynamoDB table and S3 bucket. Nothing is shared with
# prod except the SSM provider keys under /chintan/dev/, which is why
# cleanup-aws.sh refuses to delete those while any other chintan-dev-* stack
# still exists.
name: dev
environment: staging
site_path: dev-staging
display_name: Chintan Dev (staging)
pwa:
  name: Chintan Staging
  short_name: Chintan-stg
  description: Voice brain-dump notes (staging)
  theme_color: "#1B4332"
  background_color: "#F7F3EB"

# Instance-wide, per-day provider spend ceiling in MICRODOLLARS: 1000000 = $1,
# so this is $2/day — lower than prod because nothing here is user data and a smoke
# test should never approach it. The worker reserves against one SPEND#<day>
# counter before every paid call and fails a capture that would cross the line
# with status spend_capped. A zero (or absent) value means count but never
# enforce, and leaves the spend-cap-tripped alarm uncreated.
#
# The cap itself stays on here even with enable_alarms false: it is enforced in
# the worker, costs nothing, and is the thing that actually stops a runaway
# loop; only the alarm about it is skipped.
daily_spend_cap_micros: 2000000

# No CloudWatch alarms here.
#
# CloudWatch's always-free allowance is ten alarm-months for the whole account,
# and the account's other project holds alarms too. The template declares four
# — API function errors, the worker dead-letter queue (a lost capture or a
# failed expiry sweep), a rejected provider key, and the spend cap — and this
# stack's copies would be billed at $0.10 each to duplicate alarms that nobody
# is subscribed to and that watch no user data.
#
# Staging is not left unwatched: every deploy reaches it before prod and its
# smoke test gates the prod job, so a broken Lambda or template fails the
# pipeline here, loudly, before an alarm would have had anything to say. It did
# exactly that twice on 2026-09-03.
enable_alarms: false
