name: dev

# What the app calls itself: the document title, the PWA manifest's name, the
# shell's wordmark and the heading of About all come from here at build time.
# `short_name` (the home-screen label, 12 characters at most) defaults to it.
# Colours are not configured per instance; the design tokens own them.
display_name: Chintan
description: Speak a thought. It files itself.

# Instance-wide, per-day provider spend ceiling in MICRODOLLARS: 1000000 = $1,
# so this is $5/day — the same as the template default, written out so the
# number is chosen here rather than inherited. One SPEND#<day> counter for the
# whole instance; the worker reserves against it before every paid call and a
# capture that would cross it fails with status spend_capped. An explicit 0
# disables the cap: the template's HasSpendCap goes false and the
# chintan-dev-prod-spend-cap-tripped alarm is never created, which leaves a
# runaway provider loop bounded only by the monthly Budgets email.
daily_spend_cap_micros: 5000000

# Alarms default on: API function errors, the worker dead-letter queue (a
# capture or a scheduled or queued worker task — sweep-expired, aws-cost,
# storage-snapshot, clean-note, ask — that exhausted its retries), a rejected
# provider key, and the spend cap above.
# The address they e-mail comes from the ALARM_EMAIL repository secret, not from
# this public file. The first user is created with scripts/invite-user.sh.
