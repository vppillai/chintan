name: dev

# What the app calls itself: the document title, the PWA manifest's name, the
# shell's wordmark and the heading of About all come from here at build time.
# `short_name` (the home-screen label, 12 characters at most) defaults to it.
# Colours are not configured per instance; the design tokens own them.
display_name: Chintan
description: Speak a thought. It files itself.

# Per-day provider spend ceiling in MICRODOLLARS (1000000 = $1): $5/day, the
# template default written out so the number is chosen here. What the cap does,
# and what 0 means, is the DailySpendCapMicros parameter description in
# infrastructure/template.yaml.
daily_spend_cap_micros: 5000000

# Alarms default on: thirteen per stack, each with its threshold and what to do
# in docs/ops/alarms.md. The address they e-mail comes from the ALARM_EMAIL
# repository secret, not from this public file. The first user is created with
# scripts/invite-user.sh.

# Web Push: a notification when a recording files, even with the app closed.
# On (the default) the setup scripts install the VAPID pair under /chintan/dev/;
# README → Configure → Notifications has the rest.
web_push: true
