# Instance-wide, per-day provider spend ceiling in MICRODOLLARS: 1000000 = $1,
# so this is $5/day. Without a non-zero value here the template's HasSpendCap is
# false and the chintan-dev-prod-spend-cap-tripped alarm is never created, which
# leaves a runaway provider loop bounded only by the monthly Budgets email.
daily_spend_cap_micros: 5000000

